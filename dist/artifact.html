<title>Cinder Vale</title>
<div id="app">
  <canvas id="game"></canvas>
  <div id="overlay"></div>
  <div id="toasts"></div>
</div>
<style>
:root {
  --ash-0: #0d0b10;
  --ash-1: #16131c;
  --ash-2: #221d2b;
  --ash-3: #332b40;
  --ash-4: #4a4358;
  --text: #d7d2e0;
  --text-dim: #948da6;
  --ember: #f06c3a;
  --ember-dim: #a5451f;
  --gold: #ffd166;
  --blood: #c33636;
  --mana: #6fb3ff;
  --stam: #7cc46a;
  --ui-font: "Segoe UI", Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  width: 100%; height: 100%;
  background: #000;
  color: var(--text);
  font-family: var(--ui-font);
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

#app { position: fixed; inset: 0; display: block; }

#game {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  background: #0d0b10;
  touch-action: none;
}

#overlay {
  position: absolute; inset: 0;
  display: none;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background: rgba(8, 6, 12, 0.82);
  backdrop-filter: blur(3px);
  z-index: 10;
  overflow: hidden;
}
#overlay.open { display: block; }

/* ---------- Pannelli ---------- */
.panel {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  max-width: 720px; margin: 0 auto;
}

.panel-head {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 14px 10px;
  border-bottom: 2px solid var(--ash-3);
  background: linear-gradient(180deg, var(--ash-2), var(--ash-1));
  flex: 0 0 auto;
}
.panel-head h2 {
  font-size: 15px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--gold); font-weight: 700; flex: 1;
}
.panel-body { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 12px 24px; }
.panel-foot { flex: 0 0 auto; padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 2px solid var(--ash-3); background: var(--ash-1); }

.tabs { display: flex; gap: 4px; padding: 8px 10px 0; background: var(--ash-1); flex: 0 0 auto; flex-wrap: wrap; }
.tabs.inv-filter-bar {
  position: sticky; top: 0; z-index: 5;
  margin: -10px -12px 8px;
  padding: 8px 12px 8px;
  background: var(--ash-1);
  border-bottom: 1px solid var(--ash-3);
}
.tab {
  flex: 1 1 auto; min-width: 68px;
  padding: 9px 6px; font-size: 11px; letter-spacing: .5px; text-transform: uppercase;
  background: var(--ash-2); color: var(--text-dim);
  border: 1px solid var(--ash-3); border-bottom: none;
  border-radius: 5px 5px 0 0; cursor: pointer; text-align: center; font-weight: 600;
}
.tab.active { background: var(--ash-3); color: var(--gold); box-shadow: inset 0 2px 0 var(--ember); }

button, .btn {
  font-family: var(--ui-font); font-size: 13px; font-weight: 600;
  color: var(--text); background: var(--ash-3);
  border: 1px solid var(--ash-4); border-radius: 6px;
  padding: 11px 14px; cursor: pointer; letter-spacing: .4px;
}
button:active, .btn:active { background: var(--ash-4); transform: translateY(1px); }
button.primary { background: var(--ember-dim); border-color: var(--ember); color: #fff; }
button.ghost { background: transparent; }
button:disabled { opacity: .4; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row > button { flex: 1 1 120px; }

.close-x { width: 38px; height: 38px; padding: 0; font-size: 18px; line-height: 1; }

/* ---------- Liste ---------- */
.list { display: flex; flex-direction: column; gap: 6px; }
.row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px;
  background: var(--ash-2); border: 1px solid var(--ash-3); border-left-width: 3px;
  border-radius: 5px; cursor: pointer;
}
.row.sel { background: var(--ash-3); border-color: var(--gold); }
.row .ic { width: 34px; height: 34px; flex: 0 0 34px; image-rendering: pixelated; background: var(--ash-1); border-radius: 4px; }
.row .txt { flex: 1; min-width: 0; }
.row .nm { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .qty { font-size: 12px; color: var(--text-dim); font-family: var(--mono); flex: 0 0 auto; }
.row.equipped .nm::after { content: " ◈"; color: var(--gold); }

.rar-common   { border-left-color: #6f6a7d; }
.rar-fine     { border-left-color: #57a05a; }
.rar-rare     { border-left-color: #4f8fe0; }
.rar-epic     { border-left-color: #a06fd1; }
.rar-legend   { border-left-color: #ffd166; }
.nm.rar-common { color: #c3bed0; }
.nm.rar-fine   { color: #7cc46a; }
.nm.rar-rare   { color: #6fb3ff; }
.nm.rar-epic   { color: #c9a6ff; }
.nm.rar-legend { color: #ffd166; }

.empty { padding: 26px 10px; text-align: center; color: var(--text-dim); font-size: 12px; font-style: italic; }
.hint { font-size: 11px; color: var(--text-dim); line-height: 1.5; margin: 6px 2px; }
.sect { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ember); margin: 14px 2px 6px; font-weight: 700; }
.sect:first-child { margin-top: 2px; }

/* ---------- Dettaglio oggetto ---------- */
.detail { background: var(--ash-1); border: 1px solid var(--ash-3); border-radius: 6px; padding: 10px 12px; margin-top: 8px; }
.detail h3 { font-size: 14px; margin-bottom: 3px; }
.detail .flavor { font-size: 11px; font-style: italic; color: var(--text-dim); margin-bottom: 8px; line-height: 1.45; }
.stat-line { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; font-family: var(--mono); }
.stat-line .v { color: var(--gold); }
.stat-line .v.neg { color: var(--blood); }
.stat-line .v .delta { font-size: 10px; margin-left: 4px; }
.stat-line .v .delta.pos { color: var(--stam); }
.stat-line .v .delta.neg { color: var(--blood); }

/* ---------- Barre ---------- */
.bar { height: 7px; background: var(--ash-1); border: 1px solid var(--ash-3); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.bar > i { display: block; height: 100%; background: var(--ember); }
.bar.xp > i { background: linear-gradient(90deg, var(--ember-dim), var(--gold)); }

/* ---------- Dialogo ---------- */
#overlay.dialogue-mode { background: transparent; backdrop-filter: none; }
.dlg {
  position: absolute; left: 0; right: 0; bottom: 0;
  max-width: 720px; margin: 0 auto;
  background: linear-gradient(180deg, rgba(22,19,28,.97), rgba(13,11,16,.99));
  border-top: 2px solid var(--ash-4);
  padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
  max-height: 78%; overflow-y: auto;
}
.dlg .who { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
.dlg .say { font-size: 14px; line-height: 1.55; margin-bottom: 12px; }
.dlg .opts { display: flex; flex-direction: column; gap: 6px; }
.dlg .opt {
  padding: 11px 12px; font-size: 13px; text-align: left;
  background: var(--ash-2); border: 1px solid var(--ash-3); border-radius: 5px; cursor: pointer;
}
.dlg .opt:active { background: var(--ash-3); }
.dlg .opt.quest { border-color: var(--gold); }
.dlg .opt.quest::before { content: "❖ "; color: var(--gold); }

/* ---------- Toast ---------- */
#toasts {
  position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 92px);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  pointer-events: none; z-index: 20;
}
.toast {
  padding: 7px 14px; font-size: 12px; font-weight: 600;
  background: rgba(13,11,16,.9); border: 1px solid var(--ash-4); border-radius: 20px;
  animation: toastIn .25s ease, toastOut .4s ease 2.1s forwards;
  max-width: 90vw; text-align: center;
}
.toast.good { border-color: var(--stam); color: var(--stam); }
.toast.gold { border-color: var(--gold); color: var(--gold); }
.toast.bad  { border-color: var(--blood); color: var(--blood); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-8px); } }

/* ---------- Impostazioni ---------- */
.opt-row { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--ash-2); }
.opt-row .lbl { flex: 1; font-size: 13px; }
.opt-row .lbl small { display: block; color: var(--text-dim); font-size: 11px; margin-top: 2px; line-height: 1.4; }
.seg { display: flex; gap: 3px; background: var(--ash-1); padding: 3px; border-radius: 6px; flex-wrap: wrap; }
.seg button { padding: 8px 10px; font-size: 11px; background: transparent; border: none; border-radius: 4px; }
.seg button.on { background: var(--ember-dim); color: #fff; }
.slider { width: 130px; }

/* ---------- Titolo ---------- */
#overlay.title-mode { background: #0d0b10; }
.title-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 24px; text-align: center; }
.title-screen h1 {
  font-size: clamp(30px, 11vw, 54px); letter-spacing: 6px; font-weight: 800;
  color: var(--gold); text-shadow: 0 0 22px rgba(240,108,58,.5); line-height: 1;
}
.title-screen .tagline { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 26px; }
.title-screen .menu { display: flex; flex-direction: column; gap: 9px; width: min(300px, 88vw); }
.title-screen .menu button { padding: 14px; font-size: 14px; letter-spacing: 1px; }
.title-screen .ver { position: absolute; bottom: calc(14px + env(safe-area-inset-bottom)); font-size: 10px; color: var(--ash-4); }

.save-title-screen { justify-content: flex-start; overflow-y: auto; touch-action: pan-y; padding-top: max(24px, calc(env(safe-area-inset-top) + 20px)); padding-bottom: 54px; }
.save-title-screen .tagline { margin-bottom: 12px; }
.save-browser { display: flex; flex-direction: column; gap: 7px; width: min(620px, 94vw); text-align: left; }
.save-section-title { margin: 8px 2px 0; color: var(--ember); font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
.continue-latest { align-self: center; width: min(320px, 100%); padding: 13px; }
.save-slot { display: flex; align-items: center; gap: 7px; padding: 9px; background: var(--ash-1); border: 1px solid var(--ash-3); border-radius: 7px; }
.save-slot.debug-slot { border-left: 3px solid #a06fd1; }
.save-slot.invalid-slot { border-color: var(--blood); }
.save-slot-copy { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.save-slot-copy b, .save-slot-copy span, .save-slot-copy small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.save-slot-copy b { color: var(--gold); font-size: 12px; }
.save-slot-copy span { font-size: 12px; }
.save-slot-copy small { color: var(--text-dim); font-size: 10px; }
.save-slot button { flex: 0 0 auto; padding: 9px 10px; font-size: 11px; }
.save-slot .delete-slot { color: var(--blood); }
.title-actions { margin-top: 5px; }
.snapshot-create { display: flex; gap: 7px; margin-top: 10px; }
.snapshot-create input { flex: 1; min-width: 0; padding: 10px; color: var(--text); background: var(--ash-1); border: 1px solid var(--ash-4); border-radius: 6px; font: 13px var(--ui-font); user-select: text; -webkit-user-select: text; }

@media (max-width: 480px) {
  .save-title-screen h1 { font-size: 30px; }
  .save-slot { flex-wrap: wrap; }
  .save-slot-copy { flex-basis: calc(100% - 96px); }
  .save-slot button { flex: 1 1 88px; }
  .empty-slot .save-slot-copy { flex-basis: auto; }
}

/* ===== src/core/rng.js ===== */
/* ============================================================
   RNG deterministico + utilita' matematiche.
   LOGICA PURA - nessuna dipendenza dal browser.
   Portabile 1:1 in GDScript.
   ============================================================ */
(function (root) {
  'use strict';
  const CV = root.CV || (root.CV = {});

  /* mulberry32: PRNG a 32 bit, veloce e deterministico.
     Stesso seed => stessa sequenza => stesso mondo generato. */
  function Rng(seed) {
    this.s = (seed >>> 0) || 1;
  }
  Rng.prototype.next = function () {
    this.s = (this.s + 0x6D2B79F5) >>> 0;
    let t = this.s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  Rng.prototype.range = function (a, b) { return a + this.next() * (b - a); };
  Rng.prototype.int = function (a, b) { return Math.floor(a + this.next() * (b - a + 1)); };
  Rng.prototype.pick = function (arr) { return arr[Math.floor(this.next() * arr.length)]; };
  Rng.prototype.chance = function (p) { return this.next() < p; };
  Rng.prototype.shuffle = function (arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(this.next() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  };
  /* Estrae n elementi pesati (peso = campo `w`, default 1) */
  Rng.prototype.weighted = function (entries) {
    let total = 0;
    for (const e of entries) total += (e.w == null ? 1 : e.w);
    let r = this.next() * total;
    for (const e of entries) {
      r -= (e.w == null ? 1 : e.w);
      if (r <= 0) return e;
    }
    return entries[entries.length - 1];
  };

  /* Rumore a valore intero, deterministico su coordinate.
     Usato dalla generazione del mondo per biomi e dettagli. */
  function hash2(x, y, seed) {
    let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(seed | 0, 2147483647);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  function smooth(t) { return t * t * (3 - 2 * t); }

  /* Rumore a valore interpolato: base per le macchie di terreno. */
  function valueNoise(x, y, seed) {
    const x0 = Math.floor(x), y0 = Math.floor(y);
    const fx = smooth(x - x0), fy = smooth(y - y0);
    const a = hash2(x0, y0, seed), b = hash2(x0 + 1, y0, seed);
    const c = hash2(x0, y0 + 1, seed), d = hash2(x0 + 1, y0 + 1, seed);
    return (a * (1 - fx) + b * fx) * (1 - fy) + (c * (1 - fx) + d * fx) * fy;
  }

  /* Somma di ottave: dettaglio piu' ricco. */
  function fbm(x, y, seed, octaves, lacunarity, gain) {
    octaves = octaves || 3; lacunarity = lacunarity || 2; gain = gain || 0.5;
    let amp = 1, freq = 1, sum = 0, norm = 0;
    for (let i = 0; i < octaves; i++) {
      sum += valueNoise(x * freq, y * freq, seed + i * 1013) * amp;
      norm += amp;
      amp *= gain; freq *= lacunarity;
    }
    return sum / norm;
  }

  const M = {
    clamp: (v, a, b) => v < a ? a : (v > b ? b : v),
    lerp: (a, b, t) => a + (b - a) * t,
    /* Avvicina `a` a `b` di al massimo `max` (per interpolazioni frame-rate safe) */
    approach: (a, b, max) => { const d = b - a; return Math.abs(d) <= max ? b : a + Math.sign(d) * max; },
    dist: (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay),
    dist2: (ax, ay, bx, by) => { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; },
    /* Differenza angolare minima nell'intervallo [-PI, PI] */
    angDelta: (a, b) => {
      let d = (b - a) % (Math.PI * 2);
      if (d > Math.PI) d -= Math.PI * 2;
      if (d < -Math.PI) d += Math.PI * 2;
      return d;
    },
    /* Direzione cardinale (0=giu 1=sinistra 2=destra 3=su) da un vettore */
    facingFromVec: (dx, dy) => {
      if (Math.abs(dx) > Math.abs(dy)) return dx < 0 ? 1 : 2;
      return dy < 0 ? 3 : 0;
    }
  };

  CV.Rng = Rng;
  CV.noise = { hash2, valueNoise, fbm };
  CV.M = M;
})(typeof window !== 'undefined' ? window : globalThis);

        const o = Object.assign({}, map[k]);
        o.type = type;
        if (slot) o.slot = slot;
        if (o.weight == null) o.weight = 0.5;
        if (o.value == null) o.value = 1;
        D.baseIndex[k] = o;
      }
    };

    add(D.trinkets, 'trinket', 'trinket');
    add(D.ingredients, 'ingredient');

    if (!d) return String(mag);

  let uidCounter = 1;

  /* Crea un'istanza concreta di un oggetto a partire da un id base.
     opts: { qty, rar, aff:[chiaviAffisso], up:gradoDiTempra, potion:{...} } */
  function makeItem(id, opts) {
    opts = opts || {};
    const base = D.base(id);
    if (!base && id !== 'potion') return null;
    const it = {
      uid: 'i' + (uidCounter++),
      id: id,
      qty: opts.qty || 1,
      rar: opts.rar || 'common',
      aff: opts.aff ? opts.aff.slice() : [],
      up: opts.up || 0
    };
    if (opts.potion) it.potion = opts.potion;
    return it;

  /* Un oggetto è impilabile se non è equipaggiabile e non ha modificatori. */
  function isStackable(it) {
    if (it.potion) return true;
    const b = D.base(it.id);
    if (!b) return false;
    return b.type === 'ingredient' || b.type === 'material' || b.type === 'misc';
  }

  /* Firma usata per capire se due istanze possono impilarsi insieme. */
  function stackKey(it) {
    if (it.potion) return 'potion:' + it.potion.sig;
    return it.id + '|' + it.rar + '|' + it.aff.join(',') + '|' + it.up;
  }

  /* Risolve tutte le proprietà finali di un'istanza (base + rarità + affissi + tempra). */
  function resolve(it) {
    if (!it) return null;
    if (it.potion) {
      return {
        id: 'potion', type: 'potion', name: it.potion.name, icon: it.potion.icon || 'potion',
        weight: 0.4, value: it.potion.value, rar: it.rar, potion: it.potion,
        flavor: it.potion.desc || ''
      };
    }
    const b = D.base(it.id);
    if (!b) return null;
    const rar = D.rarity[it.rar] || D.rarity.common;
    const r = {
      id: b.id, type: b.type, slot: b.slot, icon: b.icon, flavor: b.flavor || '',
      rar: it.rar, up: it.up, aff: it.aff,
      weight: b.weight, value: b.value, quest: !!b.quest
    };

    /* Nome composto: prefisso + base + suffisso + grado di tempra */
    let pre = '', suf = '';
    for (const k of it.aff) {
      const p = D.prefixes.find(x => x.key === k);
      if (p) { pre = p.name + ' '; continue; }
      const s = D.suffixes.find(x => x.key === k);
      if (s) suf = ' ' + s.name;
    }
    r.name = pre + b.name + suf + (it.up > 0 ? ' +' + it.up : '');

    const mods = collectMods(it);
    const upMult = 1 + it.up * 0.14;

    if (b.type === 'weapon') {
      r.dmg = Math.round(b.dmg * rar.mult * upMult * (1 + (mods.damage || 0)) * 10) / 10;
      r.spd = b.spd * (1 + (mods.atkSpeed || 0));
      r.reach = b.reach; r.arc = b.arc; r.stamCost = b.stam;
      r.magic = (b.magic || 0) + (mods.fireDamage || 0);
      r.fire = mods.fireDamage || 0;
    } else if (b.type === 'armor') {
      r.armor = Math.round((b.armor * rar.mult * upMult + (mods.armor || 0)) * 10) / 10;
      r.res = b.res + (mods.res || 0);
      r.magicBonus = b.magicBonus || 0;
    } else if (b.type === 'trinket') {
      r.bonus = Object.assign({}, b.bonus);
    }
    r.mods = mods;
    r.weight = Math.max(0, b.weight * (1 + (mods.weightMod || 0)));
    r.value = Math.round(b.value * rar.value * upMult * (1 + (mods.valueMod || 0)));

  function collectMods(it) {

    for (const k of (it.aff || [])) {

  function recalc(p) {
    const s = {

      damage: 1.0, magicPower: 1.0,
      moveSpeed: 1.0, atkSpeed: 1.0,
      hpRegen: 0.55, mpRegen: 1.6 + p.skills.destruction.lvl * 0.02, spRegen: 13,
      carry: 145 + (p.level - 1) * 4,

    /* Contributo delle abilità */

    s.magicPower += p.skills.destruction.lvl * 0.012;
    s.moveSpeed += p.skills.athletics.lvl * 0.0018;
    s.blockRatio = 0.55 + p.skills.block.lvl * 0.0018;

    const w = equipped(p, 'weapon'), a = equipped(p, 'armor'), t = equipped(p, 'trinket');
    if (a) { s.armor += a.armor; s.res += a.res; if (a.magicBonus) s.magicPower += a.magicBonus / 100; }
    if (w) { s.fire += w.fire || 0; }
    if (t && t.bonus) {
      for (const k in t.bonus) {
        if (k === 'damage' || k === 'moveSpeed') s[k] += t.bonus[k];

    for (const slot of ['weapon', 'armor', 'trinket']) {

      if (!r || !r.mods) continue;
      const m = r.mods;
      if (m.maxHp) s.maxHp += m.maxHp;
      if (m.maxMp) s.maxMp += m.maxMp;
      if (m.maxSp) s.maxSp += m.maxSp;
      if (m.moveSpeed) s.moveSpeed += m.moveSpeed;
      if (m.spRegen) s.spRegen += m.spRegen;
      if (m.armor && r.type !== 'armor') s.armor += m.armor;
    }

    /* Talenti */
    if (p.perks.ironskin) s.armor += 8;
    if (p.perks.windstep) s.moveSpeed += 0.12;
    if (p.perks.secondwind) s.spRegen *= 2;
    if (p.perks.conflagration) s.magicPower += 0.35;
    if (p.perks.bulwark) s.blockRatio = Math.max(s.blockRatio, 0.80);

    /* Effetti attivi (pozioni) */
    for (const e of p.effects) {
      if (e.key === 'fury') s.damage += e.mag;
      else if (e.key === 'stone') s.res += e.mag;
      else if (e.key === 'swift') s.moveSpeed += e.mag;

    s.maxMp = Math.round(s.maxMp);
    s.maxSp = Math.round(s.maxSp);

     ================================================================ */
  const Loot = {};

  /* Genera un pezzo di equipaggiamento casuale della fascia indicata. */
  Loot.makeGear = function (rng, tier, rarBias) {
    const pool = D.gearByTier(tier);

    const id = rng.pick(pool);
    const rar = Loot.rollRarity(rng, rarBias || 0);
    const base = D.base(id);

  };

  Loot.rollRarity = function (rng, bias) {
    const r = rng.next() - (bias || 0) * 0.35;
    if (r < 0.02) return 'legend';
    if (r < 0.09) return 'epic';
    if (r < 0.26) return 'rare';
    if (r < 0.55) return 'fine';
    return 'common';
  };

  Loot.rollAffixes = function (rng, type, n) {
    const out = [];
    if (n <= 0) return out;
    const pre = D.prefixes.filter(a => a.on.indexOf(type) >= 0);
    const suf = D.suffixes.filter(a => a.on.indexOf(type) >= 0);
    if (pre.length && rng.chance(0.75)) out.push(rng.pick(pre).key);
    if (suf.length && (n > 1 || !out.length)) out.push(rng.pick(suf).key);
    if (n > 2 && pre.length) {
      const extra = rng.pick(pre).key;
      if (out.indexOf(extra) < 0) out.push(extra);
    }
    return out;
  };

  Loot.makeTrinket = function (rng) {
    const keys = Object.keys(D.trinkets);
    const id = rng.pick(keys);
    const rar = Loot.rollRarity(rng, 0.1);
    return P.makeItem(id, { rar: rar, aff: Loot.rollAffixes(rng, 'trinket', D.rarity[rar].affixes) });
  };

  /* Estrae 1..n voci da una tabella e le trasforma in istanze. */
  Loot.rollTable = function (table, rng, draws, boost) {
    const out = [];
    draws = draws || 1;
    for (let i = 0; i < draws; i++) {
      const e = rng.weighted(table);
      if (e.kind === 'gear') {
        const g = Loot.makeGear(rng, e.tier || 1, boost ? 0.25 : 0);
        if (g) out.push(g);
      } else if (e.kind === 'trinket') {
        out.push(Loot.makeTrinket(rng));
      } else {
        const qty = e.min == null ? 1 : rng.int(e.min, e.max == null ? e.min : e.max);
        if (qty > 0) out.push(P.makeItem(e.id, { qty: qty }));

  const Smith = {};

  Smith.canCraft = function (p, recipe) {

    for (const id in recipe.cost) {
      if (P.count(p, id) < recipe.cost[id]) {
        return { ok: false, why: 'Materiali insufficienti.' };

    }
    return { ok: true };
  };

  Smith.craft = function (p, recipe, rng, out) {
    const chk = Smith.canCraft(p, recipe);
    if (!chk.ok) return chk;
    const free = p.perks.salvage && rng.chance(0.30);
    if (!free) for (const id in recipe.cost) P.removeById(p, id, recipe.cost[id]);

    let rar = 'common';
    if (recipe.kind !== 'material' && p.perks.masterwork) {
      const r = rng.next();
      rar = r < 0.12 ? 'epic' : (r < 0.42 ? 'rare' : 'fine');

    const reqSkill = it.up * 12;
    if (p.skills.smithing.lvl < reqSkill) return { ok: false, why: 'Serve Fabbrilità ' + reqSkill + '.' };

  const Alch = {};

  Alch.preview = function (p, idA, idB) {

    const shared = Alch.sharedEffects(idA, idB);
    if (!shared.length) {

    for (const k of shared) {

    const primary = D.effects[fx[0].key];

    let value = 0;
    for (const f of fx) value += Math.round(f.mag * (f.dur ? f.dur * 0.4 : 1) * 0.9) + 10;

    const potion = {
      name: name,
      sig: fx.map(f => f.key + ':' + f.mag + ':' + f.dur).join('|'),

    return {

  };

    const rw = c.reward || {};
    if (c.type === 'collect') P.removeById(p, c.itemId, c.count);
    if (rw.gold) p.gold += rng.int(rw.gold[0], rw.gold[1]);

    if (rw.tier) item = Loot.makeGear(rng, rw.tier, rw.rarBias || 0.15);

      if (c.done || c.type !== 'clear' || c.zoneId !== zoneId) continue;
      if ((c.progress || 0) >= c.count) continue;
      c.progress = (c.progress || 0) + 1;
      if (out) out.push({ type: 'contract', event: 'progress', contract: c });

     ================================================================ */
  const Q = {};

  Q.get = function (p, id) {
    return p.quests[id] || null;
  };

  Q.state = function (p, id) {
    const def = D.quests[id];
    if (!def) return 'none';
    const q = p.quests[id];
    if (q && q.done) return 'done';
    if (q) return Q.stageComplete(p, id) && q.stage >= def.stages.length - 1 ? 'ready' : 'active';
    if (def.requires && (!p.quests[def.requires] || !p.quests[def.requires].done)) return 'locked';
    return 'available';
  };

  Q.start = function (p, id, out) {
    if (p.quests[id]) return false;
    const def = D.quests[id];
    if (!def) return false;
    p.quests[id] = { id: id, stage: 0, done: false, counters: {} };
    if (out) out.push({ type: 'quest', quest: id, event: 'start' });
    Q.check(p, out);
    return true;
  };

  /* Verifica se l'obiettivo dello stage corrente è soddisfatto. */
  Q.stageComplete = function (p, id) {
    const q = p.quests[id], def = D.quests[id];
    if (!q || !def) return false;
    const st = def.stages[q.stage];
    if (!st) return true;
    const o = st.obj;
    switch (o.type) {
      case 'kill':    return (q.counters[o.target] || 0) >= o.count;
      case 'collect': return P.count(p, o.target) >= o.count;
      case 'reach':   return !!p.flags['reached_' + o.target];
      case 'talk':    return false;  /* si completa solo dialogando */
      case 'flag':    return !!p.flags[o.target];
      default:        return false;
    }
  };

  Q.advance = function (p, id, out) {
    const q = p.quests[id], def = D.quests[id];
    if (!q || q.done) return false;
    if (q.stage < def.stages.length - 1) {
      q.stage++;
      if (out) out.push({ type: 'quest', quest: id, event: 'stage', stage: q.stage });
      Q.check(p, out);
      return true;
    }
    return Q.complete(p, id, out);
  };

  Q.complete = function (p, id, out) {
    const q = p.quests[id], def = D.quests[id];
    if (!q || q.done) return false;
    q.done = true;
    const rw = def.reward || {};
    if (rw.take) for (const [iid, n] of rw.take) P.removeById(p, iid, n);
    if (rw.gold) p.gold += rw.gold;
    if (rw.items) for (const [iid, n] of rw.items) P.addById(p, iid, n);
    if (rw.xp) P.gainXp(p, rw.xp, out);
    P.recalc(p);
    if (out) out.push({ type: 'quest', quest: id, event: 'complete', reward: rw });
    return true;
  };

  /* Chiamata dopo ogni evento rilevante: avanza gli stage automatici. */
  Q.check = function (p, out) {
    for (const id in p.quests) {
      const q = p.quests[id], def = D.quests[id];
      if (!q || q.done || !def) continue;
      let guard = 0;
      while (!q.done && guard++ < 8) {
        const st = def.stages[q.stage];
        if (!st || st.obj.type === 'talk') break;
        if (!Q.stageComplete(p, id)) break;
        if (q.stage < def.stages.length - 1) {
          q.stage++;
          if (out) out.push({ type: 'quest', quest: id, event: 'stage', stage: q.stage });
        } else {
          /* Ultimo stage non dialogico: si chiude da solo solo se marcato `auto` */
          if (def.auto) Q.complete(p, id, out);
          break;
        }
      }
    }
  };

  Q.onKill = function (p, enemyId, out) {
    for (const id in p.quests) {
      const q = p.quests[id];
      if (!q || q.done) continue;
      q.counters[enemyId] = (q.counters[enemyId] || 0) + 1;
      q.counters.any = (q.counters.any || 0) + 1;
    }
    Q.check(p, out);
  };

  Q.onEnterZone = function (p, zoneId, out) {
    p.flags['reached_' + zoneId] = true;
    p.discovered[zoneId] = true;
    Q.check(p, out);
  };

  /* Testo di avanzamento leggibile per il diario. */
  Q.progressText = function (p, id) {
    const q = p.quests[id], def = D.quests[id];
    if (!q || !def) return '';
    const st = def.stages[q.stage];
    if (!st) return '';
    const o = st.obj;
    if (o.type === 'kill') return (q.counters[o.target] || 0) + ' / ' + o.count;
    if (o.type === 'collect') return Math.min(P.count(p, o.target), o.count) + ' / ' + o.count;
    return '';
  };

  /* ================================================================
     DIALOGHI — valutazione di condizioni dichiarative
     ================================================================ */
  const Dlg = {};

  Dlg.testCond = function (p, cond) {
    if (!cond) return true;
    for (const k in cond) {
      const v = cond[k];
      switch (k) {
        case 'questDone':      if (Q.state(p, v) !== 'done') return false; break;
        case 'questActive':    { const s = Q.state(p, v); if (s !== 'active' && s !== 'ready') return false; break; }
        case 'questReady':     if (Q.state(p, v) !== 'ready') return false; break;
        case 'questAvailable': if (Q.state(p, v) !== 'available') return false; break;
        case 'questStage': {
          const q = p.quests[v[0]];
          if (!q || q.done || q.stage !== v[1]) return false;
          break;
        }
        case 'hasItem':        if (P.count(p, v[0]) < (v[1] || 1)) return false; break;
        case 'flag':           if (!p.flags[v]) return false; break;
        case 'minLevel':       if (p.level < v) return false; break;
        case 'not':            if (Dlg.testCond(p, v)) return false; break;

      }
    }
    return true;

     I nodi marcati `sub` sono solo continuazioni raggiungibili da
     un'opzione: non possono mai aprire una conversazione. L'ultimo
     nodo non-`sub` fa da battuta predefinita. */
  Dlg.rootFor = function (p, npcId) {
    const nodes = D.dialogue[npcId];
    if (!nodes) return null;
    let fallback = null;
    for (const n of nodes) {
      if (n.sub) continue;
      if (Dlg.testCond(p, n.cond)) return n;
      fallback = n;
    }
    return fallback;
  };

  Dlg.nodeById = function (npcId, nodeId) {
    const nodes = D.dialogue[npcId];
    if (!nodes) return null;
    return nodes.find(n => n.id === nodeId) || null;
  };

  /* Filtra le opzioni visibili in base alle loro condizioni. */
  Dlg.options = function (p, node) {
    if (!node || !node.opts) return [];
    return node.opts.filter(o => Dlg.testCond(p, o.cond));
  };

     SALVATAGGIO — serializzazione pura (l'I/O sta nel layer motore)
     ================================================================ */
  const Save = {};
  Save.VERSION = 1;

  Save.serialize = function (p, worldState, settings) {
    return {
      v: Save.VERSION,
      t: Date.now(),
      uid: P.getUidCounter(),
      player: p,
      world: worldState,
      settings: settings || {}
    };
  };

  Save.deserialize = function (raw) {
    if (!raw || raw.v !== Save.VERSION) return null;
    const p = raw.player;
    if (!p) return null;
    /* Ricostruisce i campi eventualmente assenti in salvataggi vecchi */
    for (const k of P.SKILL_ORDER) if (!p.skills[k]) p.skills[k] = { lvl: 5, xp: 0 };
    p.effects = p.effects || [];
    p.known = p.known || {};
    p.flags = p.flags || {};
    p.quests = p.quests || {};
    p.discovered = p.discovered || {};
    p.contracts = p.contracts || [];
    P.setUidCounter((raw.uid || 1) + 1);
    P.recalc(p);
    return { player: p, world: raw.world || {}, settings: raw.settings || {}, t: raw.t };
  };

  CV.Loot = Loot;
  CV.Smith = Smith;
  CV.Alch = Alch;
  CV.Quests = Q;
  CV.Contracts = Contracts;

  /* ================================================================
     COSTRUZIONE DEGLI SPRITE
     ================================================================ */
  const cache = new Map();

  function normalize(rows, w) {
    return rows.map(r => {
      if (r.length === w) return r;
      if (r.length > w) return r.slice(0, w);
      return r + '.'.repeat(w - r.length);
    });
  }

  function makeCanvas(w, h) {
    const c = (typeof OffscreenCanvas !== 'undefined' && false)
      ? new OffscreenCanvas(w, h)
      : document.createElement('canvas');
    c.width = w; c.height = h;
    return c;
  }

  /* Costruisce (e memorizza) un canvas dallo sprite.
     `swap` rimappa singoli caratteri su colori diversi: permette di
     riusare lo stesso disegno per varianti di colore. */
  function sprite(name, swap) {
    const key = name + (swap ? '|' + JSON.stringify(swap) : '');
    if (cache.has(key)) return cache.get(key);

    let def = SPR[name];
    if (!def) { cache.set(key, null); return null; }
    let rows, w, h;
    if (Array.isArray(def)) { rows = def; w = 16; h = def.length; }
    else { rows = def.rows; w = def.w; h = def.h; }
    rows = normalize(rows, w);

    const cv = makeCanvas(w, h);
    const ctx = cv.getContext('2d');
    const img = ctx.createImageData(w, h);
    const data = img.data;
    for (let y = 0; y < h; y++) {
      const line = rows[y] || '';
      for (let x = 0; x < w; x++) {
        const ch = line[x] || '.';
        let col = (swap && swap[ch] !== undefined) ? swap[ch] : PAL[ch];
        if (!col) continue;
        const i = (y * w + x) * 4;
        data[i] = parseInt(col.slice(1, 3), 16);
        data[i + 1] = parseInt(col.slice(3, 5), 16);
        data[i + 2] = parseInt(col.slice(5, 7), 16);
        data[i + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);

    /* Luce dall'alto: schiarisce la parte superiore e scurisce la base,
       solo dove ci sono pixel opachi. Dà volume a sprite piatti senza
       ridisegnarli, ed è la differenza fra "ritagliato" e "scolpito". */
    ctx.globalCompositeOperation = 'source-atop';
    const lit = ctx.createLinearGradient(0, 0, 0, h);
    lit.addColorStop(0, 'rgba(255,242,214,0.16)');
    lit.addColorStop(0.42, 'rgba(255,242,214,0.03)');
    lit.addColorStop(0.62, 'rgba(20,12,30,0.00)');
    lit.addColorStop(1, 'rgba(20,12,30,0.20)');
    ctx.fillStyle = lit;
    ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'source-over';

    cache.set(key, cv);
    return cv;
  }

  /* Texture d'ombra riutilizzabile: un'ellisse sfumata disegnata una volta
     sola e poi scalata. Molto più economica di un gradiente per entità
     a ogni fotogramma, e infinitamente più morbida di un disco pixelato. */
  let shadowTex = null;
  function getShadowTex() {
    if (shadowTex) return shadowTex;
    const w = 64, h = 32;
    const cv = makeCanvas(w, h);
    const ctx = cv.getContext('2d');
    const g = ctx.createRadialGradient(w / 2, h / 2, 1, w / 2, h / 2, w / 2);
    g.addColorStop(0, 'rgba(10,6,16,0.55)');
    g.addColorStop(0.55, 'rgba(10,6,16,0.28)');
    g.addColorStop(1, 'rgba(10,6,16,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    shadowTex = cv;
    return cv;
  }

  /* Variante "silhouette": usata per il lampeggio bianco quando si viene colpiti. */
  function flashOf(name, swap, color) {
    const key = 'flash|' + name + '|' + color + (swap ? JSON.stringify(swap) : '');
    if (cache.has(key)) return cache.get(key);
    const src = sprite(name, swap);
    if (!src) return null;
    const cv = makeCanvas(src.width, src.height);
    const ctx = cv.getContext('2d');
    ctx.drawImage(src, 0, 0);
    ctx.globalCompositeOperation = 'source-in';
    ctx.fillStyle = color;
    ctx.fillRect(0, 0, cv.width, cv.height);
    cache.set(key, cv);
    return cv;
  }

  /* ================================================================
     TILE PROCEDURALI
     Ogni tipo genera 4 varianti deterministiche: niente ripetizione
     visibile a griglia.
     ================================================================ */
  const TILE = 16;
  /* `z` = ordine di sovrapposizione: un terreno con z più alto sborda su
     quello con z più basso, con un bordo irregolare. È ciò che elimina i
     confini dritti fra le macchie di terreno. */
  const TILE_DEFS = {
    water:      { z: 0,  base: '#22384f', tones: ['#284158', '#1d3145', '#2e4a63'], speck: '#3a5f7d', solid: true, liquid: true },
    lava:       { z: 0,  base: '#5a1f10', tones: ['#7a2a12', '#45170c', '#8f3517'], speck: '#f06c3a', solid: true, liquid: true, glow: '#f06c3a' },
    /* I toni base sono volutamente distanti fra loro: la luce d'ambiente
       li riavvicina, e se partono già simili il terreno diventa una
       poltiglia bruna in cui non si distingue più nulla. */
    grass:      { z: 10, base: '#3a5637', tones: ['#436340', '#2e4629', '#4a6b45'], speck: '#5c8050', solid: false },
    ash_grass:  { z: 11, base: '#4b4d3a', tones: ['#565843', '#3e4030', '#5f6149'], speck: '#727355', solid: false },
    dirt:       { z: 13, base: '#4e3c2b', tones: ['#5a4632', '#412f21', '#634e39', ], speck: '#75603f', solid: false },
    ash:        { z: 12, base: '#4c4657', tones: ['#575062', '#3f3949', '#605970'], speck: '#736c85', solid: false },
    stone:      { z: 14, base: '#42404e', tones: ['#4c4a59', '#383644', '#565365'], speck: '#635f73', solid: false },
    cave_floor: { z: 15, base: '#2f2a37', tones: ['#383140', '#28232f', '#403948'], speck: '#4c4458', solid: false },
    keep_floor: { z: 16, base: '#3a3340', tones: ['#443c4b', '#312b36', '#4c4454'], speck: '#584e62', solid: false },
    path:       { z: 20, base: '#6d6350', tones: ['#7a6f5a', '#5f5646', '#857a63'], speck: '#968a70', solid: false },
    wood:       { z: 21, base: '#5a4028', tones: ['#644731', '#4e3722', '#6d4e36'], speck: '#7a5a3f', solid: false },
    /* I muri non partecipano alle transizioni: hanno già il proprio stacco */
    rock_wall:  { z: 90, base: '#2a2630', tones: ['#332e3a', '#241f2b', '#3a3442'], speck: '#443d4c', solid: true, wall: true },
    keep_wall:  { z: 90, base: '#332c38', tones: ['#3c3442', '#2b2530', '#443b4a'], speck: '#524859', solid: true, wall: true },
    village_wall:{ z: 90, base: '#4a3b2c', tones: ['#554435', '#3f3226', '#5f4d3c'], speck: '#6b5844', solid: true, wall: true }
  };
  const TILE_KEYS = Object.keys(TILE_DEFS);

  let tileAtlas = null;
  const VARIANTS = 4;

  /* Crea un atlante: righe = tipi di tile, colonne = varianti. */
  function buildTileAtlas() {
    if (tileAtlas) return tileAtlas;
    const cv = makeCanvas(TILE * VARIANTS, TILE * TILE_KEYS.length);
    const ctx = cv.getContext('2d');
    const rng = new CV.Rng(20260830);

    TILE_KEYS.forEach((key, row) => {
      const def = TILE_DEFS[key];
      for (let v = 0; v < VARIANTS; v++) {
        const ox = v * TILE, oy = row * TILE;
        ctx.fillStyle = def.base;
        ctx.fillRect(ox, oy, TILE, TILE);

        /* Macchie ampie e morbide invece di rumore fitto: da vicino il
           rumore a un pixel sembra dettaglio, a schermo intero sembra
           sporco. Poche chiazze larghe leggono molto meglio. */
        for (let i = 0; i < 7; i++) {
          ctx.fillStyle = def.tones[Math.floor(rng.next() * def.tones.length)];
          const w = 3 + Math.floor(rng.next() * 6);
          const h = 2 + Math.floor(rng.next() * 4);
          ctx.globalAlpha = 0.5 + rng.next() * 0.35;
          ctx.fillRect(ox + Math.floor(rng.next() * TILE), oy + Math.floor(rng.next() * TILE), w, h);
        }
        ctx.globalAlpha = 1;
        /* Pochissimi granelli, solo per rompere la piattezza */
        for (let i = 0; i < 2; i++) {
          ctx.globalAlpha = 0.45;
          ctx.fillStyle = def.speck;
          ctx.fillRect(ox + Math.floor(rng.next() * TILE), oy + Math.floor(rng.next() * TILE), 1, 1);
        }
        ctx.globalAlpha = 1;
        /* I muri hanno un bordo superiore piu' chiaro: leggono meglio in verticale */
        if (def.wall) {
          ctx.fillStyle = def.speck;
          ctx.fillRect(ox, oy, TILE, 2);
          ctx.fillStyle = '#0d0b10';
          ctx.fillRect(ox, oy + TILE - 1, TILE, 1);
        }
        if (def.liquid) {
          ctx.fillStyle = def.speck;
          for (let i = 0; i < 3; i++) {
            const yy = oy + 2 + Math.floor(rng.next() * (TILE - 4));
            ctx.fillRect(ox + Math.floor(rng.next() * 8), yy, 3 + Math.floor(rng.next() * 5), 1);
          }
        }
      }
    });
    tileAtlas = cv;
    return cv;
  }

  function tileIndex(key) { return TILE_KEYS.indexOf(key); }
  function getTileAtlasInternal() { return tileAtlas || buildTileAtlas(); }

  /* ---------------- Maschere di transizione ----------------
     Ritagliano il terreno "superiore" perché sbordi su quello inferiore
     con un margine irregolare e sfrangiato, invece del bordo dritto che
     produce l'effetto scacchiera.
     Le 8 direzioni sono: 0=N 1=E 2=S 3=O 4=NE 5=SE 6=SO 7=NO          */
  const maskCache = new Map();
  const MASK_VARIANTS = 3;

  function edgeMask(dir, variant) {
    const key = dir + ':' + variant;
    if (maskCache.has(key)) return maskCache.get(key);
    const cv = makeCanvas(TILE, TILE);
    const ctx = cv.getContext('2d');
    const img = ctx.createImageData(TILE, TILE);
    const d = img.data;
    const rng = new CV.Rng(4700 + dir * 137 + variant * 911);

    const put = (x, y, a) => {
      if (x < 0 || y < 0 || x >= TILE || y >= TILE) return;
      const i = (y * TILE + x) * 4;
      d[i] = 255; d[i + 1] = 255; d[i + 2] = 255;
      d[i + 3] = Math.max(d[i + 3], a);
    };

    if (dir < 4) {
      /* Lati: profondità variabile lungo il bordo, più due file di
         sfrangiatura che sfumano il confine invece di tagliarlo netto. */
      for (let i = 0; i < TILE; i++) {
        const n = CV.noise.fbm(i / 4.5, variant * 11 + dir * 3, 331, 2);
        const depth = 3 + Math.round(n * 4);
        for (let j = 0; j < depth; j++) {
          if (dir === 0) put(i, j, 255);
          else if (dir === 1) put(TILE - 1 - j, i, 255);
          else if (dir === 2) put(i, TILE - 1 - j, 255);
          else put(j, i, 255);
        }
        /* Sfrangiatura: pixel sparsi oltre il bordo, densità calante */
        for (let k = 0; k < 3; k++) {
          if (!rng.chance(0.55 - k * 0.17)) continue;
          const j = depth + k;
          const a = 235 - k * 60;
          if (dir === 0) put(i, j, a);
          else if (dir === 1) put(TILE - 1 - j, i, a);
          else if (dir === 2) put(i, TILE - 1 - j, a);
          else put(j, i, a);
        }
      }
    } else {
      /* Angoli: quarto di macchia irregolare, per chiudere il punto in cui
         due lati si incontrano senza lasciare un dente quadrato. */
      const r0 = 5.5;
      for (let y = 0; y < TILE; y++) {
        for (let x = 0; x < TILE; x++) {
          let cx, cy;
          if (dir === 4) { cx = TILE - 1; cy = 0; }
          else if (dir === 5) { cx = TILE - 1; cy = TILE - 1; }
          else if (dir === 6) { cx = 0; cy = TILE - 1; }
          else { cx = 0; cy = 0; }
          const dist = Math.hypot(x - cx, y - cy);
          const wob = CV.noise.fbm(x / 3.5, y / 3.5, 770 + variant * 53 + dir, 2) * 2.6;
          const edge = r0 + wob;
          if (dist < edge - 0.8) put(x, y, 255);
          else if (dist < edge + 0.9 && rng.chance(0.5)) put(x, y, 200);
        }
      }
    }
    ctx.putImageData(img, 0, 0);
    maskCache.set(key, cv);
    return cv;
  }

  /* Pezzo di bordo già ritagliato: il tile "superiore" mascherato secondo
     una direzione. Le combinazioni che servono davvero sono poche e si
     ripetono migliaia di volte in una mappa, quindi conviene tenerle in
     memoria invece di ricomporle a ogni cella. */
  const edgeCache = new Map();
  function edgePiece(tileRow, tileVar, dir, maskVar) {
    const key = tileRow + '|' + tileVar + '|' + dir + '|' + maskVar;
    let cv = edgeCache.get(key);
    if (cv) return cv;
    cv = makeCanvas(TILE, TILE);
    const ctx = cv.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(getTileAtlasInternal(), tileVar * TILE, tileRow * TILE, TILE, TILE, 0, 0, TILE, TILE);
    ctx.globalCompositeOperation = 'destination-in';
    ctx.drawImage(edgeMask(dir, maskVar), 0, 0);
    edgeCache.set(key, cv);
    return cv;
  }

  /* ================================================================
     PROP GRANDI DISEGNATI IN PROCEDURA (alberi, rocce, case)
     ================================================================ */
  const propCache = new Map();

  /* Otto varianti (0-3 vivi, 4-7 secchi): un bosco in cui ogni albero ha la
     stessa altezza non ha profondità. Il tronco si allunga verso il basso
     (la chioma resta ferma in cima) per variare l'altezza, e la chioma
     alterna due raggi per variare l'ampiezza — sempre a coordinate intere,
     così restano nitidi come il resto della pixel art invece di sfumarsi
     per un ridimensionamento frazionario. */
  function tree(variant) {
    const key = 'tree' + variant;
    if (propCache.has(key)) return propCache.get(key);
    const dead = variant >= 4;
    const sizeIdx = variant % 4;
    const trunkExtra = [0, 4, 8, 12][sizeIdx];
    const wide = sizeIdx % 2 === 1;
    const w = 32, h = 44 + trunkExtra;
    const cv = makeCanvas(w, h);
    const ctx = cv.getContext('2d');
    const rng = new CV.Rng(7000 + variant * 131);

    /* Tronco: parte sempre dalla stessa riga (26, dove finisce la chioma)
       e si allunga verso il basso fino al nuovo bordo del canvas. */
    ctx.fillStyle = '#241a14';
    ctx.fillRect(13, 26, 6, 18 + trunkExtra);
    ctx.fillStyle = '#3a2a1e';
    ctx.fillRect(14, 26, 3, 18 + trunkExtra);

    if (dead) {
      /* Albero secco: solo rami */
      ctx.strokeStyle = '#2e2219'; ctx.lineWidth = 2;
      for (let i = 0; i < 7; i++) {
        const y0 = 30 - i * 3.5;
        const dir = i % 2 ? 1 : -1;
        ctx.beginPath();
        ctx.moveTo(16, y0);
        ctx.lineTo(16 + dir * (5 + rng.next() * 9), y0 - 6 - rng.next() * 5);
        ctx.stroke();
      }
      ctx.fillStyle = '#3a2f28';
      for (let i = 0; i < 14; i++) ctx.fillRect(4 + rng.next() * 24, 4 + rng.next() * 22, 2, 2);
    } else {
      /* Chioma: grappoli di cerchi pixelati */
      const dark = sizeIdx % 2 === 0 ? '#243a26' : '#2b3a2c';
      const mid = sizeIdx % 2 === 0 ? '#31502f' : '#3a4d35';
      const lit = sizeIdx % 2 === 0 ? '#41653a' : '#4c6244';
      const rr = wide ? 2 : 0;
      const blobs = [[16, 14, 13], [9, 19, 9], [23, 19, 9], [16, 22, 11], [12, 10, 7], [21, 11, 7]];
      for (const [cx, cy, r] of blobs) { ctx.fillStyle = dark; circle(ctx, cx, cy, r + rr); }
      for (const [cx, cy, r] of blobs) { ctx.fillStyle = mid; circle(ctx, cx, cy - 1, r + rr - 2); }
      for (let i = 0; i < 26; i++) {
        ctx.fillStyle = lit;
        ctx.fillRect(6 + Math.floor(rng.next() * 20), 5 + Math.floor(rng.next() * 18), 2, 2);
      }
      /* Un velo di cenere sulle foglie: e' il tema del gioco */
      ctx.fillStyle = 'rgba(160,155,170,0.20)';
      for (let i = 0; i < 16; i++) ctx.fillRect(5 + Math.floor(rng.next() * 22), 4 + Math.floor(rng.next() * 16), 2, 1);
    }
    propCache.set(key, cv);
    return cv;
  }

  function circle(ctx, cx, cy, r) {
    for (let y = -r; y <= r; y++) {
      const dx = Math.floor(Math.sqrt(Math.max(0, r * r - y * y)));
      ctx.fillRect(cx - dx, cy + y, dx * 2 + 1, 1);
    }
  }

  function rock(variant) {
    const key = 'rock' + variant;
    if (propCache.has(key)) return propCache.get(key);
    const w = 24, h = 20;
    const cv = makeCanvas(w, h);
    const ctx = cv.getContext('2d');
    const rng = new CV.Rng(3100 + variant * 77);
    ctx.fillStyle = '#0d0b10'; circle(ctx, 12, 12, 9);
    ctx.fillStyle = '#413c49'; circle(ctx, 12, 11, 8);
    ctx.fillStyle = '#4e4857'; circle(ctx, 11, 10, 6);
    ctx.fillStyle = '#5d5668'; circle(ctx, 10, 8, 3);
    for (let i = 0; i < 10; i++) {
      ctx.fillStyle = rng.chance(0.5) ? '#37323f' : '#5d5668';
      ctx.fillRect(5 + Math.floor(rng.next() * 14), 5 + Math.floor(rng.next() * 12), 2, 1);
    }
    propCache.set(key, cv);
    return cv;
  }

  function bush(variant) {
    const key = 'bush' + variant;
    if (propCache.has(key)) return propCache.get(key);
    const cv = makeCanvas(20, 16);
    const ctx = cv.getContext('2d');
    const rng = new CV.Rng(5500 + variant * 53);
    ctx.fillStyle = '#1e2a1c'; circle(ctx, 10, 9, 7);
    ctx.fillStyle = '#2c3d27'; circle(ctx, 10, 8, 6);
    ctx.fillStyle = '#3a4f31'; circle(ctx, 9, 7, 4);
    for (let i = 0; i < 8; i++) {
      ctx.fillStyle = '#48603c';
      ctx.fillRect(4 + Math.floor(rng.next() * 12), 3 + Math.floor(rng.next() * 9), 2, 2);
    }
    propCache.set(key, cv);
    return cv;
  }

  /* Casa di villaggio: muro + tetto + porta + finestre illuminate */
  function house(variant) {
    const key = 'house' + variant;
    if (propCache.has(key)) return propCache.get(key);
    const w = variant === 0 ? 64 : 48;
    const h = 60;
    const cv = makeCanvas(w, h);
    const ctx = cv.getContext('2d');
    const wallY = 24, wallH = h - wallY - 2;

    /* Muro */
    ctx.fillStyle = '#0d0b10'; ctx.fillRect(2, wallY, w - 4, wallH);
    ctx.fillStyle = '#54432f'; ctx.fillRect(3, wallY + 1, w - 6, wallH - 2);
    ctx.fillStyle = '#61503a';
    for (let y = wallY + 2; y < h - 4; y += 5) ctx.fillRect(4, y, w - 8, 1);
    /* Travi verticali */
    ctx.fillStyle = '#3b2e20';
    for (let x = 8; x < w - 8; x += 14) ctx.fillRect(x, wallY + 1, 3, wallH - 2);

    /* Tetto: falde a gradini, in pixel */
    const peak = 4;
    for (let y = 0; y < wallY; y++) {
      const t = y / wallY;
      const half = Math.round((w / 2) * (0.18 + 0.82 * t));
      ctx.fillStyle = y < 3 ? '#2a1f16' : (y % 4 < 2 ? '#3d2c1e' : '#4a3524');
      ctx.fillRect(w / 2 - half, peak + y - 4, half * 2, 1);
    }
    ctx.fillStyle = '#241a12';
    ctx.fillRect(0, wallY - 2, w, 3);

    /* Porta */
    const dx = Math.floor(w / 2) - 6;
    ctx.fillStyle = '#0d0b10'; ctx.fillRect(dx, h - 20, 12, 18);
    ctx.fillStyle = '#3a2a1c'; ctx.fillRect(dx + 1, h - 19, 10, 17);
    ctx.fillStyle = '#ffd166'; ctx.fillRect(dx + 8, h - 11, 2, 2);

    /* Finestre accese: l'unico calore rimasto nella valle */
    const wy = h - 32;
    for (const wx of (variant === 0 ? [10, w - 22] : [8, w - 20])) {
      ctx.fillStyle = '#0d0b10'; ctx.fillRect(wx, wy, 12, 10);
      ctx.fillStyle = '#c98a3a'; ctx.fillRect(wx + 1, wy + 1, 10, 8);
      ctx.fillStyle = '#ffd166'; ctx.fillRect(wx + 2, wy + 2, 8, 6);
      ctx.fillStyle = '#3a2a1c'; ctx.fillRect(wx + 5, wy, 2, 10); ctx.fillRect(wx, wy + 4, 12, 2);
    }
    propCache.set(key, cv);
    return cv;
  }

  /* ================================================================
     REPERTORIO DI OGGETTI
     Tutti disegnati da codice: nessun file, ma abbastanza varianti da
     non far riconoscere la ripetizione mentre si cammina.
     ================================================================ */

  /* Ellisse pixelata: serve a dare la faccia superiore agli oggetti
     cilindrici, che in vista dall'alto senza fianco sembrano monete. */
  function ellip(ctx, cx, cy, rx, ry) {
    for (let y = -ry; y <= ry; y++) {
      const dx = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry))));
      ctx.fillRect(cx - dx, cy + y, dx * 2 + 1, 1);
    }
  }

  /* Ceppo tagliato: fianco di corteccia + faccia superiore con gli anelli.
     È il fianco a dargli altezza. */
  function stump(variant) {
    const key = 'stump' + variant;
    if (propCache.has(key)) return propCache.get(key);
    const cv = makeCanvas(18, 18), ctx = cv.getContext('2d');
    const rng = new CV.Rng(6100 + variant * 41);

    /* Fianco */
    ctx.fillStyle = '#160f0a'; ctx.fillRect(2, 6, 14, 11);
    ctx.fillStyle = '#3a2a1c'; ctx.fillRect(3, 6, 12, 10);
    ctx.fillStyle = '#4a3524'; ctx.fillRect(3, 6, 4, 10);
    ctx.fillStyle = '#2a1e14';
    for (let i = 0; i < 5; i++) ctx.fillRect(4 + i * 2 + (i % 2), 7, 1, 9);

    /* Faccia superiore con anelli di crescita */
    ctx.fillStyle = '#160f0a'; ellip(ctx, 9, 6, 7, 4);
    ctx.fillStyle = '#6b5138'; ellip(ctx, 9, 6, 6, 3);
    ctx.fillStyle = '#54402b'; ellip(ctx, 9, 6, 4, 2);
    ctx.fillStyle = '#6b5138'; ellip(ctx, 9, 6, 2, 1);
    ctx.fillStyle = '#3a2a1c'; ctx.fillRect(8, 6, 1, 1);
    /* Radici che affiorano */
    ctx.fillStyle = '#2a1e14';
    for (let i = 0; i < 3; i++) ctx.fillRect(2 + Math.floor(rng.next() * 13), 16, 2, 1);
    propCache.set(key, cv);
    return cv;
  }

  /* Ciuffo d'erba alta: ondeggia nel renderer */
  function tallgrass(variant) {
    const key = 'tallgrass' + variant;
    if (propCache.has(key)) return propCache.get(key);
    const cv = makeCanvas(16, 14), ctx = cv.getContext('2d');
    const rng = new CV.Rng(6300 + variant * 29);
    const cols = ['#3f5c38', '#4b6b42', '#57804c'];
    for (let i = 0; i < 9; i++) {
      const x = 2 + Math.floor(rng.next() * 12);
      const h = 5 + Math.floor(rng.next() * 8);
      const lean = rng.chance(0.5) ? 1 : -1;
      ctx.fillStyle = cols[Math.floor(rng.next() * cols.length)];
      for (let y = 0; y < h; y++) {
        ctx.fillRect(x + Math.round(lean * (y / h) * 2), 13 - y, 1, 1);
      }
    }
    propCache.set(key, cv);
    return cv;
  }

  /* Fiori di cenere: una delle poche note di colore della valle */
  function flowers(variant) {
    const key = 'flowers' + variant;
    if (propCache.has(key)) return propCache.get(key);
    const cv = makeCanvas(14, 12), ctx = cv.getContext('2d');
    const rng = new CV.Rng(6400 + variant * 61);
    const petal = ['#c9668a', '#d9a05b', '#a06fd1', '#e8c9a0'][variant % 4];
    for (let i = 0; i < 4; i++) {
      const x = 2 + Math.floor(rng.next() * 10);
      const y = 3 + Math.floor(rng.next() * 5);
      ctx.fillStyle = '#3d5232';
      ctx.fillRect(x, y + 1, 1, 11 - y);
      ctx.fillStyle = petal;
      ctx.fillRect(x - 1, y, 3, 1);
      ctx.fillRect(x, y - 1, 1, 3);
      ctx.fillStyle = '#ffd166';
      ctx.fillRect(x, y, 1, 1);
    }
    propCache.set(key, cv);
    return cv;
  }

  /* Funghi luminescenti: nelle caverne fanno anche da fonte di luce */
  function mushrooms(variant) {
    const key = 'mushrooms' + variant;
    if (propCache.has(key)) return propCache.get(key);
    const cv = makeCanvas(16, 14), ctx = cv.getContext('2d');
    const rng = new CV.Rng(6500 + variant * 83);
    const cap = variant % 2 ? '#6fb3ff' : '#a06fd1';
    const capDark = variant % 2 ? '#2f5c9e' : '#5f3d84';
    for (let i = 0; i < 3; i++) {
      const x = 3 + i * 4 + Math.floor(rng.next() * 2);
      const y = 6 + Math.floor(rng.next() * 4);
      const r = 2 + Math.floor(rng.next() * 2);
      ctx.fillStyle = '#c9c4d6';
      ctx.fillRect(x, y, 1, 13 - y);
      ctx.fillStyle = capDark; circle(ctx, x, y, r);
      ctx.fillStyle = cap; circle(ctx, x, y - 1, r - 1);
    }
    propCache.set(key, cv);
    return cv;
  }

  /* Mucchio d'ossa */
  function boneheap(variant) {
    const key = 'boneheap' + variant;
    if (propCache.has(key)) return propCache.get(key);
    const cv = makeCanvas(20, 14), ctx = cv.getContext('2d');
    const rng = new CV.Rng(6600 + variant * 97);
    ctx.fillStyle = '#0f0b14';
    circle(ctx, 10, 11, 6);
    for (let i = 0; i < 6; i++) {
      const x = 3 + Math.floor(rng.next() * 13);
      const y = 6 + Math.floor(rng.next() * 6);
      const len = 3 + Math.floor(rng.next() * 5);
      const horiz = rng.chance(0.65);
      ctx.fillStyle = i % 2 ? '#d8d2c0' : '#b9b2a0';
      if (horiz) { ctx.fillRect(x, y, len, 2); ctx.fillRect(x - 1, y - 1, 2, 4); ctx.fillRect(x + len - 1, y - 1, 2, 4); }
      else { ctx.fillRect(x, y, 2, len); }
    }
    if (variant % 2) {
      ctx.fillStyle = '#e2ddcc'; circle(ctx, 6, 8, 3);
      ctx.fillStyle = '#1a1420'; ctx.fillRect(5, 7, 1, 2); ctx.fillRect(7, 7, 1, 2);
    }
    propCache.set(key, cv);
    return cv;
  }

  /* Barile e cassa: arredo di villaggi e accampamenti */
  function barrel() {
    if (propCache.has('barrel')) return propCache.get('barrel');
    const cv = makeCanvas(14, 18), ctx = cv.getContext('2d');
    ctx.fillStyle = '#1d1510'; ctx.fillRect(1, 2, 12, 16);
    ctx.fillStyle = '#5a4028'; ctx.fillRect(2, 3, 10, 14);
    ctx.fillStyle = '#6d4e36'; ctx.fillRect(3, 3, 3, 14);
    ctx.fillStyle = '#3b2a1a';
    for (const y of [5, 10, 15]) ctx.fillRect(2, y, 10, 2);
    ctx.fillStyle = '#8f96a3';
    for (const y of [5, 15]) ctx.fillRect(2, y, 10, 1);
    ctx.fillStyle = '#75542f'; ctx.fillRect(3, 2, 8, 2);
    propCache.set('barrel', cv);
    return cv;
  }

  function crate() {
    if (propCache.has('crate')) return propCache.get('crate');
    const cv = makeCanvas(16, 16), ctx = cv.getContext('2d');
    ctx.fillStyle = '#1d1510'; ctx.fillRect(1, 3, 14, 13);
    ctx.fillStyle = '#6b4a30'; ctx.fillRect(2, 4, 12, 11);
    ctx.fillStyle = '#7d5738'; ctx.fillRect(2, 4, 12, 3);
    ctx.fillStyle = '#3b2a1a';
    ctx.fillRect(2, 8, 12, 1); ctx.fillRect(7, 4, 1, 11);
    ctx.fillRect(2, 4, 12, 1); ctx.fillRect(2, 14, 12, 1);
    propCache.set('crate', cv);
    return cv;
  }

  /* Lapide: la valle ne è piena */
  function gravestone(variant) {
    const key = 'grave' + variant;
    if (propCache.has(key)) return propCache.get(key);
    const cv = makeCanvas(14, 18), ctx = cv.getContext('2d');
    const lean = variant % 2 ? 1 : 0;
    ctx.fillStyle = '#141019';
    ctx.fillRect(2 + lean, 2, 10, 15);
    ctx.fillStyle = '#4d4757'; ctx.fillRect(3 + lean, 3, 8, 14);
    ctx.fillStyle = '#5c5568'; ctx.fillRect(3 + lean, 3, 3, 14);
    ctx.fillStyle = '#38323f';
    ctx.fillRect(5 + lean, 6, 4, 1); ctx.fillRect(5 + lean, 9, 4, 1); ctx.fillRect(6 + lean, 12, 2, 1);
    ctx.fillStyle = '#141019'; circle(ctx, 7 + lean, 4, 3);
    ctx.fillStyle = '#4d4757'; circle(ctx, 7 + lean, 4, 2);
    propCache.set(key, cv);
    return cv;
  }

  /* Staccionata */
  function fence(variant) {
    const key = 'fence' + variant;
    if (propCache.has(key)) return propCache.get(key);
    const cv = makeCanvas(16, 16), ctx = cv.getContext('2d');
    ctx.fillStyle = '#1d1510';
    for (const x of [2, 12]) ctx.fillRect(x, 4, 3, 12);
    ctx.fillStyle = '#5a4028';
    for (const x of [2, 12]) ctx.fillRect(2 + (x === 2 ? 0 : 10), 5, 2, 11);
    ctx.fillStyle = '#4a3524';
    ctx.fillRect(0, 7, 16, 2); ctx.fillRect(0, 12, 16, 2);
    ctx.fillStyle = '#6d4e36';
    ctx.fillRect(0, 7, 16, 1); ctx.fillRect(0, 12, 16, 1);
    propCache.set(key, cv);
    return cv;
  }

  /* Stalagmite delle caverne */
  function stalagmite(variant) {
    const key = 'stalag' + variant;
    if (propCache.has(key)) return propCache.get(key);
    const h = 14 + variant * 5;
    const cv = makeCanvas(14, h), ctx = cv.getContext('2d');
    for (let y = 0; y < h; y++) {
      const t = y / h;
      const w = Math.max(1, Math.round(1 + t * 5));
      ctx.fillStyle = '#231e2c';
      ctx.fillRect(7 - w, y, w * 2, 1);
      ctx.fillStyle = '#3a3345';
      ctx.fillRect(7 - w + 1, y, Math.max(1, w), 1);
      if (y > h * 0.5 && y % 4 === 0) { ctx.fillStyle = '#4a4257'; ctx.fillRect(7 - w + 1, y, 1, 1); }
    }
    propCache.set(key, cv);
    return cv;
  }

  /* Ragnatela d'angolo */
  function cobweb(variant) {
    const key = 'web' + variant;
    if (propCache.has(key)) return propCache.get(key);
    const cv = makeCanvas(16, 16), ctx = cv.getContext('2d');
    ctx.strokeStyle = 'rgba(210,205,225,0.55)';
    ctx.lineWidth = 1;
    const cx = variant % 2 ? 0 : 16, cy = 0;
    for (let i = 0; i <= 4; i++) {
      const a = (i / 4) * (Math.PI / 2) + (variant % 2 ? 0 : Math.PI / 2);
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a) * 16, cy + Math.sin(a) * 16);
      ctx.stroke();
    }
    for (let r = 5; r <= 15; r += 5) {
      ctx.beginPath();
      ctx.arc(cx, cy, r, variant % 2 ? 0 : Math.PI / 2, variant % 2 ? Math.PI / 2 : Math.PI);
      ctx.stroke();
    }
    propCache.set(key, cv);
    return cv;
  }

  /* Stendardo della Rocca */
  function banner(variant) {
    const key = 'banner' + variant;
    if (propCache.has(key)) return propCache.get(key);
    const cv = makeCanvas(14, 30), ctx = cv.getContext('2d');
    ctx.fillStyle = '#2a2430'; ctx.fillRect(1, 0, 12, 2);
    ctx.fillStyle = '#6b1f1f'; ctx.fillRect(2, 2, 10, 24);
    ctx.fillStyle = '#8f2d2d'; ctx.fillRect(3, 2, 4, 24);
    ctx.fillStyle = '#f06c3a';
    circle(ctx, 7, 11, 3);
    ctx.fillStyle = '#6b1f1f'; circle(ctx, 7, 11, 1);
    ctx.fillStyle = '#5a1717';
    ctx.beginPath(); ctx.moveTo(2, 26); ctx.lineTo(7, 30); ctx.lineTo(12, 26); ctx.closePath(); ctx.fill();
    propCache.set(key, cv);
    return cv;
  }

  /* Colonna/pilastro della Rocca */
  function pillar() {
    if (propCache.has('pillar')) return propCache.get('pillar');
    const cv = makeCanvas(20, 40);
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#0d0b10'; ctx.fillRect(1, 0, 18, 40);
    ctx.fillStyle = '#4a4252'; ctx.fillRect(2, 1, 16, 38);
    ctx.fillStyle = '#5a5163'; ctx.fillRect(3, 1, 6, 38);
    ctx.fillStyle = '#332d3b';
    for (let y = 4; y < 40; y += 7) ctx.fillRect(2, y, 16, 1);
    ctx.fillStyle = '#5a5163'; ctx.fillRect(0, 0, 20, 5); ctx.fillRect(0, 35, 20, 5);
    ctx.fillStyle = '#0d0b10'; ctx.fillRect(0, 5, 20, 1); ctx.fillRect(0, 34, 20, 1);
    propCache.set('pillar', cv);
    return cv;
  }

  /* Icona di un oggetto risolto: sceglie lo sprite giusto e lo ricolora. */
  function iconFor(res) {
    if (!res) return sprite('ic_misc');
    if (res.type === 'potion') {
      const col = res.potion ? res.potion.color : '#6fb3ff';
      return sprite('ic_potion', { j: col, w: '#ffffff' });
    }
    const map = {
      w_rusty: ['ic_sword', { o: '#8a7f74', d: '#6b5a3f' }],
      w_iron: ['ic_sword', null],
      w_steel: ['ic_sword', { o: '#dfe6f2' }],
      w_ember: ['ic_sword', { o: '#f0864a', d: '#ffd166' }],
      w_fang: ['ic_sword', { o: '#ffb066', d: '#ffe6a0', l: '#5a1f1f' }],
      w_axe: ['ic_axe', null],
      w_maul: ['ic_maul', null],
      w_dagger: ['ic_dagger', null],
      a_rags: ['ic_robe', { c: '#6b6357', C: '#4c463d' }],
      a_leath: ['ic_robe', { c: '#8a5c30', C: '#5e3d1f' }],
      a_chain: ['ic_armor', null],
      a_plate: ['ic_armor', { M: '#6c7280', o: '#dfe6f2' }],
      a_mantle: ['ic_robe', { c: '#6e6478', C: '#463d50' }],
      t_hearth: ['ic_amulet', { j: '#f06c3a' }],
      t_sigil: ['ic_amulet', { j: '#6fb3ff' }],
      t_ring: ['ic_ring', null],
      t_totem: ['ic_amulet', { d: '#8a6a3f', j: '#a5713f' }],
      t_eye: ['ic_amulet', { j: '#c9a6ff', d: '#8a6fd1' }],
      coin: ['ic_coin', null],

/* ============================================================
   AUDIO: sintesi in tempo reale con WebAudio.
   Nessun file da scaricare: ogni suono è generato da oscillatori.

   ============================================================ */
(function (root) {

  /* Riverbero sintetico: rumore con decadimento esponenziale, nessun file da caricare. */
  function makeImpulse(c, duration, decay) {
    const len = Math.floor(c.sampleRate * duration);
    const buf = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }

     suona sterile/8-bit, aggiunge un pelo di calore a tutto il segnale. */
  function makeSatCurve(amount) {
    const n = 2048;
    const curve = new Float32Array(n);
    const k = 1 + amount;
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * 2 - 1;
      curve[i] = Math.tanh(x * k) / Math.tanh(k);
    }
    return curve;

    shaper.curve = makeSatCurve(0.5);
    shaper.oversample = '2x';

    shaper.connect(ctx.destination);

    musicGain.gain.value = 0.28;

       resta sempre alla stessa intensità e diventa monotono in fretta.

    const swellLfo = ctx.createOscillator();
    swellLfo.type = 'sine';
    swellLfo.frequency.value = 1 / 80;

/* ============================================================

    KeyI: 'inv', KeyL: 'quests', KeyP: 'skills', KeyM: 'map', Tab: 'inv',
    'key:j': 'attack', 'key:k': 'block', 'key:q': 'cast', 'key: ': 'dodge',
    'key:e': 'interact', 'key:r': 'potion', 'key:escape': 'menu',
    'key:i': 'inv', 'key:l': 'quests', 'key:p': 'skills', 'key:m': 'map', 'key:tab': 'inv'

    KeyD: [1, 0], ArrowRight: [1, 0],

    const r = small ? 25 : 29;      /* pulsanti secondari */
    const rb = ins.bottom + (small ? 18 : 26);
    const rr = ins.right + (small ? 14 : 20);

    /* Disposizione a diamante attorno al pulsante d'attacco.
       `D` è la distanza fra i centri: tenuta maggiore della somma dei
       raggi, così due pulsanti non possono mai sovrapporsi. */
    const ax = w - rr - R - 6;
    const ay = h - rb - R - 10;
    const Dg = R + r + 17;
    const dodgeX = ax - Dg;

    return {
      w, h, insets: ins,
      attack:   { x: ax,                 y: ay,                 r: R,     icon: 'attack',   label: 'Colpo' },
      block:    { x: ax,                 y: ay - Dg,            r: r,     icon: 'block',    label: 'Parata' },
      dodge:    { x: dodgeX,             y: ay,                 r: r,     icon: 'dodge',    label: 'Schivata' },
      cast:     { x: ax - Dg * 0.72,     y: ay - Dg * 0.72,     r: r,     icon: 'cast',     label: 'Fuoco' },
      interact: { x: ax,                 y: ay - Dg * 2,        r: r - 2, icon: 'interact', label: 'Usa', conditional: true },
      menu:     { x: w - rr - 24,        y: ins.top + 30,       r: 21,    icon: 'menu',     label: 'Menu' },
      potion:   { x: w - rr - 24,        y: ins.top + 80,       r: 21,    icon: 'potion',   label: 'Pozione' },
      /* Area del joystick / tap di movimento: si ferma prima dei pulsanti */
      stickZone: { x0: 0, y0: ins.top + 110, x1: Math.min(w * 0.55, dodgeX - r - 12), y1: h }
    };
  }

  function setLayout(w, h, insets) { state.layout = computeLayout(w, h, insets); }

  function hitButton(x, y, onlyKeys) {
    const L = state.layout;
    if (!L) return null;
    const keys = onlyKeys || ['attack', 'dodge', 'cast', 'block', 'menu', 'potion', 'interact'];
    for (const k of keys) {
      const b = L[k];
      if (!b) continue;
      if (b.conditional && !state.interactAvailable) continue;
      /* Area di tocco leggermente più generosa del disegno: dita, non puntatori */
      const pad = 8;
      if (M.dist2(x, y, b.x, b.y) <= (b.r + pad) * (b.r + pad)) return k;
    }
    return null;
  }

  function press(action) {
    if (!state.down[action]) state.pressed[action] = true;
    state.down[action] = true;
  }
  function release(action) {
    if (state.down[action]) state.released[action] = true;
    state.down[action] = false;
  }

  function isTouchScheme() {

    return s === 'touch_stick' || s === 'touch_tap';

  /* ---------------- Registrazione eventi ---------------- */
  function attach(canvas) {
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    canvas.addEventListener('pointermove', onMove, { passive: false });
    root.addEventListener('pointerup', onUp, { passive: false });
    root.addEventListener('pointercancel', onUp, { passive: false });

    root.addEventListener('keydown', onKeyDown);
    root.addEventListener('keyup', onKeyUp);
    root.addEventListener('blur', clearAll);

    function localPos(e) {
      const r = canvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    function onDown(e) {
      if (!state.enabled) return;

      if (touch && !state.detected) state.detected = 'touch_stick';
      if (!touch && !state.detected) state.detected = 'kbm';

      /* Mouse: bottone destro = parata, sinistro = attacco, MA prima si
         controlla se il sinistro cade su Menu/Pozione (gli unici pulsanti
         del cerchio disegnati anche in schema kbm: vedi hud.js). */
      if (!touch && !isTouchScheme()) {
        state.aimScreen = p;
        if (e.button === 0) {
          const btn = hitButton(p.x, p.y, ['menu', 'potion']);
          if (btn) {

          }
        }

        else if (e.button === 0) press('attack');
        else if (e.button === 1) press('cast');
        return;
      }

      const btn = hitButton(p.x, p.y);
      if (btn) {
        state.pointers.set(e.pointerId, { role: 'button', btn: btn });
        press(btn);
        return;
      }

      if (scheme === 'touch_stick') {
