/* ============================================================
   GENERAZIONE DEL MONDO.
   Deterministica: lo stesso seme produce sempre la stessa zona,
   quindi il mondo non ha bisogno di essere salvato, solo il suo
   stato mutevole (forzieri aperti, nemici uccisi, nodi raccolti).
   ============================================================ */
(function (root) {
  'use strict';
  const CV = root.CV || (root.CV = {});
  const D = CV.Data;
  const A = CV.Art;
  const M = CV.M;
  const T = 16;   /* dimensione del tile in pixel */
  /* La nuova tabella dei siti cambia quali scene occupano gli indici
     deterministici. Versionare le chiavi evita di applicare a un nuovo sito
     lo stato persistito di una scena diversa nei salvataggi esistenti. */
  const SITE_KEY_VERSION = 2;

  /* Indici dei tile nell'atlante */
  const TI = {};
  A.TILE_KEYS.forEach((k, i) => { TI[k] = i; });

  function idx(z, tx, ty) { return ty * z.w + tx; }
  function inside(z, tx, ty) { return tx >= 0 && ty >= 0 && tx < z.w && ty < z.h; }

  function setTile(z, tx, ty, key, solid) {
    if (!inside(z, tx, ty)) return;
    const i = idx(z, tx, ty);
    z.tiles[i] = TI[key];
    z.variant[i] = (CV.noise.hash2(tx, ty, z.def.seed) * A.VARIANTS) | 0;
    z.solid[i] = solid ? 1 : 0;
  }

  function fillRect(z, x0, y0, w, h, key, solid) {
    for (let y = y0; y < y0 + h; y++)
      for (let x = x0; x < x0 + w; x++) setTile(z, x, y, key, solid);
  }

  /* Libera un'area attorno a un punto d'interesse: garantisce che
     forzieri, uscite e PNG non finiscano dentro un muro. */
  function clearAround(z, tx, ty, r, key) {
    for (let y = ty - r; y <= ty + r; y++)
      for (let x = tx - r; x <= tx + r; x++)
        if (inside(z, x, y)) setTile(z, x, y, key, false);
  }

  /* ================================================================
     BIOMI
     ================================================================ */

  function genVillage(z, rng) {
    const d = z.def;
    /* Prato con macchie di terra */
    for (let y = 0; y < z.h; y++) {
      for (let x = 0; x < z.w; x++) {
        const n = CV.noise.fbm(x / 9, y / 9, d.seed, 3);
        setTile(z, x, y, n > 0.58 ? 'dirt' : (n < 0.36 ? 'ash_grass' : 'grass'), false);
        z.elev[idx(z, x, y)] = n * 255;
      }
    }
    /* Palizzata perimetrale con varchi verso le uscite */
    for (let x = 0; x < z.w; x++) { setTile(z, x, 0, 'village_wall', true); setTile(z, x, 1, 'village_wall', true); setTile(z, x, z.h - 1, 'village_wall', true); }
    for (let y = 0; y < z.h; y++) { setTile(z, 0, y, 'village_wall', true); setTile(z, 1, y, 'village_wall', true); setTile(z, z.w - 1, y, 'village_wall', true); setTile(z, z.w - 2, y, 'village_wall', true); }

    /* Strade principali a croce */
    fillRect(z, 22, 4, 4, z.h - 6, 'path', false);
    fillRect(z, 6, 21, z.w - 12, 4, 'path', false);
    fillRect(z, 18, 18, 12, 12, 'path', false);

    /* Case attorno alla piazza */
    const spots = [
      [8, 14, 0], [36, 12, 1], [8, 30, 1], [36, 30, 0], [17, 6, 1], [30, 36, 1]
    ];
    for (const [tx, ty, v] of spots) {
      const img = A.house(v);
      const px = tx * T, py = ty * T;
      z.props.push({ kind: 'house', img: img, x: px + img.width / 2, y: py + img.height, ox: img.width / 2, oy: img.height,
        col: { x: px + 3, y: py + img.height - 26, w: img.width - 6, h: 24 } });
      /* Il muro della casa blocca il passaggio */
      const cw = Math.ceil((img.width - 6) / T), ch = 2;
      for (let yy = 0; yy < ch; yy++) for (let xx = 0; xx < cw; xx++) {
        const gx = tx + xx, gy = ty + Math.floor((img.height - 26) / T) + yy;
        if (inside(z, gx, gy)) z.solid[idx(z, gx, gy)] = 1;
      }
    }

    /* Alberi e cespugli negli spazi liberi */
    scatterNature(z, rng, 26, 20, [0, 1, 2, 3], 0.5);
    /* Uscita verso la brughiera: apre la palizzata */
    for (const ex of d.exits) clearAround(z, ex.tx, ex.ty, 2, 'path');
  }

  function genMoor(z, rng) {
    const d = z.def;
    for (let y = 0; y < z.h; y++) {
      for (let x = 0; x < z.w; x++) {
        const n = CV.noise.fbm(x / 11, y / 11, d.seed, 4);
        const n2 = CV.noise.fbm(x / 5 + 40, y / 5, d.seed + 77, 2);
        let key = 'ash_grass';
        if (n > 0.63) key = 'ash';
        else if (n < 0.34) key = 'dirt';
        if (n2 > 0.78 && n < 0.5) key = 'water';
        setTile(z, x, y, key, key === 'water');
        z.elev[idx(z, x, y)] = n * 255;
      }
    }
    borderWalls(z, 'rock_wall');
    /* Sentiero irregolare che attraversa la brughiera */
    windingPath(z, rng, 32, z.h - 4, 60, 14, 'path');
    windingPath(z, rng, 32, 40, 4, 30, 'path');
    scatterNature(z, rng, 30, 34, [4, 5, 6, 7], 0.35);
    scatterRocks(z, rng, 26);
  }

  function genForest(z, rng) {
    const d = z.def;
    for (let y = 0; y < z.h; y++) {
      for (let x = 0; x < z.w; x++) {
        const n = CV.noise.fbm(x / 10, y / 10, d.seed, 3);
        /* Sottobosco: terra battuta e chiazze d'erba secca. Niente pietra,
           che in mezzo agli alberi legge come una macchia fredda fuori posto. */
        setTile(z, x, y, n > 0.6 ? 'dirt' : (n < 0.38 ? 'ash_grass' : 'grass'), false);
        z.elev[idx(z, x, y)] = n * 255;
      }
    }
    borderWalls(z, 'rock_wall');
    windingPath(z, rng, z.w - 4, 32, 32, 4, 'path');
    /* Bosco fitto: la densità cresce lontano dai sentieri */
    scatterNature(z, rng, 150, 70, [0, 1, 2, 3, 4, 6], 0.9);
    scatterRocks(z, rng, 16);
  }

  function genCave(z, rng) {
    /* Si parte da roccia piena e si scava. */
    for (let y = 0; y < z.h; y++)
      for (let x = 0; x < z.w; x++) setTile(z, x, y, 'rock_wall', true);

    /* Punti da collegare: uscite, nodi, forzieri, nemici unici */
    const pts = [];
    const d = z.def;
    for (const e of d.exits) pts.push([e.tx, e.ty]);
    for (const n of (d.nodes || [])) pts.push([n.tx, n.ty]);
    for (const c of (d.chests || [])) pts.push([c.tx, c.ty]);
    for (const n of (d.named || [])) pts.push([n.tx, n.ty]);
    /* Qualche sala extra per dare respiro */
    for (let i = 0; i < 7; i++) pts.push([rng.int(6, z.w - 7), rng.int(6, z.h - 7)]);

    /* Sale */
    for (const [tx, ty] of pts) {
      const r = rng.int(3, 5);
      for (let y = -r; y <= r; y++)
        for (let x = -r; x <= r; x++)
          if (x * x + y * y <= r * r + 2) setTile(z, tx + x, ty + y, 'cave_floor', false);
    }
    /* Corridoi che collegano ogni punto al successivo, con serpeggiamento */
    for (let i = 1; i < pts.length; i++) tunnel(z, rng, pts[i - 1], pts[i]);
    /* Un paio di anelli, così non è un albero lineare */
    tunnel(z, rng, pts[0], pts[pts.length - 1]);
    if (pts.length > 4) tunnel(z, rng, pts[2], pts[pts.length - 2]);

    /* Pozze di lava nelle vene di braceferro */
    for (let i = 0; i < 5; i++) {
      const tx = rng.int(5, z.w - 6), ty = rng.int(5, z.h - 6);
      if (z.solid[idx(z, tx, ty)]) continue;
      const r = rng.int(1, 2);
      for (let y = -r; y <= r; y++)
        for (let x = -r; x <= r; x++)
          if (!z.solid[idx(z, M.clamp(tx + x, 0, z.w - 1), M.clamp(ty + y, 0, z.h - 1))])
            setTile(z, tx + x, ty + y, 'lava', true);
    }
    borderWalls(z, 'rock_wall');
    for (const e of d.exits) clearAround(z, e.tx, e.ty, 2, 'cave_floor');
    scatterRocks(z, rng, 18, true);
    /* Rete di sicurezza: nessun punto d'interesse deve restare isolato. */
    ensureConnected(z, pts);
  }

  function genKeep(z, rng) {
    const d = z.def;
    for (let y = 0; y < z.h; y++)
      for (let x = 0; x < z.w; x++) setTile(z, x, y, 'keep_wall', true);

    /* Sala del trono in alto, cortili sotto, corridoio centrale */
    const rooms = [
      [8, 4, 32, 18],    /* sala del boss */
      [6, 24, 16, 12],
      [26, 24, 16, 12],
      [16, 38, 16, 12]
    ];
    for (const [x, y, w, h] of rooms) fillRect(z, x, y, w, h, 'keep_floor', false);
    fillRect(z, 22, 20, 4, 22, 'keep_floor', false);
    fillRect(z, 20, 34, 8, 6, 'keep_floor', false);
    fillRect(z, 22, 46, 4, 8, 'keep_floor', false);

    /* Colonne nella sala del trono */
    for (const cx of [12, 20, 28, 36]) {
      for (const cy of [8, 16]) {
        const img = A.pillar();
        z.props.push({ kind: 'pillar', img: img, x: cx * T + 8, y: cy * T + 20, ox: img.width / 2, oy: img.height,
          col: { x: cx * T + 1, y: cy * T + 4, w: 14, h: 14 } });
        setTile(z, cx, cy, 'keep_floor', true);
      }
    }
    /* Canali di lava ai lati della sala. Il varco centrale (x20-27) lascia
       libero il corridoio [22,20,4,22] che scende al resto della Rocca:
       prima la striscia correva su tutta la larghezza e sigillava la sala
       del boss, corridoio incluso, tagliandola fuori dal resto della mappa. */
    fillRect(z, 8, 21, 12, 1, 'lava', true);
    fillRect(z, 28, 21, 12, 1, 'lava', true);
    for (const e of d.exits) clearAround(z, e.tx, e.ty, 2, 'keep_floor');
    borderWalls(z, 'keep_wall');
  }

  /* ---------------- Strumenti di generazione ---------------- */

  function borderWalls(z, key) {
    for (let x = 0; x < z.w; x++) {
      setTile(z, x, 0, key, true); setTile(z, x, 1, key, true);
      setTile(z, x, z.h - 1, key, true); setTile(z, x, z.h - 2, key, true);
    }
    for (let y = 0; y < z.h; y++) {
      setTile(z, 0, y, key, true); setTile(z, 1, y, key, true);
      setTile(z, z.w - 1, y, key, true); setTile(z, z.w - 2, y, key, true);
    }
  }

  function tunnel(z, rng, a, b) {
    let [x, y] = a;
    const [tx, ty] = b;
    let guard = 0;
    const carve = (cx, cy) => {
      for (let dy = -1; dy <= 1; dy++)
        for (let dx = -1; dx <= 1; dx++)
          setTile(z, M.clamp(cx + dx, 2, z.w - 3), M.clamp(cy + dy, 2, z.h - 3), 'cave_floor', false);
    };
    while ((x !== tx || y !== ty) && guard++ < 600) {
      carve(x, y);
      if (rng.chance(0.78)) {
        if (Math.abs(tx - x) > Math.abs(ty - y)) x += Math.sign(tx - x);
        else y += Math.sign(ty - y);
      } else {
        if (rng.chance(0.5)) x += rng.chance(0.5) ? 1 : -1;
        else y += rng.chance(0.5) ? 1 : -1;
        x = M.clamp(x, 2, z.w - 3); y = M.clamp(y, 2, z.h - 3);
      }
    }
    carve(tx, ty);
  }

  /* Insieme delle celle non solide raggiungibili da `start` (BFS 4-direzionale). */
  function floodReachable(z, start) {
    const seen = new Uint8Array(z.w * z.h);
    const startI = idx(z, start[0], start[1]);
    seen[startI] = 1;
    const stack = [start[0], start[1]];
    while (stack.length) {
      const y = stack.pop(), x = stack.pop();
      const neigh = [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]];
      for (const [nx, ny] of neigh) {
        if (!inside(z, nx, ny)) continue;
        const i = idx(z, nx, ny);
        if (seen[i] || z.solid[i]) continue;
        seen[i] = 1;
        stack.push(nx, ny);
      }
    }
    return seen;
  }

  /* Corridoio in linea retta (nessuna casualità, nessun guard): usato solo
     come riparazione di emergenza quando tunnel() non è riuscito a collegare
     due punti, per garantire sempre la connessione indipendentemente dalla
     fortuna dell'rng. */
  function carveDirect(z, a, b) {
    let [x, y] = a;
    const [tx, ty] = b;
    const carve = (cx, cy) => {
      for (let dy = -1; dy <= 1; dy++)
        for (let dx = -1; dx <= 1; dx++)
          setTile(z, M.clamp(cx + dx, 2, z.w - 3), M.clamp(cy + dy, 2, z.h - 3), 'cave_floor', false);
    };
    while (x !== tx) { carve(x, y); x += Math.sign(tx - x); }
    while (y !== ty) { carve(x, y); y += Math.sign(ty - y); }
    carve(tx, ty);
  }

  /* Verifica finale: ogni punto d'interesse deve essere raggiungibile dal
     primo (un'uscita). tunnel() è casuale e con un guard limitato può non
     arrivare a destinazione su tratte lunghe e sfortunate, lasciando una
     sala scavata ma isolata dal resto della caverna: qui la si ricollega
     con certezza, senza affidarsi di nuovo alla fortuna dell'rng. */
  function ensureConnected(z, pts) {
    if (!pts.length) return;
    let seen = floodReachable(z, pts[0]);
    for (let pass = 0; pass < pts.length; pass++) {
      const unreached = pts.filter(p => !seen[idx(z, p[0], p[1])]);
      if (!unreached.length) break;
      const reached = pts.filter(p => seen[idx(z, p[0], p[1])]);
      for (const p of unreached) {
        let best = reached[0], bestD = Infinity;
        for (const r of reached) {
          const d = (r[0] - p[0]) * (r[0] - p[0]) + (r[1] - p[1]) * (r[1] - p[1]);
          if (d < bestD) { bestD = d; best = r; }
        }
        carveDirect(z, best, p);
      }
      seen = floodReachable(z, pts[0]);
    }
  }

  function windingPath(z, rng, x0, y0, x1, y1, key) {
    let x = x0, y = y0, guard = 0;
    while ((Math.abs(x - x1) > 1 || Math.abs(y - y1) > 1) && guard++ < 500) {
      for (let dy = -1; dy <= 1; dy++)
        for (let dx = -1; dx <= 1; dx++)
          if (inside(z, x + dx, y + dy) && !z.solid[idx(z, x + dx, y + dy)])
            setTile(z, x + dx, y + dy, key, false);
      if (rng.chance(0.72)) {
        if (Math.abs(x1 - x) > Math.abs(y1 - y)) x += Math.sign(x1 - x);
        else y += Math.sign(y1 - y);
      } else {
        x += rng.int(-1, 1); y += rng.int(-1, 1);
        x = M.clamp(x, 3, z.w - 4); y = M.clamp(y, 3, z.h - 4);
      }
    }
  }

  /* Alberi e cespugli, evitando sentieri, muri e punti d'interesse. */
  function scatterNature(z, rng, trees, bushes, variants, edgeBias) {
    const busy = busyMap(z);
    let placed = 0, guard = 0;
    while (placed < trees && guard++ < trees * 40) {
      const tx = rng.int(2, z.w - 3), ty = rng.int(3, z.h - 3);
      const i = idx(z, tx, ty);
      if (z.solid[i] || busy[i]) continue;
      const key = A.TILE_KEYS[z.tiles[i]];
      if (key === 'path' || key === 'water' || key === 'lava') continue;
      /* Più fitto ai bordi della mappa: crea una cornice naturale */
      const edge = Math.min(tx, ty, z.w - tx, z.h - ty) / (Math.min(z.w, z.h) / 2);
      if (rng.next() > (1 - edge) * edgeBias + 0.22) continue;
      const v = rng.pick(variants);
      const img = A.tree(v);
      z.props.push({ kind: 'tree', img: img, sway: v >= 4 ? 0.35 : 0.6, x: tx * T + 8, y: ty * T + 16, ox: img.width / 2, oy: img.height,
        col: { x: tx * T + 4, y: ty * T + 6, w: 9, h: 9 } });
      z.solid[i] = 1; busy[i] = 1;
      placed++;
    }
    placed = 0; guard = 0;
    while (placed < bushes && guard++ < bushes * 30) {
      const tx = rng.int(2, z.w - 3), ty = rng.int(3, z.h - 3);
      const i = idx(z, tx, ty);
      if (z.solid[i] || busy[i]) continue;
      const key = A.TILE_KEYS[z.tiles[i]];
      if (key === 'path' || key === 'water' || key === 'lava') continue;
      const img = A.bush(rng.int(0, 1));
      z.props.push({ kind: 'bush', img: img, sway: 0.85, x: tx * T + 8, y: ty * T + 14, ox: img.width / 2, oy: img.height, col: null });
      busy[i] = 1;
      placed++;
    }
  }

  function scatterRocks(z, rng, n, cave) {
    const busy = busyMap(z);
    let placed = 0, guard = 0;
    while (placed < n && guard++ < n * 40) {
      const tx = rng.int(3, z.w - 4), ty = rng.int(3, z.h - 4);
      const i = idx(z, tx, ty);
      if (z.solid[i] || busy[i]) continue;
      const img = A.rock(rng.int(0, 1));
      z.props.push({ kind: 'rock', img: img, x: tx * T + 8, y: ty * T + 16, ox: img.width / 2, oy: img.height,
        col: { x: tx * T + 2, y: ty * T + 4, w: 13, h: 11 } });
      z.solid[i] = 1; busy[i] = 1;
      placed++;
    }
  }

  /* ---------------- Arredo del mondo ----------------
     `sway` = quanto l'oggetto ondeggia nel vento (0 = rigido).
     `solid` = se blocca il passaggio. */
  const DECOR = {
    tallgrass:  { make: (v) => A.tallgrass(v), n: 3, oy: 13, sway: 1.00, solid: false },
    flowers:    { make: (v) => A.flowers(v),   n: 4, oy: 11, sway: 0.70, solid: false },
    mushrooms:  { make: (v) => A.mushrooms(v), n: 3, oy: 13, sway: 0.25, solid: false, glow: true },
    boneheap:   { make: (v) => A.boneheap(v),  n: 2, oy: 13, sway: 0,    solid: false },
    cobweb:     { make: (v) => A.cobweb(v),    n: 2, oy: 14, sway: 0.35, solid: false },
    stump:      { make: (v) => A.stump(v),     n: 2, oy: 15, sway: 0,    solid: true, cw: 11, ch: 6 },
    barrel:     { make: () => A.barrel(),      n: 1, oy: 17, sway: 0,    solid: true, cw: 10, ch: 6 },
    crate:      { make: () => A.crate(),       n: 1, oy: 15, sway: 0,    solid: true, cw: 12, ch: 6 },
    gravestone: { make: (v) => A.gravestone(v),n: 2, oy: 17, sway: 0,    solid: true, cw: 9,  ch: 5 },
    fence:      { make: (v) => A.fence(v),     n: 2, oy: 15, sway: 0,    solid: true, cw: 14, ch: 5 },
    /* Le stalagmiti non bloccano: nelle gallerie strette chiuderebbero
       il passaggio, e una miniera impercorribile non è un'ambientazione. */
    stalagmite: { make: (v) => A.stalagmite(v),n: 3, oy: 0,  sway: 0,    solid: false },
    banner:     { make: (v) => A.banner(v),    n: 2, oy: 30, sway: 0.55, solid: false }
  };

  /* Che cosa cresce dove: è la differenza fra cinque mappe e cinque luoghi. */
  /* Densità alte: nella vista rientra circa il 4% della mappa, quindi
     numeri bassi si traducono in schermate spoglie. */
  const BIOME_DECOR = {
    village: [['tallgrass', 120], ['flowers', 60], ['fence', 12], ['barrel', 7], ['crate', 7], ['stump', 9]],
    moor:    [['tallgrass', 210], ['flowers', 34], ['stump', 18], ['boneheap', 14], ['gravestone', 11], ['fence', 8]],
    forest:  [['tallgrass', 290], ['mushrooms', 42], ['stump', 28], ['flowers', 48], ['boneheap', 9]],
    cave:    [['stalagmite', 75], ['mushrooms', 48], ['boneheap', 24], ['cobweb', 32], ['crate', 6]],
    keep:    [['banner', 13], ['boneheap', 18], ['gravestone', 9], ['crate', 9], ['barrel', 7], ['cobweb', 16]]
  };

  /* Un oggetto che blocca può essere piazzato solo in uno spazio aperto:
     in un corridoio a un tile chiuderebbe la strada. */
  function openEnough(z, tx, ty) {
    let free = 0;
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        if (inside(z, tx + dx, ty + dy) && !z.solid[idx(z, tx + dx, ty + dy)]) free++;
      }
    }
    return free >= 7;
  }

  function scatterDecor(z, rng, busy) {
    const list = BIOME_DECOR[z.def.biome] || [];
    for (const [kind, count] of list) {
      const def = DECOR[kind];
      if (!def) continue;
      let placed = 0, guard = 0;
      while (placed < count && guard++ < count * 45) {
        const tx = rng.int(3, z.w - 4), ty = rng.int(3, z.h - 4);
        const i = idx(z, tx, ty);
        if (z.solid[i] || busy[i]) continue;
        const key = A.TILE_KEYS[z.tiles[i]];
        if (key === 'water' || key === 'lava') continue;
        /* L'erba non cresce sul sentiero battuto */
        if (key === 'path' && def.sway > 0.5) continue;
        if (def.solid && !openEnough(z, tx, ty)) continue;

        const v = rng.int(0, def.n - 1);
        const img = def.make(v);
        const oy = def.oy || img.height;
        const o = {
          kind: kind, img: img, sway: def.sway,
          x: tx * T + 8, y: ty * T + Math.min(16, oy),
          ox: img.width / 2, oy: oy, col: null
        };
        if (def.solid) {
          o.col = { x: tx * T + 8 - def.cw / 2, y: ty * T + 16 - def.ch, w: def.cw, h: def.ch };
          z.solid[i] = 1;
        }
        if (def.glow) o.glow = true;
        z.props.push(o);
        busy[i] = 1;
        placed++;
      }
    }
  }

  /* Marca come occupate le celle vicino a uscite, nodi, forzieri, PNG. */
  function busyMap(z) {
    const b = new Uint8Array(z.w * z.h);
    const mark = (tx, ty, r) => {
      for (let y = ty - r; y <= ty + r; y++)
        for (let x = tx - r; x <= tx + r; x++)
          if (inside(z, x, y)) b[idx(z, x, y)] = 1;
    };
    const d = z.def;
    for (const e of (d.exits || [])) mark(e.tx, e.ty, 3);
    for (const n of (d.nodes || [])) mark(n.tx, n.ty, 2);
    for (const c of (d.chests || [])) mark(c.tx, c.ty, 2);
    for (const n of (d.named || [])) mark(n.tx, n.ty, 4);
    for (const p of (d.props || [])) mark(p.tx, p.ty, 2);
    for (const id in D.npcs) if (D.npcs[id].zone === d.id) mark(D.npcs[id].tx, D.npcs[id].ty, 2);
    return b;
  }

  /* ================================================================
     SITI: luoghi generati proceduralmente.

     Fino a qui la generazione produceva terreno e arredo: spazio, non
     contenuto. Tutti i punti d'interesse venivano da liste scritte a mano
     in story.js, quindi uscire dal sentiero non pagava mai. Un sito è una
     scena — terreno modificato, arredo, una composizione di nemici e una
     ricompensa — ed è la fonte procedurale che mancava.

     I nemici arrivano per RUOLO (vedi D.sites): la zona decide chi
     interpreta quel ruolo, così i siti non vanno riscritti quando il
     bestiario cresce.
     ================================================================ */

  /* Pavimento e muro coerenti col bioma: un sito di pietra nel bosco
     stona, e in caverna 'dirt' non esiste nell'atlante come pavimento. */
  function floorKeyFor(biome, preferred) {
    if (biome === 'cave') return 'cave_floor';
    if (biome === 'keep') return 'keep_floor';
    return preferred || 'dirt';
  }
  function wallKeyFor(biome) {
    return biome === 'keep' ? 'keep_wall' : 'rock_wall';
  }

  /* Scorre le celle di un disco in tile. */
  function eachDisc(z, tx, ty, r, fn) {
    for (let y = ty - r; y <= ty + r; y++)
      for (let x = tx - r; x <= tx + r; x++) {
        const dx = x - tx, dy = y - ty;
        if (dx * dx + dy * dy > r * r) continue;
        if (inside(z, x, y)) fn(x, y, idx(z, x, y));
      }
  }

  /* Rimuove gli oggetti già sparsi dentro l'area del sito.
     Serve davvero: alberi e rocce sono piazzati dai generatori di bioma
     PRIMA dei siti, e spianare il terreno senza togliere l'albero
     lascerebbe una collisione invisibile in mezzo alla radura. */
  function clearProps(z, cx, cy, rPx) {
    const kept = [];
    for (const p of z.props) {
      if (M.dist(p.x, p.y, cx, cy) > rPx) { kept.push(p); continue; }
      /* Libera anche le celle che l'oggetto rendeva solide */
      if (p.col) {
        const x0 = Math.floor(p.col.x / T), x1 = Math.floor((p.col.x + p.col.w) / T);
        const y0 = Math.floor(p.col.y / T), y1 = Math.floor((p.col.y + p.col.h) / T);
        for (let y = y0; y <= y1; y++)
          for (let x = x0; x <= x1; x++)
            if (inside(z, x, y)) z.solid[idx(z, x, y)] = 0;
      }
    }
    z.props = kept;
  }

  /* La cella libera più vicina: un nemico o un nodo dichiarato in
     posizione relativa può cadere su roccia quando il sito non spiana. */
  function nearestFree(z, tx, ty, maxR) {
    for (let r = 0; r <= (maxR || 4); r++) {
      for (let y = ty - r; y <= ty + r; y++)
        for (let x = tx - r; x <= tx + r; x++) {
          if (Math.max(Math.abs(x - tx), Math.abs(y - ty)) !== r) continue;
          if (!inside(z, x, y) || z.solid[idx(z, x, y)]) continue;
          const key = A.TILE_KEYS[z.tiles[idx(z, x, y)]];
          if (key === 'water' || key === 'lava') continue;
          return { tx: x, ty: y };
        }
    }
    return null;
  }

  /* Il sito può stare qui? Il controllo è severo di proposito: un sito
     che tappa un corridoio o inghiotte un PNG costa più di un sito in meno. */
  function siteFits(z, s, tx, ty, busy, placed) {
    const r = s.r;
    if (tx - r < 3 || ty - r < 3 || tx + r > z.w - 4 || ty + r > z.h - 4) return false;
    /* Mai a ridosso di un varco: si entrerebbe dentro uno scontro */
    for (const e of (z.def.exits || []))
      if (M.dist(tx, ty, e.tx, e.ty) < r + 8) return false;
    for (const o of placed)
      if (M.dist(tx, ty, o.tx, o.ty) < r + o.r + 3) return false;
    /* Il centro dev'essere calpestabile: niente siti dentro la roccia */
    if (z.solid[idx(z, tx, ty)]) return false;

    let cells = 0, solid = 0, bad = 0, occupied = 0;
    eachDisc(z, tx, ty, r, (x, y, i) => {
      cells++;
      if (z.solid[i]) solid++;
      if (busy[i]) occupied++;
      const key = A.TILE_KEYS[z.tiles[i]];
      if (key === 'water' || key === 'lava') bad++;
    });
    if (!cells || bad || occupied) return false;
    /* In caverna il sito deve stare in uno spazio già scavato: scavarne uno
       nuovo nella roccia piena produrrebbe una sala irraggiungibile. */
    const maxSolid = z.def.biome === 'cave' ? 0.40 : 0.55;
    return solid / cells <= maxSolid;
  }

  /* Costruisce un oggetto d'arredo del sito riusando la tabella DECOR
     già usata da scatterDecor, più i pochi sprite fissi che servono. */
  function siteProp(z, spec, tx, ty, rng) {
    const px = tx * T + 8;
    let img, oy, sway = 0, col = null, cw = 0, ch = 0;

    if (spec.kind === 'campfire') {
      img = A.sprite('campfire'); oy = 16; cw = 11; ch = 9;
    } else if (spec.kind === 'pillar') {
      img = A.pillar(); oy = img.height; cw = 14; ch = 14;
    } else if (spec.kind === 'altar') {
      img = A.gravestone(0); oy = 17; cw = 9; ch = 5;
    } else {
      const d = DECOR[spec.kind];
      if (!d) return null;
      /* Un oggetto solido in un passaggio stretto lo chiuderebbe */
      if (d.solid && !openEnough(z, tx, ty)) return null;
      img = d.make(rng.int(0, d.n - 1));
      oy = d.oy || img.height;
      sway = d.sway;
      if (d.solid) { cw = d.cw; ch = d.ch; }
    }

    const py = ty * T + Math.min(16, oy);
    if (cw) col = { x: px - cw / 2, y: ty * T + 16 - ch, w: cw, h: ch };
    const o = { kind: spec.kind, img: img, sway: sway, x: px, y: py,
                ox: img.width / 2, oy: oy, col: col };
    if (col) z.solid[idx(z, tx, ty)] = 1;
    z.props.push(o);
    return o;
  }

  function placeSites(z, rng) {
    const def = z.def;
    const want = def.siteCount || 0;
    if (!want || !D.sites) return;

    const roles = def.roles || {};
    /* Un ruolo non definito ricade su quello successivo invece di far
       scartare il sito: così una rovina esiste anche dove non ci sono
       nemici pesanti, con un nemico comune irrobustito. */
    const resolveRole = (role) => {
      let r = role, guard = 0;
      while (r && guard++ < 4) {
        if (roles[r]) return roles[r];
        r = D.roleFallback[r];
      }
      return null;
    };

    const pool = [];
    for (const id in D.sites) {
      const s = D.sites[id];
      if (s.biomes.indexOf(def.biome) < 0) continue;
      if ((s.needs || []).some(role => !resolveRole(role))) continue;
      for (let i = 0; i < (s.weight || 1); i++) pool.push(s);
    }
    if (!pool.length) return;

    const busy = busyMap(z);
    let guard = 0;
    while (z.sites.length < want && guard++ < want * 80) {
      const s = rng.pick(pool);
      const tx = rng.int(s.r + 3, z.w - s.r - 4);
      const ty = rng.int(s.r + 3, z.h - s.r - 4);
      if (!siteFits(z, s, tx, ty, busy, z.sites)) continue;
      const index = z.sites.length;
      const built = buildSite(z, s, tx, ty, index, rng, resolveRole);
      /* prefix e keys identificano il sito come obiettivo: sono ciò che
         main.js legge per sapere quanti nemici del sito sono ancora vivi
         (vedi updateSiteObjective) e sono deterministici — lo stesso seme
         di zona produce sempre lo stesso sito allo stesso indice. */
      z.sites.push({ id: s.id, name: s.name, tx: tx, ty: ty, r: s.r,
        prefix: z.id + ':site' + SITE_KEY_VERSION + ':' + index, keys: built.keys });
      /* L'area occupata vale anche per i siti successivi */
      eachDisc(z, tx, ty, s.r + 1, (x, y, i) => { busy[i] = 1; });
    }
  }

  function buildSite(z, s, tx, ty, index, rng, resolveRole) {
    const biome = z.def.biome;
    const floor = floorKeyFor(biome, s.carve && s.carve.key);
    const prefix = z.id + ':site' + SITE_KEY_VERSION + ':' + index;

    /* 1. Si libera il terreno PRIMA di modificarlo, così le collisioni
          degli alberi rimossi spariscono insieme agli alberi. */
    clearProps(z, tx * T + 8, ty * T + 8, (s.r + 0.5) * T);

    /* 2. Terreno */
    const mode = s.carve ? s.carve.mode : 'none';
    if (mode === 'clear') {
      eachDisc(z, tx, ty, s.r, (x, y) => setTile(z, x, y, floor, false));
      /* Un pavimento spianato non può avere sotto il rilievo del terreno
         originale: il renderer lo leggerebbe come un pavimento bitorzoluto. */
      const flatElev = z.elev[idx(z, tx, ty)];
      eachDisc(z, tx, ty, s.r, (x, y, i) => { z.elev[i] = flatElev; });
    } else if (mode === 'ring') {
      eachDisc(z, tx, ty, s.r - 1, (x, y) => setTile(z, x, y, floor, false));
      const flatElev2 = z.elev[idx(z, tx, ty)];
      eachDisc(z, tx, ty, s.r - 1, (x, y, i) => { z.elev[i] = flatElev2; });
      const wall = wallKeyFor(biome);
      const steps = Math.round(2 * Math.PI * (s.r - 1) * 1.7);
      for (let i = 0; i < steps; i++) {
        const a = (i / steps) * Math.PI * 2;
        if (rng.next() < (s.carve.gaps || 0.4)) continue;   /* i varchi */
        setTile(z, Math.round(tx + Math.cos(a) * (s.r - 1)),
                   Math.round(ty + Math.sin(a) * (s.r - 1)), wall, true);
      }
    }

    /* 3. Arredo */
    for (const p of (s.props || [])) {
      const px = tx + p.dx, py = ty + p.dy;
      if (!inside(z, px, py)) continue;
      const o = siteProp(z, p, px, py, rng);
      /* Il fuoco di un accampamento ripulito diventa un punto di sosta:
         è la ricompensa per aver sgomberato la scena. */
      if (o && p.rest) {
        z.interactables.push({ kind: 'campfire', x: o.x, y: o.y - 8, r: 26, label: 'Riposa' });
      }
    }

    /* 4. Ricompense */
    (s.chests || []).forEach((c, j) => {
      const spot = nearestFree(z, tx + c.dx, ty + c.dy, 3);
      if (!spot) return;
      clearAround(z, spot.tx, spot.ty, 1, floor);
      const o = { key: prefix + 'c' + j, table: c.table,
                  x: spot.tx * T + 8, y: spot.ty * T + 14, open: false };
      z.chests.push(o);
      z.interactables.push({ kind: 'chest', ref: o, x: o.x, y: o.y - 6, r: 26, label: 'Apri' });
    });

    (s.nodes || []).forEach((n, j) => {
      const spot = nearestFree(z, tx + n.dx, ty + n.dy, 3);
      if (!spot) return;
      clearAround(z, spot.tx, spot.ty, 1, floor);
      const o = { key: prefix + 'n' + j, type: n.type,
                  x: spot.tx * T + 8, y: spot.ty * T + 14, spent: 0 };
      z.nodes.push(o);
      z.interactables.push({ kind: 'node', ref: o, x: o.x, y: o.y - 6, r: 24, label: 'Raccogli' });
    });

    if (s.shrine) {
      const spot = nearestFree(z, tx + s.shrine.dx, ty + s.shrine.dy, 3);
      if (spot) {
        clearAround(z, spot.tx, spot.ty, 1, floor);
        siteProp(z, { kind: 'altar' }, spot.tx, spot.ty, rng);
        const o = { key: prefix + 's', x: spot.tx * T + 8, y: spot.ty * T + 14, used: false };
        z.shrines.push(o);
        z.interactables.push({ kind: 'shrine', ref: o, x: o.x, y: o.y - 6, r: 26, label: 'Prega' });
      }
    }

    /* 5. Nemici: composizione, non posizioni a caso. */
    const mkSpawn = (sp, j, keyPrefix) => {
      const id = resolveRole(sp.role);
      if (!id) return null;
      const spot = nearestFree(z, tx + sp.dx, ty + sp.dy, 4);
      if (!spot) return null;
      return {
        key: keyPrefix + j, id: id,
        x: spot.tx * T + 8, y: spot.ty * T + 8,
        siteIndex: index, spawnIndex: j,
        hpMult: sp.hpMult || 1, dmgMult: sp.dmgMult || 1, sightMult: sp.sightMult || 1
      };
    };

    /* Le chiavi dei nemici piazzati qui (non quelli d'imboscata, che
       restano una sorpresa a parte) sono ciò che rende il sito un
       obiettivo verificabile: vedi z.sites.push in placeSites. */
    const keys = [];
    (s.spawns || []).forEach((sp, j) => {
      const e = mkSpawn(sp, j, prefix + ':e');
      if (e) { z.siteSpawns.push(e); keys.push(e.key); }
    });

    if (s.ambush) {
      const list = [];
      (s.ambush.spawns || []).forEach((sp, j) => {
        const e = mkSpawn(sp, j, prefix + ':a');
        if (e) list.push(e);
      });
      if (list.length) {
        z.ambushes.push({ x: tx * T + 8, y: ty * T + 8,
                          r: s.ambush.radius || 46, spawns: list, done: false });
      }
    }
    return { keys: keys };
  }

  /* Applica una variante deterministica ai siti già sgomberati. Il ciclo
     zero resta intenzionalmente invariato rispetto alla prima campagna. */
  function rollSiteMods(z, worldState) {
    if (!D.siteMods || !D.siteModList) return;
    const cycles = worldState.siteCycle = worldState.siteCycle || {};
    const ready = worldState.siteCycleReady = worldState.siteCycleReady || {};
    const now = Date.now() / 1000;

    (z.sites || []).forEach((site, siteIndex) => {
      const storedCycle = Math.max(0, cycles[site.prefix] | 0);
      const cycle = ready[site.prefix] > now ? Math.max(0, storedCycle - 1) : storedCycle;
      site.cycle = cycle;
      const seed = Math.floor(CV.noise.hash2(siteIndex, cycle, z.def.seed + 7301) * 4294967296);
      const rng = new CV.Rng(seed);
      const mod = cycle === 0 ? D.siteMods.none : rng.weighted(D.siteModList);
      site.mod = mod.key;
      site.rewardBonus = mod.rewardBonus || null;
      site.eliteBiasAdd = mod.eliteBiasAdd || 0;
      if (mod.key === 'none') return;

      site.name += ' — ' + mod.label;
      let spawns = z.siteSpawns.filter(s => s.siteIndex === siteIndex);

      if (mod.removeSpawnFrac && spawns.length > 1) {
        const removeCount = Math.min(spawns.length - 1, Math.floor(spawns.length * mod.removeSpawnFrac));
        const removed = new Set(rng.shuffle(spawns.slice()).slice(0, removeCount).map(s => s.key));
        z.siteSpawns = z.siteSpawns.filter(s => !removed.has(s.key));
        site.keys = site.keys.filter(k => !removed.has(k));
        spawns = spawns.filter(s => !removed.has(s.key));
      }

      if (mod.extraSpawns && spawns.length) {
        for (let j = 0; j < mod.extraSpawns; j++) {
          const source = spawns[j % spawns.length];
          const angle = rng.next() * Math.PI * 2;
          const dist = 2 + (j % 2);
          const spot = nearestFree(z,
            site.tx + Math.round(Math.cos(angle) * dist),
            site.ty + Math.round(Math.sin(angle) * dist), 4);
          if (!spot) continue;
          const extra = Object.assign({}, source, {
            key: site.prefix + ':x' + cycle + ':' + j,
            x: spot.tx * T + 8, y: spot.ty * T + 8,
            spawnIndex: spawns.length + j
          });
          z.siteSpawns.push(extra);
          site.keys.push(extra.key);
        }
      }
    });
  }

  /* ================================================================
     COSTRUZIONE DELLA ZONA
     ================================================================ */
  function generate(zoneId) {
    const def = D.zones[zoneId];
    if (!def) return null;
    const z = {
      id: zoneId, def: def, w: def.w, h: def.h,
      pxW: def.w * T, pxH: def.h * T,
      tiles: new Uint8Array(def.w * def.h),
      variant: new Uint8Array(def.w * def.h),
      solid: new Uint8Array(def.w * def.h),
      elev: new Uint8Array(def.w * def.h),
      props: [], chests: [], nodes: [], npcs: [], exits: [], interactables: [],
      sites: [], siteSpawns: [], ambushes: [], shrines: [],
      spawnDefs: def.spawns || [], namedDefs: def.named || []
    };
    const rng = new CV.Rng(def.seed);

    /* Quota di appoggio a bassa frequenza: i biomi a cielo aperto la
       sovrascrivono col loro stesso rumore (riusato, non ricalcolato).
       Miniera e Rocca scavano invece di generare rumore, ma restano
       comunque con una quota plausibile per il rilievo del renderer. */
    for (let y = 0; y < z.h; y++)
      for (let x = 0; x < z.w; x++)
        z.elev[idx(z, x, y)] = CV.noise.fbm(x / 14, y / 14, def.seed + 4200, 3) * 255;

    switch (def.biome) {
      case 'village': genVillage(z, rng); break;
      case 'moor': genMoor(z, rng); break;
      case 'forest': genForest(z, rng); break;
      case 'cave': genCave(z, rng); break;
      case 'keep': genKeep(z, rng); break;
      default: genMoor(z, rng);
    }

    /* Siti: dopo il bioma, prima dell'arredo. Un accampamento deve poter
       spianare la sua radura senza che l'erba ci sia già cresciuta sopra. */
    placeSites(z, rng);

    /* Arredo: dopo il terreno, prima dei punti d'interesse, così l'erba
       non spunta in mezzo a un forziere o davanti a un mercante. */
    scatterDecor(z, rng, busyMap(z));

    const floorKey = def.biome === 'cave' ? 'cave_floor' : (def.biome === 'keep' ? 'keep_floor' : 'path');

    /* Uscite */
    (def.exits || []).forEach((e, i) => {
      clearAround(z, e.tx, e.ty, 2, floorKey);
      const locked = !!e.requires;
      z.exits.push({
        i: i, to: e.to, label: e.label, requires: e.requires, lockedText: e.lockedText,
        x: e.tx * T + 8, y: e.ty * T + 8, r: 20, from: e.from,
        img: A.sprite(locked ? 'gate' : 'portal')
      });
    });

    /* Oggetti fissi dello scenario */
    (def.props || []).forEach(p => {
      clearAround(z, p.tx, p.ty, 1, floorKey);
      const img = A.sprite(p.kind === 'forge' ? 'forge' : p.kind === 'cauldron' ? 'cauldron' : p.kind === 'sign' ? 'sign' : p.kind === 'noticeboard' ? 'noticeboard' : 'campfire');
      const o = { kind: p.kind, img: img, x: p.tx * T + 8, y: p.ty * T + 16, ox: 8, oy: 16, text: p.text,
        col: (p.kind === 'sign' || p.kind === 'noticeboard') ? null : { x: p.tx * T + 3, y: p.ty * T + 6, w: 11, h: 9 } };
      z.props.push(o);
      if (p.kind === 'forge' || p.kind === 'cauldron' || p.kind === 'campfire' || p.kind === 'sign' || p.kind === 'noticeboard') {
        z.interactables.push({ kind: p.kind, x: o.x, y: o.y - 8, r: 26, text: p.text,
          label: p.kind === 'forge' ? 'Fucina' : p.kind === 'cauldron' ? 'Calderone' : p.kind === 'campfire' ? 'Riposa' : p.kind === 'noticeboard' ? 'Bacheca' : 'Leggi' });
      }
    });

    /* Forzieri */
    (def.chests || []).forEach((c, i) => {
      clearAround(z, c.tx, c.ty, 1, floorKey);
      const o = { key: 'chest' + i, table: c.table, x: c.tx * T + 8, y: c.ty * T + 14, open: false };
      z.chests.push(o);
      z.interactables.push({ kind: 'chest', ref: o, x: o.x, y: o.y - 6, r: 26, label: 'Apri' });
    });

    /* Nodi di raccolta */
    (def.nodes || []).forEach((n, i) => {
      clearAround(z, n.tx, n.ty, 1, floorKey);
      const o = { key: 'node' + i, type: n.type, x: n.tx * T + 8, y: n.ty * T + 14, spent: 0 };
      z.nodes.push(o);
      z.interactables.push({ kind: 'node', ref: o, x: o.x, y: o.y - 6, r: 24, label: 'Raccogli' });
    });

    /* Personaggi non giocanti */
    for (const id in D.npcs) {
      const n = D.npcs[id];
      if (n.zone !== zoneId) continue;
      clearAround(z, n.tx, n.ty, 1, floorKey);
      const o = { id: id, def: n, x: n.tx * T + 8, y: n.ty * T + 8, face: 0, t: 0 };
      z.npcs.push(o);
      z.interactables.push({ kind: 'npc', ref: o, x: o.x, y: o.y, r: 28, label: n.name });
    }

    /* Ordinamento dei prop per profondità: chi sta più in basso copre chi sta sopra */
    z.props.sort((a, b) => a.y - b.y);
    return z;
  }

  /* ================================================================
     COLLISIONI
     ================================================================ */
  function solidAt(z, px, py) {
    const tx = Math.floor(px / T), ty = Math.floor(py / T);
    if (!inside(z, tx, ty)) return true;
    if (z.solid[idx(z, tx, ty)]) return true;
    return false;
  }

  /* Collisione a cerchio contro griglia + box dei prop. */
  function blocked(z, px, py, r) {

      case 'telegraph': {

        if (e.stateT >= def.recovery) { e.state = 'chase'; e.stateT = 0; }
        break;
      }

        e.state = 'chase';
    }

        G.projectiles.splice(i, 1);
        continue;
      }
      pr.x = nx; pr.y = ny;

      if (pr.fromPlayer) {
        for (const e of G.enemies) {
          if (e.dead) continue;
          if (M.dist(pr.x, pr.y, e.x, e.y) < e.radius + pr.radius) {
            const p = G.p;
            let dmg = pr.dmg;

            G.projectiles.splice(i, 1);

        if (M.dist(pr.x, pr.y, pe.x, pe.y) < pe.radius + pr.radius + 1) {
          E.hurtPlayer(G, pr.dmg, pr.x - pr.vx * 0.05, pr.y - pr.vy * 0.05, { knock: 70 });

      q.vy += q.gravity * dt;

      d.vy = Math.min(0, d.vy + 120 * dt);

        ctx.beginPath();
        ctx.moveTo(-s * 0.32, -s * 0.9); ctx.lineTo(-s * 0.32, -s * 0.3);
        ctx.lineTo(-s * 0.7, s * 0.55);
        ctx.quadraticCurveTo(-s * 0.7, s * 0.95, -s * 0.2, s * 0.95);
        ctx.lineTo(s * 0.2, s * 0.95);
        ctx.quadraticCurveTo(s * 0.7, s * 0.95, s * 0.7, s * 0.55);
        ctx.lineTo(s * 0.32, -s * 0.3);
        ctx.lineTo(s * 0.32, -s * 0.9);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-s * 0.45, -s * 0.9); ctx.lineTo(s * 0.45, -s * 0.9);
        ctx.stroke();
        break;
    }
    ctx.restore();
  }

  /* Pulsante circolare: fondo, bordo, icona, eventuale ricarica. */
  function button(ctx, b, opts) {
    opts = opts || {};
    const pressed = opts.pressed;
    const dim = opts.disabled;
    ctx.save();
    ctx.globalAlpha = dim ? 0.32 : (pressed ? 0.95 : 0.78);

    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = pressed ? 'rgba(90,70,60,0.85)' : 'rgba(18,14,24,0.62)';
    ctx.fill();

    ctx.lineWidth = 2;
    ctx.strokeStyle = opts.accent || 'rgba(150,140,165,0.75)';
    ctx.stroke();

    /* Anello di ricarica */
    if (opts.cooldown != null && opts.cooldown > 0) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r - 3, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - opts.cooldown));
      ctx.strokeStyle = 'rgba(240,108,58,0.9)';
      ctx.lineWidth = 3;
      ctx.stroke();
    }
    icon(ctx, b.icon, b.x, b.y, b.r, opts.iconColor || (dim ? '#6b6577' : '#e6e1ef'));
    ctx.restore();

    if (opts.label) {
      text(ctx, opts.label, b.x, b.y + b.r + 11, { size: 9, align: 'center', color: 'rgba(215,210,224,0.6)' });
    }
    if (opts.badge) {
      ctx.save();
      ctx.beginPath(); ctx.arc(b.x + b.r * 0.72, b.y - b.r * 0.72, 9, 0, Math.PI * 2);
      ctx.fillStyle = '#a5451f'; ctx.fill();
      ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.restore();
      text(ctx, String(opts.badge), b.x + b.r * 0.72, b.y - b.r * 0.72 + 0.5, { size: 10, align: 'center', color: '#ffd166', outline: false });
    }
  }

  /* ================================================================
     DISEGNO COMPLETO DELL'INTERFACCIA
     ================================================================ */
  function draw(ctx, G, dt) {
    const p = G.p, pe = G.pe;
    const L = CV.Input.layout;
    const ins = L.insets;
    const W = L.w, Hh = L.h;

    /* ---------- Barre vitali ---------- */
    const bx = ins.left + 12, by = ins.top + 14;
    const bw = Math.min(150, W * 0.42);
    bar(ctx, bx, by, bw, 9, p.hp / p.stats.maxHp, '#c33636', 'rgba(40,16,16,0.85)');
    bar(ctx, bx, by + 13, bw, 6, p.sp / p.stats.maxSp, '#7cc46a', 'rgba(20,36,18,0.85)');
    bar(ctx, bx, by + 22, bw, 6, p.mp / p.stats.maxMp, '#6fb3ff', 'rgba(16,26,44,0.85)');

    text(ctx, Math.ceil(p.hp) + '/' + p.stats.maxHp, bx + bw - 4, by + 4.5,
      { size: 9, align: 'right', color: 'rgba(255,255,255,0.7)', mono: true, outlineW: 2 });

    /* Livello */
    ctx.save();
    ctx.beginPath(); ctx.arc(bx - 2, by + 4, 0, 0, 0); ctx.restore();
    text(ctx, 'Liv ' + p.level, bx, by + 38, { size: 11, color: '#ffd166' });
    const xpFrac = p.xp / P.xpForLevel(p.level);
    bar(ctx, bx + 42, by + 35, 56, 4, xpFrac, '#c9a6ff', 'rgba(30,24,42,0.85)');

    /* Sovraccarico */
    if (p.stats.encumbered) {
      text(ctx, 'SOVRACCARICO', bx, by + 52, { size: 10, color: '#f06c3a' });
    }

    /* ---------- Effetti attivi ---------- */
    if (p.effects.length) {
      let ex = bx, ey = by + (p.stats.encumbered ? 66 : 52);
      for (const e of p.effects) {
        const def = D.effects[e.key];
        if (!def) continue;
        ctx.save();
        ctx.beginPath(); ctx.arc(ex + 8, ey, 8, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(10,8,16,0.8)'; ctx.fill();
        ctx.strokeStyle = def.color; ctx.lineWidth = 2; ctx.stroke();
        ctx.restore();
        text(ctx, def.name[0], ex + 8, ey, { size: 10, align: 'center', color: def.color });
        text(ctx, Math.ceil(e.t) + 's', ex + 8, ey + 15, { size: 8, align: 'center', color: 'rgba(215,210,224,0.55)' });
        ex += 24;
      }
    }

    /* ---------- Obiettivo di missione e di sito ----------
       Il sito (se attivo) si impila sopra la missione invece di
       sostituirla: sono due domande diverse ("cosa sto facendo qui
       adesso" e "cosa sto facendo in generale") e in un accampamento
       durante una missione servono entrambe. */
    const activeQ = currentObjective(p);
    if (activeQ || H.site) {
      const qy = Hh - ins.bottom - 18;
      if (H.site) {
        const sy = activeQ ? qy - 30 : qy;
        text(ctx, '» ' + H.site.name, ins.left + 12, sy - 15, { size: 11, color: '#f06c3a' });
        text(ctx, 'Sgombera i nemici  ' + H.site.done + ' / ' + H.site.total, ins.left + 12, sy,
          { size: 10, color: 'rgba(215,210,224,0.75)' });
      }
      if (activeQ) {
        text(ctx, '❖ ' + activeQ.name, ins.left + 12, qy - 15, { size: 11, color: '#ffd166' });
        const prog = CV.Quests.progressText(p, activeQ.id);
        text(ctx, activeQ.text + (prog ? '  ' + prog : ''), ins.left + 12, qy,
          { size: 10, color: 'rgba(215,210,224,0.75)' });
      }
    }

    /* ---------- Barra del boss ---------- */
    if (H.bossRef && !H.bossRef.dead) {
      const e = H.bossRef;
      const w = Math.min(280, W * 0.7), x = (W - w) / 2, y = ins.top + 16;
      text(ctx, e.name, W / 2, y - 8, { size: 12, align: 'center', color: '#ffd166' });
      bar(ctx, x, y, w, 8, e.hp / e.maxHp, '#c33636', 'rgba(40,16,16,0.9)');
    } else if (H.bossRef) {
      H.bossT -= dt;
      if (H.bossT <= 0) H.bossRef = null;
    }

    /* ---------- Nome della zona all'ingresso ---------- */
    if (H.zoneBanner > 0) {
      H.zoneBanner -= dt;
      const a = M.clamp(H.zoneBanner > 2.6 ? (3.2 - H.zoneBanner) / 0.6 : Math.min(1, H.zoneBanner / 0.8), 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      /* Due filetti sfumati sopra e sotto il titolo: trasformano un testo
         che galleggia in un momento, la prima impressione della zona. */
      const ly = Hh * 0.26 - 16, lw = Math.min(220, W * 0.5);
      for (const y of [ly, ly + 46]) {
        const g = ctx.createLinearGradient(W / 2 - lw / 2, 0, W / 2 + lw / 2, 0);
        g.addColorStop(0, 'rgba(255,209,102,0)');
        g.addColorStop(0.5, 'rgba(255,209,102,0.55)');
        g.addColorStop(1, 'rgba(255,209,102,0)');
        ctx.fillStyle = g;
        ctx.fillRect(W / 2 - lw / 2, y, lw, 1);
      }
      text(ctx, H.zoneName, W / 2, Hh * 0.26, { size: 22, align: 'center', color: '#ffd166' });
      if (H.zoneSub) text(ctx, H.zoneSub.toUpperCase(), W / 2, Hh * 0.26 + 22, { size: 10, align: 'center', color: 'rgba(215,210,224,0.7)' });
      ctx.restore();
    }

    /* ---------- Suggerimento ---------- */
    if (H.tipT > 0) {
      H.tipT -= dt;
      const a = Math.min(1, H.tipT / 0.6);
      ctx.save(); ctx.globalAlpha = a;
      text(ctx, H.tipText, W / 2, Hh * 0.16, { size: 11, align: 'center', color: 'rgba(215,210,224,0.85)' });
      ctx.restore();
    }

    /* ---------- Comandi a schermo ---------- */
    const scheme = CV.Input.effectiveScheme();
    const touch = scheme === 'touch_stick' || scheme === 'touch_tap';

    /* Menu e pozione sono utili anche col mouse */
    button(ctx, L.menu, { pressed: CV.Input.down('menu') });
    const potions = countPotions(p);
    button(ctx, L.potion, { pressed: CV.Input.down('potion'), disabled: potions === 0, badge: potions || null });

    if (touch) {
      /* Joystick virtuale */
      if (scheme === 'touch_stick') drawStick(ctx, L);
      else drawTapMarker(ctx, G);

      const w = P.equipped(p, 'weapon');
      const staCost = w ? w.stamCost : 8;
      button(ctx, L.attack, {
        pressed: CV.Input.down('attack'),
        disabled: p.sp < staCost * 0.5,
        cooldown: pe.state === 'attack' || pe.state === 'recover' ? 1 - M.clamp(pe.stateT / 0.32, 0, 1) : 0,
        accent: 'rgba(240,108,58,0.8)'
      });
      button(ctx, L.dodge, { pressed: CV.Input.down('dodge'), disabled: p.sp < dodgeCost(p) });
      button(ctx, L.block, { pressed: pe.blocking, accent: pe.blocking && pe.blockT < 0.25 ? '#ffd166' : null });
      button(ctx, L.cast, { pressed: CV.Input.down('cast'), disabled: p.mp < castCost(p), accent: 'rgba(111,179,255,0.8)' });

      if (CV.Input.hasInteract()) {
        button(ctx, L.interact, { pressed: CV.Input.down('interact'), accent: '#ffd166', label: G.interactLabel || 'Usa' });
      }
    } else {
      /* Promemoria dei tasti su PC */
      drawKeyHints(ctx, L, G, dt);
    }

    /* Etichetta di ciò che si può usare, sopra al personaggio */
    if (G.interactTarget && !touch) {
      const s = CV.Render.worldToScreen(G.interactTarget.x, G.interactTarget.y - 22);
      text(ctx, '[E] ' + (G.interactLabel || 'Usa'), s.x, s.y, { size: 11, align: 'center', color: '#ffd166' });
    } else if (G.interactTarget && touch) {
      const s = CV.Render.worldToScreen(G.interactTarget.x, G.interactTarget.y - 22);
      text(ctx, G.interactLabel || 'Usa', s.x, s.y, { size: 11, align: 'center', color: '#ffd166' });
    }

    /* Schermata di morte */
    if (pe.dead) {
      ctx.fillStyle = 'rgba(20,4,4,' + M.clamp(pe.stateT * 0.6, 0, 0.72) + ')';
      ctx.fillRect(0, 0, W, Hh);
      if (pe.stateT > 0.7) {
        text(ctx, 'SEI CADUTO', W / 2, Hh * 0.42, { size: 26, align: 'center', color: '#c33636' });
        text(ctx, 'La cenere ti copre. Ma non oggi.', W / 2, Hh * 0.42 + 26, { size: 12, align: 'center', color: 'rgba(215,210,224,0.7)' });
      }
    }
  }

  function drawStick(ctx, L) {
    const st = CV.Input.stick;
    const z = L.stickZone;
    if (!st) {
      /* Suggerimento discreto quando il pollice non tocca */
      ctx.save();
      ctx.globalAlpha = 0.16;
      ctx.strokeStyle = '#d7d2e0'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(z.x0 + 78, z.y1 - 108, 40, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(z.x0 + 78, z.y1 - 108, 17, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
      return;
    }
    const dx = st.x - st.ox, dy = st.y - st.oy;
    const len = Math.hypot(dx, dy), maxR = 46;
    const f = len > maxR ? maxR / len : 1;
    const kx = st.ox + dx * f, ky = st.oy + dy * f;

    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.arc(st.ox, st.oy, maxR, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(18,14,24,0.5)'; ctx.fill();
    ctx.strokeStyle = 'rgba(180,172,196,0.7)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.globalAlpha = 0.85;
    ctx.beginPath(); ctx.arc(kx, ky, 20, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(200,190,215,0.55)'; ctx.fill();
    ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }

  function drawTapMarker(ctx, G) {
    const t = CV.Input.moveTarget;
    if (!t) return;
    const time = CV.Render.state.time;
    ctx.save();
    ctx.globalAlpha = 0.55 + Math.sin(time * 8) * 0.15;
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 2;
    const r = 12 + Math.sin(time * 8) * 2;
    ctx.beginPath(); ctx.arc(t.x, t.y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(t.x - 5, t.y); ctx.lineTo(t.x + 5, t.y);
    ctx.moveTo(t.x, t.y - 5); ctx.lineTo(t.x, t.y + 5);
    ctx.stroke();
    ctx.restore();
  }

  function drawKeyHints(ctx, L, G, dt) {
    const x = L.w - L.insets.right - 14, y0 = L.h - L.insets.bottom - 12;
    const rows = [
      ['WASD', 'muovi'],
      ['Click sin. / J', 'attacca'],
      ['Click des. / K', 'para'],
      ['Spazio', 'schiva'],
      ['Q', 'incantesimo'],
      ['E', 'interagisci'],
      ['I  L  P  M', 'zaino, diario, abilità, mappa']
    ];
    /* Dopo i primi secondi chi gioca su PC li ha già letti: si abbassa
       l'opacità invece di lasciarli fissi alla stessa intensità per
       tutta la partita, che li rende la cosa più visibile sullo schermo. */
    H.keyHintsT += dt || 0;
    const settle = M.clamp((H.keyHintsT - 5) / 2.5, 0, 1);
    const a = 0.42 - settle * 0.22;

    const w = 168, h = rows.length * 15 + 8;
    const px = x - 138, py = y0 - (rows.length - 1) * 15 - 11;
    ctx.save();
    ctx.globalAlpha = a;
    /* Pannello scuro sfumato: senza, il testo galleggia nudo sopra il
       mondo di gioco ed è leggibile solo grazie al contorno. */
    const g = ctx.createLinearGradient(0, py, 0, py + h);
    g.addColorStop(0, 'rgba(10,8,14,0.05)');
    g.addColorStop(0.3, 'rgba(10,8,14,0.55)');
    g.addColorStop(1, 'rgba(10,8,14,0.55)');
    ctx.fillStyle = g;
    roundRect(ctx, px, py, w, h, 6);
    ctx.fill();
    rows.forEach((r, i) => {
      const y = y0 - (rows.length - 1 - i) * 15;
      text(ctx, r[0], x - 132, y, { size: 10, color: '#ffd166', align: 'right', outlineW: 2 });
      text(ctx, r[1], x - 126, y, { size: 10, color: '#d7d2e0', align: 'left', outlineW: 2 });
    });
    ctx.restore();
  }

  /* ---------------- Supporto ---------------- */
  function currentObjective(p) {
    let best = null;
    for (const id in p.quests) {
      const q = p.quests[id], def = D.quests[id];
      if (!q || q.done || !def) continue;
      const st = def.stages[q.stage];
      if (!st) continue;
      const cand = { id: id, name: def.name, text: st.text, main: !!def.main };
      if (!best || (cand.main && !best.main)) best = cand;
    }
    return best;
  }

  function countPotions(p) {
    let n = 0;
    for (const it of p.inv) if (it.potion && !it.potion.harmful) n += it.qty;
    return n;
  }

  function dodgeCost(p) { return p.perks.nimble ? 14 : 22; }
  function castCost(p) { return Math.round((18 - p.skills.destruction.lvl * 0.06) * (p.perks.focus ? 0.7 : 1)); }

  CV.Hud = { draw, showZone, showTip, setBoss, setSite, countPotions, dodgeCost, castCost, currentObjective, text, roundRect };
})(typeof window !== 'undefined' ? window : globalThis);


/* ===== src/ui/ui.js ===== */
/* ============================================================
   MENU E SCHERMATE (DOM sopra il canvas).
   Il DOM è la scelta giusta per liste lunghe e testo scorrevole:
   su mobile eredita gratis lo scroll fluido e i tocchi precisi.
   ============================================================ */
(function (root) {
  'use strict';
  const CV = root.CV || (root.CV = {});
  const D = CV.Data;
  const P = CV.Player;
  const M = CV.M;

  let G = null;
  let el = null, toastsEl = null;
  let current = null;         /* pannello aperto */
  let ctxData = {};           /* dati del pannello corrente */
  let invTab = 'all', invSel = null;
  let smithTab = 'forge';
  let alchPick = [];
  let shopTab = 'buy';
  let dlgNpc = null, dlgNode = null;
  let debugTab = 'respawn';

  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* ---------------- Icone come immagini ---------------- */
  const iconCache = new Map();
  function iconUrl(res) {
    const key = res ? (res.icon || res.id) + '|' + (res.potion ? res.potion.color : '') : 'none';
    if (iconCache.has(key)) return iconCache.get(key);
    const src = CV.Art.iconFor(res);
    let url = '';
    if (src) {
      const c = CV.Art.makeCanvas(16, 16);
      c.getContext('2d').drawImage(src, 0, 0);
      url = c.toDataURL();
    }
    iconCache.set(key, url);
    return url;
  }

  function init(game) {
    G = game;
    el = document.getElementById('overlay');
    toastsEl = document.getElementById('toasts');
    el.addEventListener('click', onClick);
  }

  function isOpen() { return !!current; }
  function currentPanel() { return current; }

  function open(panel, data) {
    current = panel;
    ctxData = data || {};
    el.className = 'open' + (panel === 'dialogue' ? ' dialogue-mode' : '') + (panel === 'title' ? ' title-mode' : '');
    CV.Input.setEnabled(false);
    render();
  }

  function close() {
    current = null;
    ctxData = {};
    el.className = '';
    el.innerHTML = '';
    CV.Input.setEnabled(true);
    CV.Input.clearAll();
  }

  function toast(msg, cls) {
    const d = document.createElement('div');
    d.className = 'toast' + (cls ? ' ' + cls : '');
    d.textContent = msg;
    toastsEl.appendChild(d);
    setTimeout(() => d.remove(), 2600);
  }

  /* ================================================================
     ROUTER DI RENDER
     ================================================================ */
  function render() {
    if (!current) return;
    switch (current) {
      case 'title': el.innerHTML = viewTitle(); break;
      case 'titleSettings': el.innerHTML = viewTitleSettings(); break;
      case 'menu': el.innerHTML = viewMenu(); break;
      case 'dialogue': el.innerHTML = viewDialogue(); break;
      case 'shop': el.innerHTML = viewShop(); break;
      case 'contracts': el.innerHTML = viewContracts(); break;
      case 'smith': el.innerHTML = viewSmith(); break;
      case 'alchemy': el.innerHTML = viewAlchemy(); break;
      case 'death': el.innerHTML = viewDeath(); break;
      case 'victory': el.innerHTML = viewVictory(); break;
    }
  }

  /* ================================================================
     SCHERMATA DEL TITOLO
     ================================================================ */
  function viewTitle() {
    const saves = G.listSaveSlots();
    const occupied = saves.gameplay.filter(s => !s.empty && !s.corrupt && !s.incompatible);
    const latest = occupied.slice().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0];
    const gameplay = saves.gameplay.map(viewSaveSlot).join('');
    const snapshots = saves.snapshots.length
      ? `<div class="save-section-title">Snapshot debug</div>${saves.snapshots.map(viewSaveSlot).join('')}`
      : '';
    return `<div class="title-screen save-title-screen">
      <h1>CINDER VALE</h1>
      <div class="tagline">Sette anni di cenere</div>
      <div class="save-browser">
        ${latest ? `<button class="primary continue-latest" data-act="continue" data-slot="${latest.id}">Continua · ${esc(latest.playerName)}</button>` : ''}
        <div class="save-section-title">Partite</div>
        ${gameplay}
        ${snapshots}
      </div>
      <div class="menu title-actions">
        <button data-act="settings">Impostazioni</button>
      </div>
      <div class="ver">v1.0 — tocca lo schermo o usa WASD</div>
    </div>`;
  }

  function viewSaveSlot(slot) {
    const title = slot.kind === 'debug' ? (slot.label || 'Snapshot debug') : 'Slot ' + slot.index;
    if (slot.empty) return `<div class="save-slot empty-slot">
      <div class="save-slot-copy"><b>${title}</b><small>Slot vuoto</small></div>
      <button data-act="newgame" data-slot="${slot.id}">Nuova partita</button>
    </div>`;
    if (slot.corrupt || slot.incompatible) return `<div class="save-slot invalid-slot">
      <div class="save-slot-copy"><b>${title}</b><small>${slot.corrupt ? 'Dati non leggibili' : 'Versione non compatibile'}</small></div>
      <button data-act="deleteslot" data-slot="${slot.id}">Elimina</button>
    </div>`;
    const mins = Math.floor(slot.playtime / 60);
    const when = slot.updatedAt ? new Date(slot.updatedAt).toLocaleString('it-IT', { dateStyle: 'short', timeStyle: 'short' }) : '';
    return `<div class="save-slot ${slot.kind === 'debug' ? 'debug-slot' : ''}">
      <div class="save-slot-copy">
        <b>${esc(title)}</b>
        <span>${esc(slot.playerName)} · Liv ${slot.level} · ${esc(slot.zone)}</span>
        <small>${mins} min${when ? ' · ' + esc(when) : ''}</small>
      </div>
      <button class="${slot.kind === 'gameplay' ? 'primary' : ''}" data-act="continue" data-slot="${slot.id}">${slot.kind === 'debug' ? 'Ripristina' : 'Carica'}</button>
      <button class="ghost delete-slot" data-act="deleteslot" data-slot="${slot.id}">Elimina</button>
    </div>`;
  }

  function viewTitleSettings() {
    return `<div class="panel">
      <div class="panel-head"><h2>Impostazioni</h2><button class="close-x" data-act="backtitle">✕</button></div>
      <div class="panel-body">${viewSettings()}</div>
    </div>`;
  }

  /* ================================================================
     MENU PRINCIPALE (a schede)
     ================================================================ */
  function viewMenu() {
    const tab = ctxData.tab || 'inv';
    const tabs = [
      ['inv', 'Zaino'], ['skills', 'Abilità'], ['quests', 'Diario'],
      ['map', 'Mappa'], ['settings', 'Opzioni']
    ];
    let body = '';
    if (tab === 'inv') body = viewInventory();
    else if (tab === 'skills') body = viewSkills();
    else if (tab === 'quests') body = viewQuests();
    else if (tab === 'map') body = viewMap();
    else body = viewSettings();

    return `<div class="panel">
      <div class="panel-head">
        <h2>${esc(G.p.name)} — Liv ${G.p.level}</h2>
        <span style="font-size:12px;color:var(--gold);font-family:var(--mono)">${G.p.gold} ⬤</span>
        <button class="close-x" data-act="close">✕</button>
      </div>
      <div class="tabs">
        ${tabs.map(t => `<div class="tab${t[0] === tab ? ' active' : ''}" data-act="tab" data-tab="${t[0]}">${t[1]}</div>`).join('')}
      </div>
      <div class="panel-body">${body}</div>
    </div>`;
  }

  /* ---------------- Zaino ---------------- */
  function viewInventory() {
    const p = G.p;
    const filters = [['all', 'Tutto'], ['weapon', 'Armi'], ['armor', 'Difesa'], ['potion', 'Consumo'], ['material', 'Materiali']];
    const rows = [];

    const entries = p.inv.map(it => ({ it: it, res: P.resolve(it) })).filter(x => x.res);
    entries.sort((a, b) => {
      const ea = P.isEquipped(p, a.it.uid) ? 0 : 1, eb = P.isEquipped(p, b.it.uid) ? 0 : 1;
      if (ea !== eb) return ea - eb;
      return a.res.name.localeCompare(b.res.name);
    });

    for (const { it, res } of entries) {
      if (!matchFilter(res, invTab)) continue;
      const eq = P.isEquipped(p, it.uid);
      rows.push(`<div class="row rar-${res.rar}${invSel === it.uid ? ' sel' : ''}${eq ? ' equipped' : ''}" data-act="pick" data-uid="${it.uid}">
        <img class="ic" src="${iconUrl(res)}" alt="">
        <div class="txt">
          <div class="nm rar-${res.rar}">${esc(res.name)}</div>
          <div class="sub">${esc(subLine(res))}</div>
        </div>
        <div class="qty">${it.qty > 1 ? '×' + it.qty : ''}</div>
      </div>`);
    }

    const sel = invSel ? P.findUid(p, invSel) : null;
    const detail = sel ? viewItemDetail(sel) : '';
    const st = p.stats;

    return `
      <div class="tabs inv-filter-bar">
        ${filters.map(f => `<div class="tab${invTab === f[0] ? ' active' : ''}" data-act="filter" data-f="${f[0]}">${f[1]}</div>`).join('')}
      </div>
      <div class="stat-line"><span>Carico</span><span class="v ${st.encumbered ? 'neg' : ''}">${st.weight} / ${st.carry}</span></div>
      <div class="stat-line"><span>Danno · Armatura</span><span class="v">${dmgLabel()} · ${st.armor.toFixed(1)}</span></div>
      ${detail}
      <div class="sect">Oggetti</div>
      <div class="list">${rows.join('') || '<div class="empty">Niente qui dentro.</div>'}</div>`;
  }

  function dmgLabel() {
    const w = P.equipped(G.p, 'weapon');
    if (!w) return (4 * G.p.stats.damage).toFixed(1);
    return (w.dmg * G.p.stats.damage).toFixed(1);
  }

  function matchFilter(res, f) {
    if (f === 'all') return true;
    if (f === 'weapon') return res.type === 'weapon';
    if (f === 'armor') return res.type === 'armor' || res.type === 'trinket';
    if (f === 'potion') return res.type === 'potion' || res.type === 'ingredient';
    if (f === 'material') return res.type === 'material' || res.type === 'misc';
    return true;
  }

  function subLine(res) {
    if (res.type === 'weapon') return 'Danno ' + res.dmg + ' · Vel ' + res.spd.toFixed(2) + ' · ' + res.weight.toFixed(1) + 'kg';
    if (res.type === 'armor') return 'Armatura ' + res.armor + ' · Res ' + Math.round(res.res * 100) + '% · ' + res.weight.toFixed(1) + 'kg';
    if (res.type === 'trinket') return Object.keys(res.bonus || {}).map(k => bonusLabel(k, res.bonus[k])).join(' · ');
    if (res.type === 'potion') return res.potion.desc;
    if (res.type === 'ingredient') return knownEffects(res.id);
    return (D.rarity[res.rar] ? '' : '') + res.value + ' ⬤ · ' + res.weight.toFixed(1) + 'kg';
  }

  function knownEffects(id) {
    const ing = D.ingredients[id];
    if (!ing) return '';
    return ing.fx.map((k, i) => P.knowsEffect(G.p, id, i) ? D.effects[k].name : '???').join(', ');
  }

  const BONUS_NAMES = { maxHp: 'Vita', maxMp: 'Etere', maxSp: 'Vigore', armor: 'Armatura', damage: 'Danno', moveSpeed: 'Velocità', mpRegen: 'Rig. etere', spRegen: 'Rig. vigore', res: 'Resistenza' };
  function bonusFmt(k, v) {
    const pct = (k === 'damage' || k === 'moveSpeed' || k === 'res');
    return pct ? Math.round(v * 100) + '%' : v;
  }
  function bonusLabel(k, v) {
    return (BONUS_NAMES[k] || k) + ' +' + bonusFmt(k, v);
  }

  function viewItemDetail(it) {
    const res = P.resolve(it);
    if (!res) return '';
    const p = G.p;
    const eq = P.isEquipped(p, it.uid);
    const cur = (res.slot && !eq) ? P.equipped(p, res.slot) : null;
    const acts = [];
    if (res.slot) acts.push(eq ? `<button data-act="unequip" data-slot="${res.slot}">Togli</button>` : `<button class="primary" data-act="equip" data-uid="${it.uid}">Equipaggia</button>`);
    if (res.type === 'potion') acts.push(`<button class="primary" data-act="drink" data-uid="${it.uid}">Bevi</button>`);
    if (res.type === 'ingredient') acts.push(`<button data-act="eat" data-uid="${it.uid}">Assaggia</button>`);
    if (!res.quest) acts.push(`<button data-act="drop" data-uid="${it.uid}">Getta</button>`);

    let stats = '';
    if (res.type === 'weapon') {
      stats += lineCmp('Danno', res.dmg, cur ? cur.dmg : null);
      if (res.fire || (cur && cur.fire)) stats += lineCmp('Danno da fuoco', res.fire || 0, cur ? (cur.fire || 0) : null);
      stats += lineCmp('Velocità', res.spd, cur ? cur.spd : null, v => v.toFixed(2) + '×');
      stats += lineCmp('Portata', res.reach, cur ? cur.reach : null);
      stats += lineCmp('Vigore per colpo', res.stamCost, cur ? cur.stamCost : null, null, true);
    } else if (res.type === 'armor') {
      stats += lineCmp('Armatura', res.armor, cur ? cur.armor : null);
      stats += lineCmp('Resistenza', res.res, cur ? cur.res : null, v => Math.round(v * 100) + '%');
    } else if (res.type === 'trinket') {
      const curBonus = (cur && cur.bonus) || {};
      const keys = new Set([...Object.keys(res.bonus || {}), ...Object.keys(curBonus)]);
      for (const k of keys) {
        stats += lineCmp(BONUS_NAMES[k] || k, (res.bonus && res.bonus[k]) || 0, cur ? (curBonus[k] || 0) : null, v => bonusFmt(k, v));
      }
    } else if (res.type === 'potion') {
      for (const f of res.potion.fx) {
        const d = D.effects[f.key];
        stats += line(d.name, D.fmtMag(f.key, f.mag) + (f.dur ? ' / ' + f.dur + 's' : ''));
      }
    } else if (res.type === 'ingredient') {
      const ing = D.ingredients[res.id];
      ing.fx.forEach((k, i) => {
        stats += line(P.knowsEffect(p, res.id, i) ? D.effects[k].name : '??? sconosciuto', '');
      });
    }
    if (res.up > 0) stats += line('Tempra', '+' + res.up);
    stats += lineCmp('Peso', res.weight, cur ? cur.weight : null, v => v.toFixed(1) + ' kg', true);
    stats += line('Valore', res.value + ' ⬤');

    return `<div class="detail">
      <h3 class="nm rar-${res.rar}">${esc(res.name)}</h3>
      ${res.flavor ? `<div class="flavor">« ${esc(res.flavor)} »</div>` : ''}
      ${cur ? `<div class="hint">Confronto con l'equipaggiato: <b>${esc(cur.name)}</b></div>` : ''}
      ${stats}
      <div class="btn-row" style="margin-top:10px">${acts.join('')}</div>
    </div>`;
  }

  function line(k, v) {
    return `<div class="stat-line"><span>${esc(k)}</span><span class="v">${esc(v)}</span></div>`;
  }

  /* Confronta un valore con quello dell'oggetto equipaggiato, se c'è.
     lowerBetter: true per statistiche dove un numero più basso è un vantaggio (peso, costo). */
  function lineCmp(label, val, curVal, fmt, lowerBetter) {
    fmt = fmt || (v => v);
    const valTxt = fmt(val);
    if (curVal == null || curVal === val) return line(label, valTxt);
    const diff = val - curVal;
    const better = lowerBetter ? diff < 0 : diff > 0;
    const sign = diff > 0 ? '+' : '';
    const deltaTxt = sign + fmt(diff);
    return `<div class="stat-line"><span>${esc(label)}</span><span class="v">${esc(valTxt)} <span class="delta ${better ? 'pos' : 'neg'}">(${esc(deltaTxt)})</span></span></div>`;
  }

  /* ---------------- Abilità e talenti ---------------- */
  function viewSkills() {
    const p = G.p;
    let out = `<div class="hint">Le abilità salgono <b>usandole</b>: colpisci di lama per far salire Lama, para per far salire Blocco. Ogni livello del personaggio dà un punto talento.</div>`;
    out += `<div class="sect">Punti talento disponibili: <span style="color:var(--gold)">${p.perkPoints}</span></div>`;

    for (const key of P.SKILL_ORDER) {
      const def = P.SKILLS[key], s = p.skills[key];
      const need = P.skillXpNeeded(s.lvl);
      out += `<div class="detail" style="border-left:3px solid ${def.color}">
        <div style="display:flex;align-items:baseline;gap:8px">
          <h3 style="color:${def.color}">${def.name}</h3>
          <span style="font-family:var(--mono);color:var(--gold)">${s.lvl}</span>
          <span style="flex:1"></span>
        </div>
        <div class="flavor" style="margin-bottom:4px">${def.desc}</div>
        <div class="bar xp"><i style="width:${Math.min(100, s.xp / need * 100)}%"></i></div>
        <div style="margin-top:8px">${perkRows(key)}</div>
      </div>`;
    }
    return out;
  }

  function perkRows(skillKey) {
    const p = G.p;
    const list = Object.values(P.PERKS).filter(k => k.skill === skillKey).sort((a, b) => a.req - b.req);
    return list.map(perk => {
      const owned = !!p.perks[perk.id];
      const can = P.canTakePerk(p, perk.id);
      const locked = p.skills[skillKey].lvl < perk.req;
      const color = owned ? 'var(--gold)' : (locked ? 'var(--text-dim)' : 'var(--text)');
      return `<div class="row" style="opacity:${locked ? .55 : 1}" ${can ? `data-act="perk" data-perk="${perk.id}"` : ''}>
        <div class="txt">
          <div class="nm" style="color:${color}">${owned ? '◈ ' : ''}${esc(perk.name)} <small style="color:var(--text-dim);font-weight:400">— richiede ${perk.req}</small></div>
          <div class="sub" style="white-space:normal">${esc(perk.desc)}</div>
        </div>
        ${can ? '<div class="qty" style="color:var(--gold)">Sblocca</div>' : ''}
      </div>`;
    }).join('');
  }

  /* ---------------- Diario ---------------- */
  function viewQuests() {
    const p = G.p;
    const active = [], done = [];
    for (const id in p.quests) {
      const q = p.quests[id], def = D.quests[id];
      if (!def) continue;
      (q.done ? done : active).push({ q, def });
    }
    if (!active.length && !done.length) return '<div class="empty">Il diario è vuoto. Parla con qualcuno ad Ashford.</div>';

    const card = ({ q, def }) => {
      const stages = def.stages.map((s, i) => {
        const state = q.done || i < q.stage ? '✔' : (i === q.stage ? '▸' : '·');
        const cur = i === q.stage && !q.done;
        const prog = cur ? CV.Quests.progressText(p, def.id) : '';
        return `<div class="stat-line" style="opacity:${i > q.stage && !q.done ? .4 : 1}">
          <span>${state} ${esc(s.text)}</span><span class="v">${prog}</span></div>`;
      }).join('');
      return `<div class="detail" style="border-left:3px solid ${def.main ? 'var(--gold)' : 'var(--ash-4)'}">
        <h3 style="color:${def.main ? 'var(--gold)' : 'var(--text)'}">${def.main ? '❖ ' : ''}${esc(def.name)}</h3>
        <div class="flavor">${esc(def.summary)}</div>
        ${stages}
      </div>`;
    };

    let out = '';
    if (active.length) out += '<div class="sect">In corso</div>' + active.map(card).join('');
    if (done.length) out += '<div class="sect">Concluse</div>' + done.map(card).join('');
    return out;
  }

  /* ---------------- Mappa ---------------- */
  function viewMap() {
    const p = G.p;
    const z = G.zone;
    const url = miniMapUrl(z);
    const zones = D.zoneOrder.map(id => {
      const zd = D.zones[id];
      const seen = p.discovered[id];
      return `<div class="row" style="opacity:${seen ? 1 : .35}">
        <div class="txt">
          <div class="nm" style="color:${id === z.id ? 'var(--gold)' : 'var(--text)'}">${seen ? esc(zd.name) : '???'}</div>
          <div class="sub">${seen ? esc(zd.subtitle) : 'Non ancora esplorata'}</div>
        </div>
        ${id === z.id ? '<div class="qty" style="color:var(--gold)">qui</div>' : ''}
      </div>`;
    }).join('');

    return `<div class="sect">${esc(z.def.name)}</div>
      <img src="${url}" style="width:100%;image-rendering:pixelated;border:1px solid var(--ash-3);border-radius:6px;background:#0d0b10">
      <div class="hint">Il punto dorato sei tu. I rombi rossi sono i nemici che hai già visto.</div>
      <div class="sect">Valle di Cinder</div>
      <div class="list">${zones}</div>`;
  }

  function miniMapUrl(z) {
    const c = CV.Art.makeCanvas(z.w, z.h);
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(z.w, z.h);
    for (let i = 0; i < z.w * z.h; i++) {
      const key = CV.Art.TILE_KEYS[z.tiles[i]];
      const def = CV.Art.TILE_DEFS[key];
      const col = def ? def.base : '#000';
      const o = i * 4;
      img.data[o] = parseInt(col.slice(1, 3), 16);
      img.data[o + 1] = parseInt(col.slice(3, 5), 16);
      img.data[o + 2] = parseInt(col.slice(5, 7), 16);
      img.data[o + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    const T = CV.World.T;
    /* Punti d'interesse */
    ctx.fillStyle = '#ffd166';
    for (const e of z.exits) ctx.fillRect(Math.floor(e.x / T) - 1, Math.floor(e.y / T) - 1, 3, 3);
    ctx.fillStyle = '#c9a6ff';
    for (const n of z.npcs) ctx.fillRect(Math.floor(n.x / T), Math.floor(n.y / T), 2, 2);
    ctx.fillStyle = '#c33636';
    for (const e of G.enemies) if (!e.dead && e.aggro) ctx.fillRect(Math.floor(e.x / T), Math.floor(e.y / T), 2, 2);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(Math.floor(G.pe.x / T) - 1, Math.floor(G.pe.y / T) - 1, 3, 3);
    return c.toDataURL();
  }

  /* ---------------- Impostazioni ---------------- */

      </div>
      <div class="hint">
        <b>Joystick</b>: il pollice sinistro muove, i tasti a destra combattono.<br>

        </div>
      </div>
      <div class="seg" style="margin-bottom:6px">
        ${[['auto', 'Auto'], ['toggle', 'Interruttore'], ['hold', 'Tenere premuto']]
          .map(x => `<button class="${(s.blockMode || 'auto') === x[0] ? 'on' : ''}" data-act="blockmode" data-v="${x[0]}">${x[1]}</button>`).join('')}
      </div>
      <div class="hint">

      </div>

      <div class="sect">Grafica</div>
      <div class="opt-row">
        <div class="lbl">Qualità
          <small>In automatico il gioco parte alto e scende da solo se non regge i 60 fotogrammi.
          Ora attiva: <b>${{ low: 'bassa', medium: 'media', high: 'alta' }[CV.Render.getQuality()]}</b> · ${Math.round(G.lastFps)} fps</small>
        </div>
      </div>
      <div class="seg" style="margin-bottom:6px">
        ${[['auto', 'Auto'], ['high', 'Alta'], ['medium', 'Media'], ['low', 'Bassa']]
          .map(x => `<button class="${(s.quality || 'auto') === x[0] ? 'on' : ''}" data-act="quality" data-v="${x[0]}">${x[1]}</button>`).join('')}
      </div>
      <div class="hint">

        <b>Bassa</b>: nessun bagliore. Le transizioni fra terreni e i colori d'ambiente

      </div>

      <div class="sect">Audio</div>
      <div class="opt-row">

      </div>
      <div class="opt-row">
        <div class="lbl">Musica di sottofondo</div>

          <button class="${!s.music ? 'on' : ''}" data-act="music" data-v="0">No</button>

        </div>
      </div>
      <div class="btn-row" style="margin-top:10px">
        <button data-act="save" ${G.activeSaveKind === 'debug' ? 'disabled' : ''}>Salva ora</button>

      </div>` : ''}
      <div class="hint">${G.activeSaveKind === 'gameplay' ? 'Slot attivo: ' + G.activeSaveId.slice(-1) : 'Origine: snapshot protetto'} · Uccisioni: ${G.p.kills} · Morti: ${G.p.deaths} · Tempo: ${Math.floor(G.p.playtime / 60)} min</div>

  /* ---------------- Debug ---------------- */
  const debugSections = [['respawn', 'Respawn'], ['saves', 'Snapshot']];

  function viewDebugPanel() {
    if (debugTab === 'respawn') return viewDebugRespawn();
    if (debugTab === 'saves') return viewDebugSaves();
    return '';
  }

  function viewDebugSaves() {
    const snapshots = G.listSaveSlots().snapshots;
    return `<div class="opt-row">
      <div class="lbl">Snapshot protetto
        <small>Crea una copia che gli autosalvataggi non possono sovrascrivere. Puoi ripristinarla dalla schermata iniziale.</small>
      </div>
    </div>
    <div class="snapshot-create">
      <input type="text" maxlength="48" data-snapshot-label placeholder="Es. Prima del boss">
      <button data-act="debugsnapshot">Crea snapshot</button>
    </div>
    <div class="hint">Snapshot disponibili: ${snapshots.length} / 10</div>`;
  }

  const DEBUG_TIMERS = [
    ['enemyRespawnSeconds', 'Nemici comuni', 300],
    ['chestRespawnSeconds', 'Forzieri', 600],
    ['shrineRespawnSeconds', 'Santuari', 600]
  ];

  function viewDebugRespawn() {
    const dbg = G.settings.debug || (G.settings.debug = {});
    const inZone = !!G.zone && !G.zone.def.safe;

    const rows = DEBUG_TIMERS.map(([key, label, def]) => {
      const v = dbg[key] != null ? dbg[key] : def;
      return `<div class="opt-row">
        <div class="lbl">${label}</div>
        <input class="slider" type="number" min="0" step="5" value="${v}" data-act="dbgsecs" data-key="${key}" style="width:80px">
        <span style="margin-left:8px;color:var(--muted)">sec · ${(v / 60).toFixed(1)} min</span>
      </div>`;
    }).join('');

    return `
      <div class="opt-row">
        <div class="lbl">Tempo di respawn
          <small>Secondi reali da quando lo usi/uccidi/svuoti. I nemici unici e i boss restano
          permanenti per ora: li tratteremo a parte più avanti.</small>
        </div>
      </div>
      ${rows}

      <div class="opt-row" style="margin-top:10px">
        <div class="lbl">Respawn forzato — zona corrente
          <small>Ricostruisce subito i contenuti scelti, senza aspettare il timer.</small>
        </div>
      </div>
      <div class="btn-row">
