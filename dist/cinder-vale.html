        e.targetX = e.homeX + Math.cos(a) * r;
        e.targetY = e.homeY + Math.sin(a) * r;
      }
      const d2 = M.dist(e.x, e.y, e.targetX, e.targetY);
      if (d2 > 4) {
        const a = Math.atan2(e.targetY - e.y, e.targetX - e.x);
        const sp = def.speed * 0.4 * dt;
        W.moveWithCollision(G.zone, e, Math.cos(a) * sp, Math.sin(a) * sp);
        e.face = M.facingFromVec(Math.cos(a), Math.sin(a));
        e.moving = true;
      } else e.moving = false;
      e.state = 'idle';
      return;
    }

    e.face = M.facingFromVec(pe.x - e.x, pe.y - e.y);

    switch (e.state) {
      case 'idle':
      case 'chase': {
        e.state = 'chase';
        const ai = def.ai;
        let want = 0;
        if (ai === 'ranged') {
          const keep = def.keepDist || 110;
          if (dist > keep + 20) want = 1;
          else if (dist < keep - 30) want = -1;
          if (dist <= def.attackRange && e.stateT > 0.35) E.enterTelegraph(G, e, dist);
        } else {
          want = 1;
          if (dist <= def.attackRange + e.radius) E.enterTelegraph(G, e, dist);
        }
        if (want !== 0) {
          const sp = def.speed * dt * want;
          /* Piccolo scarto laterale: evita che il branco si sovrapponga in fila */
          const wob = Math.sin(e.animT * 3 + e.x) * 0.25;
          const a = toPlayer + wob * (ai === 'charger' ? 0.5 : 1);
          W.moveWithCollision(G.zone, e, Math.cos(a) * sp, Math.sin(a) * sp);
          e.moving = true;
        } else e.moving = false;

        /* Il boss lancia attacchi speciali a intervalli */
        if (def.ai === 'boss') {
          e.special -= dt;
          if (e.special <= 0) {
            e.special = e.hp / e.maxHp < 0.5 ? 4.2 : 6.5;
            e.state = 'special'; e.stateT = 0;
          }
        }
        break;
      }

      case 'telegraph': {
        e.moving = false;
        /* I ranged possono ancora ruotare verso il bersaglio */
        if (e.stateT >= def.telegraph) {
          e.state = 'attack'; e.stateT = 0;
          e.attackDir = toPlayer;
          if (def.ai === 'charger') e.lunge = 0.22;
          if (def.ai === 'ranged') {
            const dmg = def.dmg * e.dmgMult;
            const proj = E.makeProjectile(def.projectile || 'arrow', e.x, e.y, toPlayer, dmg, false,
              { aoe: def.projectile === 'fireball' ? 22 : 0 });
            G.projectiles.push(proj);
            CV.Audio.play(def.projectile === 'fireball' ? 'fire' : 'arrow');
          } else {
            CV.Audio.play('swing');
          }
        }
        break;
      }

      case 'attack': {
        if (def.ai === 'charger' && e.lunge > 0) {
          e.lunge -= dt;
          const sp = def.speed * 2.4 * dt;
          W.moveWithCollision(G.zone, e, Math.cos(e.attackDir) * sp, Math.sin(e.attackDir) * sp);
        }
        /* Finestra attiva del colpo in mischia */
        if (def.ai !== 'ranged' && e.stateT < 0.18) {
          const reach = def.attackRange + e.radius + 4;
          if (M.dist(e.x, e.y, pe.x, pe.y) < reach && !e.didHit) {
            const a = Math.atan2(pe.y - e.y, pe.x - e.x);
            if (Math.abs(M.angDelta(e.attackDir, a)) < 1.1) {
              e.didHit = true;
              E.hurtPlayer(G, def.dmg * e.dmgMult, e.x, e.y, {
                source: e, knock: def.ai === 'charger' ? 150 : 100,
                venom: def.venom || 0
              });
            }
          }
        }
        if (e.stateT >= 0.28) { e.state = 'recover'; e.stateT = 0; e.didHit = false; }
        break;
      }

      case 'special': {
        /* Attacco speciale del boss: anello di fuoco */
        e.moving = false;
        if (e.stateT > 0.8 && !e.didHit) {
          e.didHit = true;
          const n = e.hp / e.maxHp < 0.5 ? 12 : 8;
          for (let i = 0; i < n; i++) {
            const a = (i / n) * Math.PI * 2 + e.animT;
            G.projectiles.push(E.makeProjectile('fireball', e.x, e.y, a, def.dmg * 0.7 * e.dmgMult, false, { aoe: 18, life: 3.2 }));
          }
          CV.Audio.play('fire');
          G.shake(9, 0.3);
        }
        if (e.stateT > 1.4) { e.state = 'recover'; e.stateT = 0; e.didHit = false; }
        break;
      }

      case 'recover': {
        e.moving = false;
        if (e.stateT >= def.recovery) { e.state = 'chase'; e.stateT = 0; }
        break;
      }

      default:
        e.state = 'chase';
    }
  };

  /* ================= PROIETTILI ================= */
  E.updateProjectiles = function (G, dt) {
    const pe = G.pe;
    for (let i = G.projectiles.length - 1; i >= 0; i--) {
      const pr = G.projectiles[i];
      pr.t += dt;
      pr.life -= dt;
      const nx = pr.x + pr.vx * dt, ny = pr.y + pr.vy * dt;

      if (pr.life <= 0 || W.solidAt(G.zone, nx, ny)) {
        E.burst(G, pr);
        G.projectiles.splice(i, 1);
        continue;
      }
      pr.x = nx; pr.y = ny;

      if (pr.fromPlayer) {
        for (const e of G.enemies) {
          if (e.dead) continue;
          if (M.dist(pr.x, pr.y, e.x, e.y) < e.radius + pr.radius) {
            const p = G.p;
            let dmg = pr.dmg;
            E.hurtEnemy(G, e, dmg, { dir: pr.dir, knock: 70, knockDir: pr.dir, stagger: 0.2 });
            if (pr.aoe) E.splash(G, pr.x, pr.y, pr.aoe, dmg * 0.6, e);
            E.burst(G, pr);
            G.projectiles.splice(i, 1);
            break;
          }
        }
      } else if (!pe.dead) {
        if (M.dist(pr.x, pr.y, pe.x, pe.y) < pe.radius + pr.radius + 1) {
          E.hurtPlayer(G, pr.dmg, pr.x - pr.vx * 0.05, pr.y - pr.vy * 0.05, { knock: 70 });
          E.burst(G, pr);
          G.projectiles.splice(i, 1);
        }
      }
    }
  };

  E.splash = function (G, x, y, radius, dmg, skip) {
    for (const e of G.enemies) {
      if (e.dead || e === skip) continue;
      if (M.dist(x, y, e.x, e.y) < radius + e.radius)
        E.hurtEnemy(G, e, dmg, { dir: Math.atan2(e.y - y, e.x - x), knock: 60, knockDir: Math.atan2(e.y - y, e.x - x) });
    }
  };

  E.burst = function (G, pr) {
    const col = pr.kind === 'fireball' ? '#f06c3a' : '#a5713f';
    const n = pr.kind === 'fireball' ? 12 : 5;
    for (let i = 0; i < n; i++)
      G.particles.push(E.makeParticle(pr.x, pr.y, i % 3 ? col : '#ffd166', { speed: 90, life: 0.4, size: pr.kind === 'fireball' ? 3 : 2 }));
    if (pr.kind === 'fireball') CV.Audio.play('fire');
  };

  /* ================= PARTICELLE E TESTI ================= */
  E.updateFx = function (G, dt) {
    for (let i = G.particles.length - 1; i >= 0; i--) {
      const q = G.particles[i];
      q.t += dt;
      if (q.t >= q.life) { G.particles.splice(i, 1); continue; }
      q.x += q.vx * dt; q.y += q.vy * dt;
      q.vy += q.gravity * dt;
      q.vx *= 0.96; q.vy *= 0.98;
    }
    for (let i = G.floats.length - 1; i >= 0; i--) {
      const f = G.floats[i];
      f.t += dt;
      if (f.t >= f.life) { G.floats.splice(i, 1); continue; }
      f.y += f.vy * dt;
      f.vy *= 0.92;
    }
    for (let i = G.drops.length - 1; i >= 0; i--) {
      const d = G.drops[i];
      d.t += dt;
      d.y += d.vy * dt;
      d.vy = Math.min(0, d.vy + 120 * dt);
    }
  };

  CV.Ent = E;
})(typeof window !== 'undefined' ? window : globalThis);


/* ===== src/ui/hud.js ===== */
/* ============================================================
   INTERFACCIA DI GIOCO disegnata sul canvas a risoluzione nativa.
   Include i comandi a schermo: i cerchi disegnati qui coincidono
   esattamente con le aree di tocco calcolate in input.js.
   ============================================================ */
(function (root) {
  'use strict';
  const CV = root.CV || (root.CV = {});
  const D = CV.Data;
  const P = CV.Player;
  const M = CV.M;

  const H = {
    zoneBanner: 0, zoneName: '', zoneSub: '',
    bossRef: null, bossT: 0,
    tipText: '', tipT: 0
  };

  function showZone(name, sub) { H.zoneName = name; H.zoneSub = sub || ''; H.zoneBanner = 3.2; }
  function showTip(text) { H.tipText = text; H.tipT = 4.5; }
  function setBoss(e) { H.bossRef = e; H.bossT = e ? 4 : 0; }

  /* ---------------- Primitive di disegno ---------------- */
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function bar(ctx, x, y, w, h, frac, color, bg, label) {
    ctx.fillStyle = 'rgba(6,4,10,0.75)';
    roundRect(ctx, x - 1, y - 1, w + 2, h + 2, 3); ctx.fill();
    ctx.fillStyle = bg;
    roundRect(ctx, x, y, w, h, 2); ctx.fill();
    const fw = Math.max(0, Math.min(1, frac)) * w;
    if (fw > 0) {
      ctx.fillStyle = color;
      roundRect(ctx, x, y, fw, h, 2); ctx.fill();
      /* Riflesso in alto: dà volume alla barra */
      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      roundRect(ctx, x, y, fw, Math.max(1, h * 0.35), 2); ctx.fill();
    }
    if (label) {
      ctx.font = 'bold 9px ui-monospace, monospace';
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillText(label, x + w - 3, y + h / 2 + 0.5);
    }
  }

  function text(ctx, str, x, y, opt) {
    opt = opt || {};
    ctx.font = (opt.bold === false ? '' : 'bold ') + (opt.size || 12) + 'px ' + (opt.mono ? 'ui-monospace, monospace' : 'system-ui, -apple-system, "Segoe UI", sans-serif');
    ctx.textAlign = opt.align || 'left';
    ctx.textBaseline = opt.baseline || 'middle';
    if (opt.outline !== false) {
      ctx.lineWidth = opt.outlineW || 3;
      ctx.strokeStyle = 'rgba(6,4,10,0.85)';
      ctx.strokeText(str, x, y);
    }
    ctx.fillStyle = opt.color || '#d7d2e0';
    ctx.fillText(str, x, y);
  }

  /* ---------------- Icone dei pulsanti (vettoriali) ---------------- */
  function icon(ctx, kind, cx, cy, r, color) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = Math.max(2, r * 0.10);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const s = r * 0.5;

    switch (kind) {
      case 'attack':   /* spada */
        ctx.beginPath();
        ctx.moveTo(-s * 0.8, s * 0.9); ctx.lineTo(s * 0.85, -s * 0.85);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-s * 0.95, s * 0.25); ctx.lineTo(-s * 0.15, s * 1.05);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(s * 0.45, -s * 1.05); ctx.lineTo(s * 1.05, -s * 0.45);
        ctx.stroke();
        break;
      case 'block':    /* scudo */
        ctx.beginPath();
        ctx.moveTo(0, -s);
        ctx.lineTo(s * 0.85, -s * 0.55);
        ctx.lineTo(s * 0.7, s * 0.35);
        ctx.lineTo(0, s);
        ctx.lineTo(-s * 0.7, s * 0.35);
        ctx.lineTo(-s * 0.85, -s * 0.55);
        ctx.closePath();
        ctx.stroke();
        break;
      case 'dodge':    /* freccia di scatto */
        ctx.beginPath();
        ctx.moveTo(-s, 0); ctx.lineTo(s * 0.4, 0);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(s * 0.05, -s * 0.55); ctx.lineTo(s * 0.75, 0); ctx.lineTo(s * 0.05, s * 0.55);
        ctx.stroke();
        ctx.globalAlpha = 0.5;
        ctx.beginPath(); ctx.moveTo(-s * 1.05, -s * 0.5); ctx.lineTo(-s * 0.45, -s * 0.5); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-s * 1.05, s * 0.5); ctx.lineTo(-s * 0.45, s * 0.5); ctx.stroke();
        ctx.globalAlpha = 1;
        break;
      case 'cast':     /* fiamma */
        ctx.beginPath();
        ctx.moveTo(0, -s * 1.05);
        ctx.quadraticCurveTo(s * 0.9, -s * 0.1, s * 0.42, s * 0.62);
        ctx.quadraticCurveTo(0, s * 1.15, -s * 0.42, s * 0.62);
        ctx.quadraticCurveTo(-s * 0.9, -s * 0.1, 0, -s * 1.05);
        ctx.closePath();
        ctx.stroke();
        break;
      case 'interact': /* mano / punto esclamativo */
        ctx.beginPath();
        ctx.arc(0, 0, s * 0.85, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillRect(-r * 0.06, -s * 0.45, r * 0.12, s * 0.6);
        ctx.beginPath(); ctx.arc(0, s * 0.45, r * 0.08, 0, Math.PI * 2); ctx.fill();
        break;
      case 'menu':
        for (let i = -1; i <= 1; i++) {
          ctx.beginPath();
          ctx.moveTo(-s * 0.75, i * s * 0.5); ctx.lineTo(s * 0.75, i * s * 0.5);
          ctx.stroke();
        }
        break;
      case 'potion':   /* boccetta */
        ctx.beginPath();
        ctx.moveTo(-s * 0.32, -s * 0.9); ctx.lineTo(-s * 0.32, -s * 0.3);
        ctx.lineTo(-s * 0.7, s * 0.55);
        ctx.quadraticCurveTo(-s * 0.7, s * 0.95, -s * 0.2, s * 0.95);
        ctx.lineTo(s * 0.2, s * 0.95);
        ctx.quadraticCurveTo(s * 0.7, s * 0.95, s * 0.7, s * 0.55);
        ctx.lineTo(s * 0.32, -s * 0.3);
        ctx.lineTo(s * 0.32, -s * 0.9);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-s * 0.45, -s * 0.9); ctx.lineTo(s * 0.45, -s * 0.9);
        ctx.stroke();
        break;
    }
    ctx.restore();
  }

  /* Pulsante circolare: fondo, bordo, icona, eventuale ricarica. */
  function button(ctx, b, opts) {
    opts = opts || {};
    const pressed = opts.pressed;
    const dim = opts.disabled;
    ctx.save();
    ctx.globalAlpha = dim ? 0.32 : (pressed ? 0.95 : 0.78);

    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = pressed ? 'rgba(90,70,60,0.85)' : 'rgba(18,14,24,0.62)';
    ctx.fill();

    ctx.lineWidth = 2;
    ctx.strokeStyle = opts.accent || 'rgba(150,140,165,0.75)';
    ctx.stroke();

    /* Anello di ricarica */
    if (opts.cooldown != null && opts.cooldown > 0) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r - 3, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - opts.cooldown));
      ctx.strokeStyle = 'rgba(240,108,58,0.9)';
      ctx.lineWidth = 3;
      ctx.stroke();
    }
    icon(ctx, b.icon, b.x, b.y, b.r, opts.iconColor || (dim ? '#6b6577' : '#e6e1ef'));
    ctx.restore();

    if (opts.label) {
      text(ctx, opts.label, b.x, b.y + b.r + 11, { size: 9, align: 'center', color: 'rgba(215,210,224,0.6)' });
    }
    if (opts.badge) {
      ctx.save();
      ctx.beginPath(); ctx.arc(b.x + b.r * 0.72, b.y - b.r * 0.72, 9, 0, Math.PI * 2);
      ctx.fillStyle = '#a5451f'; ctx.fill();
      ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.restore();
      text(ctx, String(opts.badge), b.x + b.r * 0.72, b.y - b.r * 0.72 + 0.5, { size: 10, align: 'center', color: '#ffd166', outline: false });
    }
  }

  /* ================================================================
     DISEGNO COMPLETO DELL'INTERFACCIA
     ================================================================ */
  function draw(ctx, G, dt) {
    const p = G.p, pe = G.pe;
    const L = CV.Input.layout;
    const ins = L.insets;
    const W = L.w, Hh = L.h;

    /* ---------- Barre vitali ---------- */
    const bx = ins.left + 12, by = ins.top + 14;
    const bw = Math.min(150, W * 0.42);
    bar(ctx, bx, by, bw, 9, p.hp / p.stats.maxHp, '#c33636', 'rgba(40,16,16,0.85)');
    bar(ctx, bx, by + 13, bw * 0.86, 6, p.sp / p.stats.maxSp, '#7cc46a', 'rgba(20,36,18,0.85)');
    bar(ctx, bx, by + 22, bw * 0.86, 6, p.mp / p.stats.maxMp, '#6fb3ff', 'rgba(16,26,44,0.85)');

    text(ctx, Math.ceil(p.hp) + '/' + p.stats.maxHp, bx + bw - 4, by + 4.5,
      { size: 9, align: 'right', color: 'rgba(255,255,255,0.7)', mono: true, outlineW: 2 });

    /* Livello */
    ctx.save();
    ctx.beginPath(); ctx.arc(bx - 2, by + 4, 0, 0, 0); ctx.restore();
    text(ctx, 'Liv ' + p.level, bx, by + 38, { size: 11, color: '#ffd166' });
    const xpFrac = p.xp / P.xpForLevel(p.level);
    bar(ctx, bx + 42, by + 35, 56, 4, xpFrac, '#c9a6ff', 'rgba(30,24,42,0.85)');

    /* Sovraccarico */
    if (p.stats.encumbered) {
      text(ctx, 'SOVRACCARICO', bx, by + 52, { size: 10, color: '#f06c3a' });
    }

    /* ---------- Effetti attivi ---------- */
    if (p.effects.length) {
      let ex = bx, ey = by + (p.stats.encumbered ? 66 : 52);
      for (const e of p.effects) {
        const def = D.effects[e.key];
        if (!def) continue;
        ctx.save();
        ctx.beginPath(); ctx.arc(ex + 8, ey, 8, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(10,8,16,0.8)'; ctx.fill();
        ctx.strokeStyle = def.color; ctx.lineWidth = 2; ctx.stroke();
        ctx.restore();
        text(ctx, def.name[0], ex + 8, ey, { size: 10, align: 'center', color: def.color });
        text(ctx, Math.ceil(e.t) + 's', ex + 8, ey + 15, { size: 8, align: 'center', color: 'rgba(215,210,224,0.55)' });
        ex += 24;
      }
    }

    /* ---------- Obiettivo di missione ---------- */
    const activeQ = currentObjective(p);
    if (activeQ) {
      const qy = Hh - ins.bottom - 18;
      text(ctx, '❖ ' + activeQ.name, ins.left + 12, qy - 15, { size: 11, color: '#ffd166' });
      const prog = CV.Quests.progressText(p, activeQ.id);
      text(ctx, activeQ.text + (prog ? '  ' + prog : ''), ins.left + 12, qy,

    }

    /* ---------- Barra del boss ---------- */
    if (H.bossRef && !H.bossRef.dead) {
      const e = H.bossRef;
      const w = Math.min(280, W * 0.7), x = (W - w) / 2, y = ins.top + 16;
      text(ctx, e.name, W / 2, y - 8, { size: 12, align: 'center', color: '#ffd166' });
      bar(ctx, x, y, w, 8, e.hp / e.maxHp, '#c33636', 'rgba(40,16,16,0.9)');
    } else if (H.bossRef) {
      H.bossT -= dt;
      if (H.bossT <= 0) H.bossRef = null;
    }

    /* ---------- Nome della zona all'ingresso ---------- */
    if (H.zoneBanner > 0) {
      H.zoneBanner -= dt;
      const a = M.clamp(H.zoneBanner > 2.6 ? (3.2 - H.zoneBanner) / 0.6 : Math.min(1, H.zoneBanner / 0.8), 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      text(ctx, H.zoneName, W / 2, Hh * 0.26, { size: 22, align: 'center', color: '#ffd166' });
      if (H.zoneSub) text(ctx, H.zoneSub.toUpperCase(), W / 2, Hh * 0.26 + 22, { size: 10, align: 'center', color: 'rgba(215,210,224,0.7)' });

    if (touch) {

      const w = P.equipped(p, 'weapon');
      const staCost = w ? w.stamCost : 8;
      button(ctx, L.attack, {

        cooldown: pe.state === 'attack' || pe.state === 'recover' ? 1 - M.clamp(pe.stateT / 0.32, 0, 1) : 0,
        accent: 'rgba(240,108,58,0.8)'
      });
      button(ctx, L.dodge, { pressed: CV.Input.down('dodge'), disabled: p.sp < dodgeCost(p) });
      button(ctx, L.block, { pressed: pe.blocking, accent: pe.blocking && pe.blockT < 0.25 ? '#ffd166' : null });
      button(ctx, L.cast, { pressed: CV.Input.down('cast'), disabled: p.mp < castCost(p), accent: 'rgba(111,179,255,0.8)' });

      if (CV.Input.hasInteract()) {
        button(ctx, L.interact, { pressed: CV.Input.down('interact'), accent: '#ffd166', label: G.interactLabel || 'Usa' });
      }
    } else {
      /* Promemoria dei tasti su PC */
      drawKeyHints(ctx, L, G);
    }

    /* Etichetta di ciò che si può usare, sopra al personaggio */
    if (G.interactTarget && !touch) {
      const s = CV.Render.worldToScreen(G.interactTarget.x, G.interactTarget.y - 22);
      text(ctx, '[E] ' + (G.interactLabel || 'Usa'), s.x, s.y, { size: 11, align: 'center', color: '#ffd166' });
    } else if (G.interactTarget && touch) {
      const s = CV.Render.worldToScreen(G.interactTarget.x, G.interactTarget.y - 22);
      text(ctx, G.interactLabel || 'Usa', s.x, s.y, { size: 11, align: 'center', color: '#ffd166' });
    }

    /* Schermata di morte */
    if (pe.dead) {
      ctx.fillStyle = 'rgba(20,4,4,' + M.clamp(pe.stateT * 0.6, 0, 0.72) + ')';
      ctx.fillRect(0, 0, W, Hh);
      if (pe.stateT > 0.7) {
        text(ctx, 'SEI CADUTO', W / 2, Hh * 0.42, { size: 26, align: 'center', color: '#c33636' });
        text(ctx, 'La cenere ti copre. Ma non oggi.', W / 2, Hh * 0.42 + 26, { size: 12, align: 'center', color: 'rgba(215,210,224,0.7)' });
      }
    }
  }

  function drawStick(ctx, L) {
    const st = CV.Input.stick;
    const z = L.stickZone;
    if (!st) {
      /* Suggerimento discreto quando il pollice non tocca */
      ctx.save();
      ctx.globalAlpha = 0.16;
      ctx.strokeStyle = '#d7d2e0'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(z.x0 + 78, z.y1 - 108, 40, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(z.x0 + 78, z.y1 - 108, 17, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
      return;
    }
    const dx = st.x - st.ox, dy = st.y - st.oy;
    const len = Math.hypot(dx, dy), maxR = 46;
    const f = len > maxR ? maxR / len : 1;
    const kx = st.ox + dx * f, ky = st.oy + dy * f;

    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.arc(st.ox, st.oy, maxR, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(18,14,24,0.5)'; ctx.fill();
    ctx.strokeStyle = 'rgba(180,172,196,0.7)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.globalAlpha = 0.85;
    ctx.beginPath(); ctx.arc(kx, ky, 20, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(200,190,215,0.55)'; ctx.fill();
    ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }

  function drawTapMarker(ctx, G) {
    const t = CV.Input.moveTarget;
    if (!t) return;
    const time = CV.Render.state.time;
    ctx.save();
    ctx.globalAlpha = 0.55 + Math.sin(time * 8) * 0.15;
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 2;
    const r = 12 + Math.sin(time * 8) * 2;
    ctx.beginPath(); ctx.arc(t.x, t.y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(t.x - 5, t.y); ctx.lineTo(t.x + 5, t.y);
    ctx.moveTo(t.x, t.y - 5); ctx.lineTo(t.x, t.y + 5);
    ctx.stroke();
    ctx.restore();
  }

  function drawKeyHints(ctx, L, G) {
    const x = L.w - L.insets.right - 14, y0 = L.h - L.insets.bottom - 12;
    const rows = [
      ['WASD', 'muovi'],
      ['Click sin. / J', 'attacca'],
      ['Click des. / K', 'para'],
      ['Spazio', 'schiva'],
      ['Q', 'incantesimo'],
      ['E', 'interagisci'],
      ['I  L  P  M', 'zaino, diario, abilità, mappa']
    ];
    ctx.save();
    ctx.globalAlpha = 0.42;
    rows.forEach((r, i) => {
      const y = y0 - (rows.length - 1 - i) * 15;
      text(ctx, r[0], x - 132, y, { size: 10, color: '#ffd166', align: 'right', outlineW: 2 });
      text(ctx, r[1], x - 126, y, { size: 10, color: '#d7d2e0', align: 'left', outlineW: 2 });
    });
    ctx.restore();
  }

  /* ---------------- Supporto ---------------- */
  function currentObjective(p) {
    let best = null;
    for (const id in p.quests) {
      const q = p.quests[id], def = D.quests[id];
      if (!q || q.done || !def) continue;
      const st = def.stages[q.stage];
      if (!st) continue;
      const cand = { id: id, name: def.name, text: st.text, main: !!def.main };
      if (!best || (cand.main && !best.main)) best = cand;
    }
    return best;
  }

  function countPotions(p) {
    let n = 0;
    for (const it of p.inv) if (it.potion && !it.potion.harmful) n += it.qty;
    return n;
  }

  function dodgeCost(p) { return p.perks.nimble ? 14 : 22; }
  function castCost(p) { return Math.round((18 - p.skills.destruction.lvl * 0.06) * (p.perks.focus ? 0.7 : 1)); }

  CV.Hud = { draw, showZone, showTip, setBoss, countPotions, dodgeCost, castCost, currentObjective, text, roundRect };
})(typeof window !== 'undefined' ? window : globalThis);


/* ===== src/ui/ui.js ===== */
/* ============================================================
   MENU E SCHERMATE (DOM sopra il canvas).
   Il DOM è la scelta giusta per liste lunghe e testo scorrevole:
   su mobile eredita gratis lo scroll fluido e i tocchi precisi.
   ============================================================ */
(function (root) {
  'use strict';
  const CV = root.CV || (root.CV = {});
  const D = CV.Data;
  const P = CV.Player;
  const M = CV.M;

  let G = null;
  let el = null, toastsEl = null;
  let current = null;         /* pannello aperto */
  let ctxData = {};           /* dati del pannello corrente */
  let invTab = 'all', invSel = null;
  let smithTab = 'forge';
  let alchPick = [];
  let shopTab = 'buy';
  let dlgNpc = null, dlgNode = null;

  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* ---------------- Icone come immagini ---------------- */
  const iconCache = new Map();
  function iconUrl(res) {
    const key = res ? (res.icon || res.id) + '|' + (res.potion ? res.potion.color : '') : 'none';
    if (iconCache.has(key)) return iconCache.get(key);
    const src = CV.Art.iconFor(res);
    let url = '';
    if (src) {
      const c = CV.Art.makeCanvas(16, 16);
      c.getContext('2d').drawImage(src, 0, 0);
      url = c.toDataURL();
    }
    iconCache.set(key, url);
    return url;
  }

  function init(game) {
    G = game;
    el = document.getElementById('overlay');
    toastsEl = document.getElementById('toasts');
    el.addEventListener('click', onClick);
  }

  function isOpen() { return !!current; }
  function currentPanel() { return current; }

  function open(panel, data) {
    current = panel;
    ctxData = data || {};
    el.className = 'open' + (panel === 'dialogue' ? ' dialogue-mode' : '') + (panel === 'title' ? ' title-mode' : '');
    CV.Input.setEnabled(false);
    render();
  }

  function close() {
    current = null;
    ctxData = {};
    el.className = '';
    el.innerHTML = '';
    CV.Input.setEnabled(true);
    CV.Input.clearAll();
  }

  function toast(msg, cls) {
    const d = document.createElement('div');
    d.className = 'toast' + (cls ? ' ' + cls : '');
    d.textContent = msg;
    toastsEl.appendChild(d);
    setTimeout(() => d.remove(), 2600);
  }

  /* ================================================================
     ROUTER DI RENDER
     ================================================================ */
  function render() {
    if (!current) return;
    switch (current) {
      case 'title': el.innerHTML = viewTitle(); break;
      case 'menu': el.innerHTML = viewMenu(); break;
      case 'dialogue': el.innerHTML = viewDialogue(); break;
      case 'shop': el.innerHTML = viewShop(); break;
      case 'smith': el.innerHTML = viewSmith(); break;
      case 'alchemy': el.innerHTML = viewAlchemy(); break;
      case 'death': el.innerHTML = viewDeath(); break;
      case 'victory': el.innerHTML = viewVictory(); break;
    }
  }

  /* ================================================================
     SCHERMATA DEL TITOLO
     ================================================================ */
  function viewTitle() {
    const has = ctxData.hasSave;
    return `<div class="title-screen">
      <h1>CINDER VALE</h1>
      <div class="tagline">Sette anni di cenere</div>
      <div class="menu">
        ${has ? '<button class="primary" data-act="continue">Continua</button>' : ''}
        <button class="${has ? '' : 'primary'}" data-act="newgame">${has ? 'Nuova partita' : 'Inizia'}</button>
        <button data-act="settings">Impostazioni</button>
      </div>
      <div class="ver">v1.0 — tocca lo schermo o usa WASD</div>
    </div>`;
  }

  /* ================================================================
     MENU PRINCIPALE (a schede)
     ================================================================ */
  function viewMenu() {
    const tab = ctxData.tab || 'inv';
    const tabs = [
      ['inv', 'Zaino'], ['skills', 'Abilità'], ['quests', 'Diario'],
      ['map', 'Mappa'], ['settings', 'Opzioni']
    ];
    let body = '';
    if (tab === 'inv') body = viewInventory();
    else if (tab === 'skills') body = viewSkills();
    else if (tab === 'quests') body = viewQuests();
    else if (tab === 'map') body = viewMap();
    else body = viewSettings();

    return `<div class="panel">
      <div class="panel-head">
        <h2>${esc(G.p.name)} — Liv ${G.p.level}</h2>
        <span style="font-size:12px;color:var(--gold);font-family:var(--mono)">${G.p.gold} ⬤</span>
        <button class="close-x" data-act="close">✕</button>
      </div>
      <div class="tabs">
        ${tabs.map(t => `<div class="tab${t[0] === tab ? ' active' : ''}" data-act="tab" data-tab="${t[0]}">${t[1]}</div>`).join('')}
      </div>
      <div class="panel-body">${body}</div>
    </div>`;
  }

  /* ---------------- Zaino ---------------- */
  function viewInventory() {
    const p = G.p;
    const filters = [['all', 'Tutto'], ['weapon', 'Armi'], ['armor', 'Difesa'], ['potion', 'Consumo'], ['material', 'Materiali']];
    const rows = [];

    const entries = p.inv.map(it => ({ it: it, res: P.resolve(it) })).filter(x => x.res);
    entries.sort((a, b) => {
      const ea = P.isEquipped(p, a.it.uid) ? 0 : 1, eb = P.isEquipped(p, b.it.uid) ? 0 : 1;
      if (ea !== eb) return ea - eb;
      return a.res.name.localeCompare(b.res.name);
    });

    for (const { it, res } of entries) {
      if (!matchFilter(res, invTab)) continue;
      const eq = P.isEquipped(p, it.uid);
      rows.push(`<div class="row rar-${res.rar}${invSel === it.uid ? ' sel' : ''}${eq ? ' equipped' : ''}" data-act="pick" data-uid="${it.uid}">
        <img class="ic" src="${iconUrl(res)}" alt="">
        <div class="txt">
          <div class="nm rar-${res.rar}">${esc(res.name)}</div>
          <div class="sub">${esc(subLine(res))}</div>
        </div>
        <div class="qty">${it.qty > 1 ? '×' + it.qty : ''}</div>
      </div>`);
    }

    const sel = invSel ? P.findUid(p, invSel) : null;
    const detail = sel ? viewItemDetail(sel) : '';
    const st = p.stats;

    return `
      <div class="tabs" style="padding:0 0 8px;background:transparent">
        ${filters.map(f => `<div class="tab${invTab === f[0] ? ' active' : ''}" data-act="filter" data-f="${f[0]}">${f[1]}</div>`).join('')}
      </div>
      <div class="stat-line"><span>Carico</span><span class="v ${st.encumbered ? 'neg' : ''}">${st.weight} / ${st.carry}</span></div>
      <div class="stat-line"><span>Danno · Armatura</span><span class="v">${dmgLabel()} · ${st.armor.toFixed(1)}</span></div>
      ${detail}
      <div class="sect">Oggetti</div>
      <div class="list">${rows.join('') || '<div class="empty">Niente qui dentro.</div>'}</div>`;
  }

  function dmgLabel() {
    const w = P.equipped(G.p, 'weapon');
    if (!w) return (4 * G.p.stats.damage).toFixed(1);
    return (w.dmg * G.p.stats.damage).toFixed(1);
  }

  function matchFilter(res, f) {
    if (f === 'all') return true;
    if (f === 'weapon') return res.type === 'weapon';
    if (f === 'armor') return res.type === 'armor' || res.type === 'trinket';
    if (f === 'potion') return res.type === 'potion' || res.type === 'ingredient';
    if (f === 'material') return res.type === 'material' || res.type === 'misc';
    return true;
  }

  function subLine(res) {
    if (res.type === 'weapon') return 'Danno ' + res.dmg + ' · Vel ' + res.spd.toFixed(2) + ' · ' + res.weight.toFixed(1) + 'kg';
    if (res.type === 'armor') return 'Armatura ' + res.armor + ' · Res ' + Math.round(res.res * 100) + '% · ' + res.weight.toFixed(1) + 'kg';
    if (res.type === 'trinket') return Object.keys(res.bonus || {}).map(k => bonusLabel(k, res.bonus[k])).join(' · ');
    if (res.type === 'potion') return res.potion.desc;
    if (res.type === 'ingredient') return knownEffects(res.id);
    return (D.rarity[res.rar] ? '' : '') + res.value + ' ⬤ · ' + res.weight.toFixed(1) + 'kg';
  }

  function knownEffects(id) {
    const ing = D.ingredients[id];
    if (!ing) return '';
    return ing.fx.map((k, i) => P.knowsEffect(G.p, id, i) ? D.effects[k].name : '???').join(', ');
  }

  function bonusLabel(k, v) {
    const names = { maxHp: 'Vita', maxMp: 'Etere', maxSp: 'Vigore', armor: 'Armatura', damage: 'Danno', moveSpeed: 'Velocità', mpRegen: 'Rig. etere', spRegen: 'Rig. vigore', res: 'Resistenza' };
    const pct = (k === 'damage' || k === 'moveSpeed' || k === 'res');
    return (names[k] || k) + ' +' + (pct ? Math.round(v * 100) + '%' : v);
  }

  function viewItemDetail(it) {
    const res = P.resolve(it);
    if (!res) return '';
    const p = G.p;
    const eq = P.isEquipped(p, it.uid);
    const acts = [];
    if (res.slot) acts.push(eq ? `<button data-act="unequip" data-slot="${res.slot}">Togli</button>` : `<button class="primary" data-act="equip" data-uid="${it.uid}">Equipaggia</button>`);
    if (res.type === 'potion') acts.push(`<button class="primary" data-act="drink" data-uid="${it.uid}">Bevi</button>`);
    if (res.type === 'ingredient') acts.push(`<button data-act="eat" data-uid="${it.uid}">Assaggia</button>`);
    if (!res.quest) acts.push(`<button data-act="drop" data-uid="${it.uid}">Getta</button>`);

    let stats = '';
    if (res.type === 'weapon') {
      stats += line('Danno', res.dmg + (res.fire ? ' (+' + res.fire + ' fuoco)' : ''));
      stats += line('Velocità', res.spd.toFixed(2) + '×');
      stats += line('Portata', res.reach);
      stats += line('Vigore per colpo', res.stamCost);
    } else if (res.type === 'armor') {
      stats += line('Armatura', res.armor);
      stats += line('Resistenza', Math.round(res.res * 100) + '%');
    } else if (res.type === 'trinket') {
      for (const k in res.bonus) stats += line(bonusLabel(k, res.bonus[k]), '');
    } else if (res.type === 'potion') {
      for (const f of res.potion.fx) {
        const d = D.effects[f.key];
        stats += line(d.name, D.fmtMag(f.key, f.mag) + (f.dur ? ' / ' + f.dur + 's' : ''));
      }
    } else if (res.type === 'ingredient') {
      const ing = D.ingredients[res.id];
      ing.fx.forEach((k, i) => {
        stats += line(P.knowsEffect(p, res.id, i) ? D.effects[k].name : '??? sconosciuto', '');
      });
    }
    if (res.up > 0) stats += line('Tempra', '+' + res.up);
    stats += line('Peso', res.weight.toFixed(1) + ' kg');
    stats += line('Valore', res.value + ' ⬤');

    return `<div class="detail">
      <h3 class="nm rar-${res.rar}">${esc(res.name)}</h3>
      ${res.flavor ? `<div class="flavor">« ${esc(res.flavor)} »</div>` : ''}
      ${stats}
      <div class="btn-row" style="margin-top:10px">${acts.join('')}</div>
    </div>`;
  }

  function line(k, v) {
    return `<div class="stat-line"><span>${esc(k)}</span><span class="v">${esc(v)}</span></div>`;
  }

  /* ---------------- Abilità e talenti ---------------- */
  function viewSkills() {
    const p = G.p;
    let out = `<div class="hint">Le abilità salgono <b>usandole</b>: colpisci di lama per far salire Lama, para per far salire Blocco. Ogni livello del personaggio dà un punto talento.</div>`;
    out += `<div class="sect">Punti talento disponibili: <span style="color:var(--gold)">${p.perkPoints}</span></div>`;

    for (const key of P.SKILL_ORDER) {
      const def = P.SKILLS[key], s = p.skills[key];
      const need = P.skillXpNeeded(s.lvl);
      out += `<div class="detail" style="border-left:3px solid ${def.color}">
        <div style="display:flex;align-items:baseline;gap:8px">
          <h3 style="color:${def.color}">${def.name}</h3>
          <span style="font-family:var(--mono);color:var(--gold)">${s.lvl}</span>
          <span style="flex:1"></span>
        </div>
        <div class="flavor" style="margin-bottom:4px">${def.desc}</div>
        <div class="bar xp"><i style="width:${Math.min(100, s.xp / need * 100)}%"></i></div>
        <div style="margin-top:8px">${perkRows(key)}</div>
      </div>`;
    }
    return out;
  }

  function perkRows(skillKey) {
    const p = G.p;
    const list = Object.values(P.PERKS).filter(k => k.skill === skillKey).sort((a, b) => a.req - b.req);
    return list.map(perk => {
      const owned = !!p.perks[perk.id];
      const can = P.canTakePerk(p, perk.id);
      const locked = p.skills[skillKey].lvl < perk.req;
      const color = owned ? 'var(--gold)' : (locked ? 'var(--text-dim)' : 'var(--text)');
      return `<div class="row" style="opacity:${locked ? .55 : 1}" ${can ? `data-act="perk" data-perk="${perk.id}"` : ''}>
        <div class="txt">
          <div class="nm" style="color:${color}">${owned ? '◈ ' : ''}${esc(perk.name)} <small style="color:var(--text-dim);font-weight:400">— richiede ${perk.req}</small></div>
          <div class="sub" style="white-space:normal">${esc(perk.desc)}</div>
        </div>
        ${can ? '<div class="qty" style="color:var(--gold)">Sblocca</div>' : ''}
      </div>`;
    }).join('');
  }

  /* ---------------- Diario ---------------- */
  function viewQuests() {
    const p = G.p;
    const active = [], done = [];
    for (const id in p.quests) {
      const q = p.quests[id], def = D.quests[id];
      if (!def) continue;
      (q.done ? done : active).push({ q, def });
    }
    if (!active.length && !done.length) return '<div class="empty">Il diario è vuoto. Parla con qualcuno ad Ashford.</div>';

    const card = ({ q, def }) => {
      const stages = def.stages.map((s, i) => {
        const state = q.done || i < q.stage ? '✔' : (i === q.stage ? '▸' : '·');
        const cur = i === q.stage && !q.done;
        const prog = cur ? CV.Quests.progressText(p, def.id) : '';
        return `<div class="stat-line" style="opacity:${i > q.stage && !q.done ? .4 : 1}">
          <span>${state} ${esc(s.text)}</span><span class="v">${prog}</span></div>`;
      }).join('');
      return `<div class="detail" style="border-left:3px solid ${def.main ? 'var(--gold)' : 'var(--ash-4)'}">
        <h3 style="color:${def.main ? 'var(--gold)' : 'var(--text)'}">${def.main ? '❖ ' : ''}${esc(def.name)}</h3>
        <div class="flavor">${esc(def.summary)}</div>
        ${stages}
      </div>`;
    };

    let out = '';
    if (active.length) out += '<div class="sect">In corso</div>' + active.map(card).join('');
    if (done.length) out += '<div class="sect">Concluse</div>' + done.map(card).join('');
    return out;
  }

  /* ---------------- Mappa ---------------- */
  function viewMap() {
    const p = G.p;
    const z = G.zone;
    const url = miniMapUrl(z);
    const zones = D.zoneOrder.map(id => {
      const zd = D.zones[id];
      const seen = p.discovered[id];
      return `<div class="row" style="opacity:${seen ? 1 : .35}">
        <div class="txt">
          <div class="nm" style="color:${id === z.id ? 'var(--gold)' : 'var(--text)'}">${seen ? esc(zd.name) : '???'}</div>
          <div class="sub">${seen ? esc(zd.subtitle) : 'Non ancora esplorata'}</div>
        </div>
        ${id === z.id ? '<div class="qty" style="color:var(--gold)">qui</div>' : ''}
      </div>`;
    }).join('');

    return `<div class="sect">${esc(z.def.name)}</div>
      <img src="${url}" style="width:100%;image-rendering:pixelated;border:1px solid var(--ash-3);border-radius:6px;background:#0d0b10">
      <div class="hint">Il punto dorato sei tu. I rombi rossi sono i nemici che hai già visto.</div>
      <div class="sect">Valle di Cinder</div>
      <div class="list">${zones}</div>`;
  }

  function miniMapUrl(z) {
    const c = CV.Art.makeCanvas(z.w, z.h);
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(z.w, z.h);
    for (let i = 0; i < z.w * z.h; i++) {
      const key = CV.Art.TILE_KEYS[z.tiles[i]];
      const def = CV.Art.TILE_DEFS[key];
      const col = def ? def.base : '#000';
      const o = i * 4;
      img.data[o] = parseInt(col.slice(1, 3), 16);
      img.data[o + 1] = parseInt(col.slice(3, 5), 16);
      img.data[o + 2] = parseInt(col.slice(5, 7), 16);
      img.data[o + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    const T = CV.World.T;
    /* Punti d'interesse */
    ctx.fillStyle = '#ffd166';
    for (const e of z.exits) ctx.fillRect(Math.floor(e.x / T) - 1, Math.floor(e.y / T) - 1, 3, 3);
    ctx.fillStyle = '#c9a6ff';
    for (const n of z.npcs) ctx.fillRect(Math.floor(n.x / T), Math.floor(n.y / T), 2, 2);
    ctx.fillStyle = '#c33636';
    for (const e of G.enemies) if (!e.dead && e.aggro) ctx.fillRect(Math.floor(e.x / T), Math.floor(e.y / T), 2, 2);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(Math.floor(G.pe.x / T) - 1, Math.floor(G.pe.y / T) - 1, 3, 3);
    return c.toDataURL();
  }

  function viewShop() {
    const shop = D.shops[ctxData.shop];
    const p = G.p;
    let rows = '';

    if (shopTab === 'buy') {
      rows = shop.stock.map(id => {
        const res = P.resolve({ id: id, qty: 1, rar: 'common', aff: [], up: 0 });
        if (!res) return '';
        const price = Math.max(1, Math.round(res.value * shop.buyMult));
        const afford = p.gold >= price;
        return `<div class="row rar-${res.rar}" style="opacity:${afford ? 1 : .5}" data-act="buy" data-id="${id}" data-price="${price}">
          <img class="ic" src="${iconUrl(res)}" alt="">
          <div class="txt"><div class="nm">${esc(res.name)}</div><div class="sub">${esc(subLine(res))}</div></div>
          <div class="qty" style="color:${afford ? 'var(--gold)' : 'var(--blood)'}">${price} ⬤</div>
        </div>`;
      }).join('');
    } else {
      const entries = p.inv.map(it => ({ it, res: P.resolve(it) })).filter(x => x.res && !x.res.quest && !P.isEquipped(p, x.it.uid));
      rows = entries.map(({ it, res }) => {
        const price = Math.max(1, Math.round(res.value * shop.sellMult));
        return `<div class="row rar-${res.rar}" data-act="sell" data-uid="${it.uid}" data-price="${price}">
          <img class="ic" src="${iconUrl(res)}" alt="">
          <div class="txt"><div class="nm">${esc(res.name)}</div><div class="sub">${esc(subLine(res))}</div></div>
          <div class="qty" style="color:var(--gold)">${price} ⬤${it.qty > 1 ? ' ×1' : ''}</div>
        </div>`;
      }).join('') || '<div class="empty">Non hai nulla da vendere.</div>';
    }

    return `<div class="panel">
      <div class="panel-head">
        <h2>${esc(shop.name)}</h2>
        <span style="font-size:12px;color:var(--gold);font-family:var(--mono)">${p.gold} ⬤</span>
        <button class="close-x" data-act="close">✕</button>
      </div>
      <div class="tabs">
        <div class="tab${shopTab === 'buy' ? ' active' : ''}" data-act="shoptab" data-t="buy">Compra</div>
        <div class="tab${shopTab === 'sell' ? ' active' : ''}" data-act="shoptab" data-t="sell">Vendi</div>
      </div>
      <div class="panel-body"><div class="list">${rows}</div></div>
    </div>`;
  }

  function viewSmith() {
    const p = G.p;
    let body = '';

    if (smithTab === 'forge') {
      body = D.smithRecipes.map((r, i) => {
        const chk = CV.Smith.canCraft(p, r);
        const costs = Object.keys(r.cost).map(id => {
          const have = P.count(p, id);
          const need = r.cost[id];
          const nm = D.base(id).name;
          return `<span style="color:${have >= need ? 'var(--stam)' : 'var(--blood)'}">${esc(nm)} ${have}/${need}</span>`;
        }).join(' · ');
        return `<div class="row" style="opacity:${chk.ok ? 1 : .55}" data-act="forge" data-i="${i}">
          <img class="ic" src="${iconUrl(P.resolve({ id: r.out, qty: 1, rar: 'common', aff: [], up: 0 }))}" alt="">
          <div class="txt">
            <div class="nm">${esc(r.name)}${r.qty > 1 ? ' ×' + r.qty : ''}</div>
            <div class="sub" style="white-space:normal">${costs}</div>
          </div>
          <div class="qty" style="color:${p.skills.smithing.lvl >= r.skill ? 'var(--text-dim)' : 'var(--blood)'}">Fab ${r.skill}</div>
        </div>`;
      }).join('');
    } else {
      const gear = p.inv.map(it => ({ it, res: P.resolve(it) }))
        .filter(x => x.res && (x.res.type === 'weapon' || x.res.type === 'armor'));
      body = gear.map(({ it, res }) => {
        const chk = CV.Smith.canUpgrade(p, it);
        const costTxt = chk.cost ? Object.keys(chk.cost).map(id => `${esc(D.base(id).name)} ${P.count(p, id)}/${chk.cost[id]}`).join(' · ') : (chk.why || '');
        return `<div class="row rar-${res.rar}" style="opacity:${chk.ok ? 1 : .55}" data-act="temper" data-uid="${it.uid}">
          <img class="ic" src="${iconUrl(res)}" alt="">
          <div class="txt">
            <div class="nm rar-${res.rar}">${esc(res.name)}</div>
            <div class="sub" style="white-space:normal">${esc(costTxt)}</div>
          </div>
          <div class="qty" style="color:var(--gold)">+${it.up}</div>
        </div>`;
      }).join('') || '<div class="empty">Non hai equipaggiamento da temprare.</div>';
    }

    return `<div class="panel">
      <div class="panel-head">
        <h2>Fucina</h2>
        <span style="font-size:12px;color:var(--ember)">Fabbrilità ${p.skills.smithing.lvl}</span>
        <button class="close-x" data-act="close">✕</button>
      </div>
      <div class="tabs">
        <div class="tab${smithTab === 'forge' ? ' active' : ''}" data-act="smithtab" data-t="forge">Forgia</div>
        <div class="tab${smithTab === 'temper' ? ' active' : ''}" data-act="smithtab" data-t="temper">Tempra</div>
      </div>
      <div class="panel-body"><div class="list">${body}</div></div>
    </div>`;
  }

  /* ================================================================
     ALCHIMIA
     ================================================================ */
  function viewAlchemy() {
    const p = G.p;
    const owned = [];
    for (const id in D.ingredients) {
      const n = P.count(p, id);
      if (n > 0) owned.push({ id, n });
    }

    const rows = owned.map(({ id, n }) => {
      const ing = D.ingredients[id];
      const res = P.resolve({ id: id, qty: n, rar: 'common', aff: [], up: 0 });
      const picked = alchPick.indexOf(id) >= 0;
      return `<div class="row${picked ? ' sel' : ''}" data-act="alchpick" data-id="${id}">
        <img class="ic" src="${iconUrl(res)}" alt="">
        <div class="txt">
          <div class="nm">${esc(ing.name)}</div>
          <div class="sub">${esc(knownEffects(id))}</div>
        </div>
        <div class="qty">×${n}</div>
      </div>`;
    }).join('') || '<div class="empty">Non hai ingredienti. Cerca i cespugli nel mondo.</div>';

    /* Anteprima della miscela */
    let preview = '<div class="hint">Scegli <b>due</b> ingredienti. Si attivano solo le virtù che hanno <b>in comune</b>: è l\'unica regola dell\'alchimia.</div>';
    if (alchPick.length === 2) {
      const shared = CV.Alch.preview(p, alchPick[0], alchPick[1]);
      const mult = CV.Alch.power(p);
      if (!shared.length) {
        preview = `<div class="detail"><h3 style="color:var(--blood)">Nessuna virtù in comune</h3>
          <div class="flavor">Il miscuglio si annerirebbe. Prova un'altra combinazione — imparerai comunque qualcosa.</div></div>`;
      } else {
        preview = `<div class="detail"><h3 style="color:var(--gold)">Risultato previsto</h3>
          ${shared.map(s => {
            const d = D.effects[s.key];
            const mag = d.mode === 'instant' ? Math.round(d.base * mult) : (Math.round(d.base * mult * 100) / 100);
            return line(s.known ? d.name : '??? virtù nascosta',
              s.known ? D.fmtMag(s.key, mag) + (d.dur ? ' / ' + Math.round(d.dur * (1 + p.skills.alchemy.lvl * 0.006)) + 's' : '') : '');
          }).join('')}
        </div>`;
      }
    }

    return `<div class="panel">
      <div class="panel-head">
        <h2>Calderone</h2>
        <span style="font-size:12px;color:var(--ember)">Alchimia ${p.skills.alchemy.lvl}</span>
        <button class="close-x" data-act="close">✕</button>
      </div>
      <div class="panel-body">
        ${preview}
        <div class="sect">Ingredienti — selezionati ${alchPick.length}/2</div>
        <div class="list">${rows}</div>
      </div>
      <div class="panel-foot">
        <div class="btn-row">
          <button data-act="alchclear">Azzera</button>
          <button class="primary" data-act="brew" ${alchPick.length === 2 ? '' : 'disabled'}>Prepara</button>
        </div>
      </div>
    </div>`;
  }

  /* ================================================================
     GESTIONE DEI CLIC
     ================================================================ */
  function onClick(ev) {
    const t = ev.target.closest('[data-act]');
    if (!t) return;
    const act = t.dataset.act;
    CV.Audio.unlock();
    if (act !== 'volume') CV.Audio.play('ui');

    switch (act) {
      case 'close': close(); break;
      case 'tab': ctxData.tab = t.dataset.tab; render(); break;
      case 'filter': invTab = t.dataset.f; render(); break;
      case 'pick': invSel = (invSel === t.dataset.uid ? null : t.dataset.uid); render(); break;

      case 'equip': {
        P.equip(G.p, t.dataset.uid);
        CV.Audio.play('pickup');
        render();
        break;
      }
      case 'unequip': P.unequipSlot(G.p, t.dataset.slot); render(); break;
      case 'drink': {
        const it = P.findUid(G.p, t.dataset.uid);
        if (it && CV.Alch.drink(G.p, it)) { CV.Audio.play('potion'); toast('Hai bevuto ' + it.potion.name, 'good'); }
        invSel = null; render();
        break;
      }
      case 'eat': {
        const it = P.findUid(G.p, t.dataset.uid);
        if (!it) break;
        const id = it.id;
        const r = CV.Alch.eat(G.p, id);
        if (r.ok) {
          const nm = D.effects[r.key].name;
          toast(r.isNew ? 'Nuova virtù scoperta: ' + nm : 'Virtù: ' + nm, r.isNew ? 'gold' : 'good');
          CV.Audio.play('potion');
        }
        if (P.count(G.p, id) === 0) invSel = null;
        render();
        break;
      }
      case 'drop': {
        const it = P.findUid(G.p, t.dataset.uid);
        if (it) { G.dropItemToGround(it); toast('Gettato'); }
        invSel = null; render();
        break;
      }
      case 'perk': {
        if (P.takePerk(G.p, t.dataset.perk)) {
          CV.Audio.play('level');
          toast('Talento sbloccato: ' + P.PERKS[t.dataset.perk].name, 'gold');
        }
        render();
        break;
      }

      /* Impostazioni */
      case 'scheme': {
        G.settings.scheme = t.dataset.v;
        CV.Input.setScheme(t.dataset.v);
        G.saveSettings();
        render();
        break;
      }
      case 'quality': {
        G.settings.quality = t.dataset.v;
        G.applyQuality();
        G.saveSettings();
        render();
        break;
      }
      case 'blockmode': {
        G.settings.blockMode = t.dataset.v;
        G.saveSettings();
        render();
        break;
      }
      case 'music': {
        G.settings.music = t.dataset.v === '1';
        G.applyAudioSettings();
        if (G.settings.music) G.refreshMusic();
        G.saveSettings();
        render();
        break;
      }
      case 'save': G.save(); toast('Partita salvata', 'good'); break;
      case 'title': G.toTitle(); break;
      case 'wipe': {
        if (t.dataset.confirm === '1') { G.wipeSave(); }
        else { t.dataset.confirm = '1'; t.textContent = 'Sicuro? Tocca ancora'; }
        break;
      }
      case 'respawn': G.respawn(); break;

      /* Dialogo */
      case 'dlgopt': {
        const node = ctxData.node;
        const opts = CV.Dialogue.options(G.p, node);
        const o = opts[parseInt(t.dataset.i, 10)];
        if (o) applyDialogueOption(o);
        break;
      }

      /* Mercante */
      case 'shoptab': shopTab = t.dataset.t; render(); break;
      case 'buy': {
        const price = parseInt(t.dataset.price, 10);
        if (G.p.gold < price) { CV.Audio.play('error'); toast('Oro insufficiente', 'bad'); break; }
        G.p.gold -= price;
        P.addById(G.p, t.dataset.id, 1);
        P.recalc(G.p);
        CV.Audio.play('coin');
        toast('Acquistato: ' + D.base(t.dataset.id).name, 'good');
        render();
        break;
      }
      case 'sell': {
        const it = P.findUid(G.p, t.dataset.uid);
        if (!it) break;
        G.p.gold += parseInt(t.dataset.price, 10);
        P.removeUid(G.p, it.uid, 1);
        P.recalc(G.p);
        CV.Audio.play('coin');
        render();
        break;
      }

      /* Fucina */
      case 'smithtab': smithTab = t.dataset.t; render(); break;
      case 'forge': {
        const r = D.smithRecipes[parseInt(t.dataset.i, 10)];
        const evs = [];
        const res = CV.Smith.craft(G.p, r, G.rng, evs);
        G.pushEvents(evs);
        if (res.ok) {
          CV.Audio.play('craft');
          const nm = P.resolve(res.item).name;
          toast('Forgiato: ' + nm + (res.free ? ' (materiali recuperati)' : ''), 'gold');
        } else { CV.Audio.play('error'); toast(res.why, 'bad'); }
        render();
        break;
      }
      case 'temper': {
        const it = P.findUid(G.p, t.dataset.uid);
        if (!it) break;
        const evs = [];
        const res = CV.Smith.upgrade(G.p, it, evs);
        G.pushEvents(evs);
        if (res.ok) { CV.Audio.play('craft'); toast('Temprato a +' + it.up, 'gold'); }
        else { CV.Audio.play('error'); toast(res.why, 'bad'); }
        render();
        break;
      }

      /* Alchimia */
      case 'alchpick': {
        const id = t.dataset.id;
        const i = alchPick.indexOf(id);
        if (i >= 0) alchPick.splice(i, 1);
        else { alchPick.push(id); if (alchPick.length > 2) alchPick.shift(); }
        render();
        break;
      }
      case 'alchclear': alchPick = []; render(); break;
      case 'brew': {
        const evs = [];
        const res = CV.Alch.brew(G.p, alchPick[0], alchPick[1], evs);
        G.pushEvents(evs);
        if (res.ok) { CV.Audio.play('potion'); toast('Preparato: ' + res.potion.name, 'gold'); alchPick = []; }
        else { CV.Audio.play('error'); toast(res.why, 'bad'); if (res.learned) alchPick = []; }
        render();
        break;
      }

      /* Titolo */
      case 'newgame': G.newGame(); break;
      case 'continue': G.continueGame(); break;
      case 'settings': open('menu', { tab: 'settings' }); break;
    }
  }

  /* Slider del volume */
  document.addEventListener('input', (ev) => {
    const t = ev.target;
    if (t && t.dataset && t.dataset.act === 'volume') {
      G.settings.volume = parseInt(t.value, 10) / 100;
      G.applyAudioSettings();
      G.saveSettings();
    }
  });

  function applyDialogueOption(o) {
    const p = G.p;
    const evs = [];
    let closeAfter = false, next = null;

    if (o.act) {
      const a = o.act;
      if (a.startQuest) { CV.Quests.start(p, a.startQuest, evs); }
      if (a.advance) { CV.Quests.advance(p, a.advance, evs); }
      if (a.give) P.addById(p, a.give[0], a.give[1]);
      if (a.take) P.removeById(p, a.take[0], a.take[1]);
      if (a.gold) p.gold += a.gold;
      if (a.xp) P.gainXp(p, a.xp, evs);
      if (a.flag) p.flags[a.flag] = true;
      if (a.shop) { G.pushEvents(evs); open('shop', { shop: a.shop }); return; }
      if (a.smith) { G.pushEvents(evs); smithTab = 'forge'; open('smith', {}); return; }
      if (a.alchemy) { G.pushEvents(evs); alchPick = []; open('alchemy', {}); return; }
      if (a.close) closeAfter = true;
    }
    G.pushEvents(evs);

    if (o.to) next = CV.Dialogue.nodeById(ctxData.npc.id, o.to);
    if (closeAfter || !next) {
      if (next) { ctxData.node = next; render(); return; }
      close();
      G.refreshNpcMarkers();
      return;
    }
    ctxData.node = next;
    render();
  }

  /* ---------------- API pubblica ---------------- */
  function openDialogue(npc) {
    const node = CV.Dialogue.rootFor(G.p, npc.id);
    if (!node) return;
    open('dialogue', { npc: npc, node: node });
  }

  CV.UI = {
    init, open, close, isOpen, currentPanel, toast, render,
    openDialogue,
    openSmith: () => { smithTab = 'forge'; open('smith', {}); },
    openAlchemy: () => { alchPick = []; open('alchemy', {}); },
    openShop: (id) => { shopTab = 'buy'; open('shop', { shop: id }); },
    openMenu: (tab) => { open('menu', { tab: tab || 'inv' }); },
    openTitle: (hasSave) => open('title', { hasSave: hasSave }),
    openDeath: () => open('death', {}),
    openVictory: () => open('victory', {})
  };
